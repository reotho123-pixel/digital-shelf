/* ================= 设置页：手势转场（推拉门） =================
   上级页面留在原地（轻微缩小），设置页从右侧推上来覆盖它。
   按住左边缘往右拖 = 亲手推门，位移直接等于进度；松手按距离判定。 */
const OVERLAY_ID = 'scr-settings';
let overlayAnimating = false;

function goSettings(){
  renderSettings();
  const scr = $('#' + OVERLAY_ID);
  scr.scrollTop = 0;
  openOverlay(scr);
}

function openOverlay(scr){
  const phone = $('.phone');
  cancelAllHolds();
  overlayAnimating = true;
  // 基础状态先落到位（万一动画不执行，元素也是正确位置，不会卡在屏外）
  scr.style.transform = '';
  scr.classList.add('on');
  phone.classList.add('covered');
  const w = phone.getBoundingClientRect().width;

  if (FX.motionOff){ overlayAnimating = false; return; }
  // fill:'none'：动画只负责"入场过程"，结束后自动回到基础状态（正确位置）
  const anim = scr.animate([
    { transform:`translateX(${w}px)` },
    { transform:'translateX(0)' }
  ], { duration:340, easing:'cubic-bezier(.22,1,.36,1)' });
  const done = () => { overlayAnimating = false; };
  anim.onfinish = done;
  anim.oncancel = done;
  setTimeout(done, 420);   // 兜底：动画不推进时也能解锁
}

/* progress: 0 = 完全挡在前面，1 = 完全推到屏外（露出上级页面） */
function setOverlayProgress(scr, progress){
  const phone = $('.phone');
  const w = phone.getBoundingClientRect().width;
  const p = Math.max(0, Math.min(1, progress));
  scr.style.transform = `translateX(${(p * w).toFixed(1)}px)`;
  // 上级页面随进度轻微放大回来，形成层次
  $$('.phone > .screen:not(.overlay)').forEach(el => {
    el.style.transform = `scale(${(0.97 + p * 0.03).toFixed(4)})`;
  });
}

/* 关闭：可以指定起点进度（手势中断时从当前位置继续收尾） */
function closeSettings(fromProgress){
  const scr = $('#' + OVERLAY_ID);
  const phone = $('.phone');
  if (!scr.classList.contains('on')) return;

  const finish = () => {
    scr.classList.remove('on');
    scr.style.transform = '';
    phone.classList.remove('covered');
    $$('.phone > .screen:not(.overlay)').forEach(el => {
      el.style.transform = '';
      el.style.filter = '';
    });
    overlayAnimating = false;
  };

  if (FX.motionOff){ finish(); return; }

  overlayAnimating = true;
  const w = phone.getBoundingClientRect().width;
  const start = (typeof fromProgress === 'number') ? fromProgress : 0;
  // fill:'none' —— 动画结束即回到基础状态，由 finish() 收掉 .on
  const anim = scr.animate([
    { transform:`translateX(${(start * w).toFixed(1)}px)` },
    { transform:`translateX(${w}px)` }
  ], { duration: 300, easing:'cubic-bezier(.32,.72,0,1)' });
  anim.onfinish = finish;
  anim.oncancel = finish;
  setTimeout(finish, 380);   // 兜底
}

on('#qSettings', 'click', goSettings);
// 返回按钮始终可用（手势是增强，不是唯一入口）
on('#stBack', 'click', () => closeSettings());

/* ---------- 手势：在设置页上按住右滑 = 推门 ---------- */
(function initOverlayGesture(){
  const phone = $('.phone');
  let dragging = false, startX = 0, startY = 0, locked = null, w = 0, progress = 0;

  const scr = () => $('#' + OVERLAY_ID);

  const onDown = e => {
    const s = scr();
    if (!s || !s.classList.contains('on') || overlayAnimating) return;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    locked = null; progress = 0; dragging = true;
    w = phone.getBoundingClientRect().width;
  };

  const onMove = e => {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;

    if (locked === null){
      // 方向锁：横向明显大于纵向才算推门，否则交回页面滚动
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) locked = 'x';
      else if (Math.abs(dy) > 10) { dragging = false; return; }
      else return;
      if (locked === 'x') phone.classList.add('dragging-overlay');
    }
    if (e.cancelable) e.preventDefault();

    // 只允许往右推（往左是橡皮筋，位移 ×0.32）
    const raw = dx;
    progress = raw >= 0 ? (raw / w) : (raw / w) * 0.32;
    progress = Math.max(-0.06, Math.min(1, progress));
    setOverlayProgress(scr(), progress);
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    phone.classList.remove('dragging-overlay');
    if (locked !== 'x') return;
    const s = scr();
    // 唯一完成判据：拖过页宽 55%（快速轻扫不算，避免误关）
    if (progress > 0.55){ closeSettings(progress); locked = null; return; }

    // 没拖够 → 从当前位置弹回，不跳回起点
    const cur = Math.max(0, progress) * w;
    if (FX.motionOff){ setOverlayProgress(s, 0); locked = null; return; }

    overlayAnimating = true;
    const anim = s.animate([
      { transform:`translateX(${cur.toFixed(1)}px)` },
      { transform:'translateX(0)' }
    ], { duration: 280, easing:'cubic-bezier(.32,.72,0,1)', fill:'both' });
    const back = () => {
      try { anim.cancel(); } catch(e){}
      s.style.transform = '';
      setOverlayProgress(s, 0);
      overlayAnimating = false;
    };
    anim.onfinish = back;
    anim.oncancel = back;
    setTimeout(back, 340);   // 兜底
    locked = null;
  };

  phone.addEventListener('touchstart', onDown, { passive: true });
  phone.addEventListener('touchmove', onMove, { passive: false });
  phone.addEventListener('touchend', onUp);
  phone.addEventListener('touchcancel', onUp);
  phone.addEventListener('mousedown', e => onDown(e));
  window.addEventListener('mousemove', e => { if (dragging) onMove(e); });
  window.addEventListener('mouseup', () => { if (dragging) onUp(); });
})();

/* --- 分类调顺序 --- */
/* 设置页里每个分类右边的 ↑↓ 按钮。分类顺序存在 CATS 的 order 字段上，
   renderCatChips / renderGoalCats 都按 order 排，所以改完要一起刷新。
   ★ 分类卡网格已经删了，原来那句「长按分类卡也能改顺序」失效 —— 这是现在唯一的调序入口。 */
function moveCat(id, dir){
  const i = CATS.findIndex(c => c.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= CATS.length) return;
  // 老数据的 CATS 没有 order 字段（初始数据就是），先按当前数组位置全部编号，
  // 否则 a/b 的 order 都是 9999，交换等于没换。
  if (CATS.some(c => typeof c.order !== 'number')){
    CATS.forEach((c, k) => { c.order = k; });
  }
  const a = CATS[i], b = CATS[j];
  const t = a.order; a.order = b.order; b.order = t;
  // 数组本身也按 order 排一次，让 chip 行（按数组顺序渲染）和分类目标（按 order 排）一致
  CATS.sort((x, y) => (x.order ?? 9999) - (y.order ?? 9999));
  renderSettings(); renderCatChips(); renderItems();
  toast(`「${a.name}」已${dir < 0 ? '上移' : '下移'}`);
}

on('#stBody', 'click', e => {
  // 物品分类调顺序 / 改名 / 删除 / 新建
  const up = e.target.closest('[data-catup]');
  if (up){ moveCat(up.dataset.catup, -1); return; }
  const dn = e.target.closest('[data-catdown]');

  const rn = e.target.closest('[data-renamecat]');

/* --- 分类删除（条目归入未分类） --- */
function delCatModal(id){
  const c = CATS.find(x => x.id === id);
  if (!c) return;
  const n = stCatCount(c);
  openModal(`
    <h3>删除「${c.name}」？</h3>
    <p class="mhint">${n > 0
      ? `这个分类下有 ${n} 条物品，删除后会归入「未分类」，不会丢。`
      : '这个分类下还没有物品，可以放心删。'}</p>
    <div class="mrow">
      <button class="btn" id="dcCancel">取消</button>
      <button class="btn dan" id="dcOk">删除</button>
    </div>
  `);
  $('#dcCancel').addEventListener('click', closeModal);
  $('#dcOk').addEventListener('click', () => {
    const orphans = ITEMS.filter(i => i.c === c.id);
    orphans.forEach(i => { i.c = 'none'; });
    // 只有真有物品要安置时才补「未分类」，空删除不留垃圾分类
    if (orphans.length && !CATS.some(x => x.id === 'none')){
      CATS.push({ id:'none', name:'未分类', tone:'#e6e6ea' });
    }
    CATS.splice(CATS.findIndex(x => x.id === c.id), 1);
    // 删掉的正好是当前筛选的分类 → 回到不筛选
    if (state.cat === c.id) state.cat = 'all';
    closeModal();
    renderSettings(); renderCatChips(); renderItems();
    toast(`已删除分类「${c.name}」`);
  });
}

/* --- 导出备份 --- */
function exportJSONText(){
  return JSON.stringify({
    version: 1,
    exportedAt: new Date().toISOString(),
    cats: CATS,
    items: ITEMS,
  }, null, 2);
}

function backupStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* 「下载」这条路在电脑上最顺，但在 iPhone 从主屏（standalone）打开时
   Safari 会直接忽略 a.download —— 点了毫无反应，也没有任何提示。
   所以这里不把宝全押在下载上：
     1) 先试着下载；
     2) 同时把内容摆到一个可全选、可长按复制的文本框里，并说明「没出现文件就用它」。
   用户至少总有一条能走通，不会像之前那样点完一片安静。 */
function exportBackup(){
  const text = exportJSONText();
  const name = `收纳备份-${backupStamp()}.json`;

  let downloaded = false;
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    downloaded = true;
  } catch (err) {
    downloaded = false;
  }

  openModal(`
    <h3>备份已生成</h3>
    <p class="mhint">${ITEMS.length} 条物品 · ${CATS.length} 个分类，含照片<br>
      电脑上应已弹出下载；<b>手机上没看到文件</b>，就点下面的框全选复制，粘到备忘录或发给自己留存。</p>
    <div class="fld">
      <label>备份内容（${name}）</label>
      <textarea id="bkText" rows="7" readonly
        style="width:100%;border:2.1px solid var(--ink);background:#fff;border-radius:12px 5px 13px 6px/6px 13px 5px 12px;padding:10px 12px;font-family:monospace;font-size:11px;line-height:1.4;color:var(--ink2);outline:none;resize:none;-webkit-user-select:text;user-select:text"></textarea>
    </div>
    <div class="mrow">
      <button class="btn" id="bkCopy">全选复制</button>
      <button class="btn pri" id="bkDone">完成</button>
    </div>
  `);
  // 内容用 value 灌进去而不是拼进模板，避免 JSON 里的引号/反引号打断 HTML
  const ta = $('#bkText');
  ta.value = text;
  toast(downloaded ? `已导出 ${ITEMS.length} 条物品` : `备份已生成，请复制下方内容`);

  $('#bkDone').addEventListener('click', closeModal);
  $('#bkCopy').addEventListener('click', () => {
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard){
      navigator.clipboard.writeText(ta.value)
        .then(() => toast('已复制，去找个地方粘贴保存'))
        .catch(() => toast('请长按文本框手动全选复制'));
      return;
    }
    toast(ok ? '已复制，去找个地方粘贴保存' : '请长按文本框手动全选复制');
  });
}

/* mode: 'replace' 覆盖 | 'merge' 合并 */
function applyBackup(d, mode){
  // 备份里图片是 dataURL 直接带着的，不用额外处理
  // ★ 只取白名单字段：旧备份里的 like / uses / lastUse / note 直接丢掉，
  //   否则这些已删功能的字段会从备份里「复活」，一直跟着数据走。
  const ITEM_FIELDS = ['id','n','c','q','ic','season','st','order','photo'];
  const pick = (o, keys) => { const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };
  const inItems = (d.items || []).map(i => pick(i, ITEM_FIELDS));
  // id 用唯一生成器，不要用 'bk-i'+序号：合并模式下会和库里已有的撞车
  const inIds = new Set();
  inItems.forEach(i => {
    if (!i.id || inIds.has(i.id)) i.id = newItemId();
    inIds.add(i.id);
    // ★ 待处理状态已删除：旧备份里的 todo 一律转成在用中，别让它变成隐形条目
    if (!i.st || i.st === 'todo') i.st = 'inuse';
  });

  if (mode === 'replace'){
    CATS  = (d.cats || []).map(c => { const r = { id:c.id, name:c.name, tone:c.tone }; if (typeof c.order === 'number') r.order = c.order; return r; });
    ITEMS = inItems;
  } else {
    // ---- 合并 ----
    // 1) 分类：按名字去重，备份里没有的分类补进来
    const mergeCats = (cur, inc) => {
      inc.forEach(ic => {
        const hit = cur.find(c => c.name === ic.name);
        if (!hit){
          // 分类只留 id/name/tone：备份里的 goal 已不再使用
          cur.push({ id:'mg-' + Math.random().toString(36).slice(2, 8), name: ic.name, tone: ic.tone || '#dfe3c8' });
        }
      });
    };
    mergeCats(CATS, d.cats || []);

    // 2) 物品：同名 + 同分类 → 合并数量；否则新增
    let added = 0, merged = 0;
    inItems.forEach(ii => {
      const cName = ((d.cats || []).find(c => c.id === ii.c) || {}).name;
      const targetCat = CATS.find(c => c.name === cName) || CATS.find(c => c.id === ii.c);
      const dup = ITEMS.find(x => x.n === ii.n && (!targetCat || x.c === targetCat.id));
      if (dup){
        dup.q = (dup.q || 1) + (ii.q || 1);          // 数量相加
        if (!dup.photo && ii.photo) dup.photo = ii.photo;   // 没图的补图
        merged++;
      } else {
        // 只搬白名单字段：旧备份里的 like / uses / lastUse / note 不再带进来
        ITEMS.push({ id:'mg-i' + Math.random().toString(36).slice(2, 8),
          n: ii.n, q: ii.q || 1, ic: ii.ic || '', season: ii.season || '',
          st: ii.st || 'inuse', photo: ii.photo || null,
          c: targetCat ? targetCat.id : ii.c });
        added++;
      }
    });

    renderSettings(); renderCatChips();
    renderItems();
    saveSoon();
    return { added, merged };
  }

  renderSettings(); renderCatChips();
  renderItems();
  saveSoon();
  return { added: inItems.length, merged: 0 };
}

/* ================= 持久化：IndexedDB =================
   图片存 Blob（不用 base64，省约 1/3 空间）；其余数据存 JSON。
   没有数据库环境时自动降级为「不保存」，页面照常能用。 */
const DB_NAME = 'digital-shelf';
const DB_VER  = 1;

function openDB(){
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VER); }
    catch (e){ resolve(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
    // 隐私模式或库被占用时可能一直挂起，1.5 秒后放弃（界面已经先渲染了，不影响使用）
    setTimeout(() => resolve(null), 1500);
  });
}

/* 收集要存的整份状态 */
function snapshotState(){
  return {
    version: 2,
    savedAt: Date.now(),
    cats: CATS.map(c => ({ ...c })),
    // 图片单独存，这里只留标记，避免 JSON 里塞大字符串
    items: ITEMS.map(i => { const { photo, ...rest } = i; return { ...rest, hasPhoto: !!photo }; }),
  };
}

async function saveNow(){
  if (!db || suppressSave) return;
  try {
    const tx = db.transaction(['kv', 'photos'], 'readwrite');
    const kv = tx.objectStore('kv');
    const ph = tx.objectStore('photos');

    kv.put(snapshotState(), 'state');
    // 图片：dataURL → Blob 后存（Blob 更省空间）
    const all = [...ITEMS.map(i => ({ id:'item:' + i.id, d:i.photo })),
             ];
    all.forEach(({ id, d }) => {
      if (d) ph.put(dataURLtoBlob(d), id);
      else ph.delete(id);
    });
    // 清理已删条目的图片
    const keys = await new Promise(res => {
      const r = ph.getAllKeys();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => res([]);
    });
    const alive = new Set(all.filter(x => x.d).map(x => x.id));
    keys.forEach(k => { if (!alive.has(k)) ph.delete(k); });
  } catch (e) {
    console.warn('保存失败', e);
  }
}

/* 防抖保存：连续改动只写一次 */
function saveSoon(){
  if (!db || suppressSave) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}

/* 页面隐藏/关闭时立刻落盘，避免防抖窗口内丢改动 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && db && !suppressSave){
    clearTimeout(saveTimer);
    saveNow();
  }
  // ★ 从后台切回前台时，把 chip 指示块强制对齐到当前位置。
  //   页面在后台时 rAF 会被浏览器暂停，弹簧动画会停在半路（回到前台才继续跑，
  //   但也有极小概率因为长时间不推进而卡住）。这里补一次静态对齐兜底。
  if (document.visibilityState === 'visible'){
    requestAnimationFrame(() => syncAllChipInds(false));
  }
});
window.addEventListener('pagehide', () => {
  if (db && !suppressSave){ clearTimeout(saveTimer); saveNow(); }
});

function dataURLtoBlob(dataURL){
  try {
    const [head, body] = dataURL.split(',');
    const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
    const bin = atob(body);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  } catch (e){ return null; }
}

function blobToDataURL(blob){
  return new Promise(resolve => {
    if (!blob) return resolve(null);
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(blob);
  });
}

/* 启动时读库 */
async function loadFromDB(){
  db = await openDB();
  if (!db){ dbReady = false; return false; }
  dbReady = true;
  try {
    const tx = db.transaction(['kv', 'photos'], 'readonly');
    const kv = tx.objectStore('kv');
    const ph = tx.objectStore('photos');
    const state = await new Promise(res => {
      const r = kv.get('state');
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
    if (!state) return false;   // 首次使用 → 保留种子数据

    // 恢复图片
    const getPhoto = id => new Promise(res => {
      const r = ph.get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });

    suppressSave = true;

    // ★ 分类也只按白名单取字段：seed 里的 goal 是历史遗留（目标功能已删），
    //   旧库里的同理，都不要再带进来。
    const catPick = c => { const r = { id:c.id, name:c.name, tone:c.tone }; if (typeof c.order === 'number') r.order = c.order; return r; };
    CATS = (state.cats || CATS).map(catPick);

    // ★ 物品只按白名单取字段：喜欢程度（like）、使用次数（uses/lastUse）、备注（note）
    //   这些功能已经整块删除，旧库里还存着，如果 {...i} 全量拷进来就会一直留着，
    //   下次保存又写回库 —— 那就是"不用的字段越堆越多"。这里直接丢掉。
    const ITEM_FIELDS = ['id','n','c','q','ic','season','st','order'];
    const pick = (o, keys) => { const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };
    ITEMS = (state.items || []).map(i => ({ ...pick(i, ITEM_FIELDS), photo: null, hasPhoto: !!i.hasPhoto }));
    // ★ 旧库里的 st:'todo'（待处理已删）要转成「在用中」再无效 ——
    //   否则这些条目在任何状态下都筛不出来，等于凭空消失。
    let todoFixed = 0;
    ITEMS.forEach(i => { if (i.st === 'todo'){ i.st = 'inuse'; todoFixed++; } });
    if (todoFixed) console.log('[极简] 待处理已移除，' + todoFixed + ' 条转入在用中');

    // 并发取回图片
    await Promise.all([
      ...ITEMS.map(async i => {
        if (!i.hasPhoto) return;
        const b = await getPhoto('item:' + i.id);
        if (b) i.photo = await blobToDataURL(b);
      })
    ]);

    // 图片取回之后再修重复 id：改 id 会让 photos 里的键对不上，
    // 所以必须等图都进内存了再改。改完的下一次保存会把新 id 落盘。
    const fixedDup = repairDuplicateItemIds();
    if (fixedDup){
      suppressSave = false;
      saveNow();
      suppressSave = true;
      console.warn('[极简] 修复了 ' + fixedDup + ' 条重复 id 的物品');
    }

    suppressSave = false;
    return true;
  } catch (e) {
    console.warn('读取失败', e);
    suppressSave = false;
    return false;
  }
}

// 分类网格 #catGrid、#qAddItem、#qAddApp、#backHome 都已随总览页/软件页删除，绑定一并去掉

// 列表页筛选 · 底部 Tab 栏 + 分类抽屉
/* ★ 关键：选中态的 class 切换必须发生在 chipsReflow 的 mutate 回调**里面** ——
   FLIP 靠「改之前量一次、改之后再量一次」求位移，如果切换放在回调外面，
   after 会和 before 完全一样，算出的位移是 0，动画就不会播。

   ★ 为什么委托在 document 上，而不是 #tabbar：
     1) 「消耗中」会把 #catRow 整个从 DOM 摘掉，切回来时 ensureCatRow() 重建的
        是全新节点 —— 绑在旧 #catChips 上的监听会随之失效（分类点了没反应）。
     2) 分类抽屉为了不受 pointer-events:none 和边界裁切影响，已经挪到
        .tabbar 外面（见 HTML 注释）—— 绑在 #tabbar 上就收不到抽屉的点击了。
     document 级委托两种情况都能覆盖，一次绑定、永远有效。 */
document.addEventListener('click', e => {
  // --- 分类 chip ---
  const catChip = e.target.closest('[data-cat]');
  if (catChip){
    const k = catChip.dataset.cat;
    const wasOn = state.cat === k;
    // ★ 头部那个「清除筛选」按钮去掉后，「再点一次已选中的分类」就成了
    //   唯一的取消出口，必须让它真的取消（保持 cat='all'），
    //   不能被 renderCatChips 的兜底逻辑又改回第一个分类。
    catShowAll = wasOn;
    chipsReflow($('#catChips'), '.chip', () => {
      state.cat = wasOn ? 'all' : k;
      $$('#catChips .chip').forEach(c => c.classList.toggle('on', c.dataset.cat === state.cat));
    });
    renderCatChips(); renderItems();
    return;
  }

  // --- 状态 tab ---
  const stChip = e.target.closest('[data-st]');
  if (stChip){
    const k = stChip.dataset.st;
    // ★ 再点一次**已经选中**的状态 tab → 展开/收起分类抽屉，而不是取消筛选。
    //   底部一行只有三个 tab，取消筛选会让"一个都没选中"，看起来像坏了；
    //   而且它是这几档状态里唯一能唤出分类层的动作（见 setCatDrawer 的注释）。
    if (state.st === k){
      toggleCatDrawer();
      return;
    }
    chipsReflow($('#stChips'), '.chip', () => {
      state.st = k;
      catShowAll = false;
      // ★ 每次点状态行都重新选「该状态下第一个有物品的分类」（用户明确要求）。
      //   不这么做的话：进过「消耗中」之后再切回任何一档，分类行都没有选中项 ——
      //   因为 renderCatChips 只在「选中的分类在新状态下为空」时才换，
      //   而 'all' 永远不会被判成空。
      //   「消耗中」没有分类维度，所以 cat 归 'all' 显示全部消耗品。
      state.cat = (state.st === 'consuming') ? 'all' : firstCatWithItems(state.st);
      $$('#stChips .chip').forEach(c => c.classList.toggle('on', c.dataset.st === state.st));
    });
    // 切到「消耗中」时抽屉必须收起来（那一档没有分类可言）
    if (state.st === 'consuming') setCatDrawer(false, { silent: true });
    syncFilterGroup();
    renderItems();
    return;
  }
});

/* ================= 卡片左滑删除 =================
   ★ 替代原来的「删除按钮」（用户要求），也替代了已删掉的「左滑切分类」。
   手势分工（同一片区域有三套动作）：
     · 横滑（|dx|>8 且 |dx|>|dy|）→ 左滑滑开卡片露出删除块
     · 纵向 → 交还页面滚动，并取消长按计时器
     · 长按 420ms → 拖拽排序（CARD_GESTURE.swiping 置位时放弃）
   滑开阈值 34px（跟原来软件行左滑同一套），同时只允许一张滑开。 */
const CARD_GESTURE = { swiping: false };

(function initCardSwipeDel(){
  const grid = $('#igrid');
  if (!grid) return;
  const OPEN_W = 76;                 // 与 .swipe-del 的 width 一致
  let startX = 0, startY = 0, locked = null, tracking = false;
  let wrap = null;                   // 本次手势操作的那张卡
  let baseX = 0;                     // 手势开始前的位移（已滑开则是 -OPEN_W）

  const closeAll = (except) => {
    grid.querySelectorAll('.icard-wrap.swiped').forEach(w => {
      if (w === except) return;
      w.classList.remove('swiped');
      const c = w.querySelector('.icard');
      if (c){ c.style.transition = 'transform .18s cubic-bezier(.22,1,.36,1)'; c.style.transform = ''; }
    });
  };

  const onDown = (x, y, target) => {
    // 点在按钮/输入框/状态标签/缩略图上 → 不参与滑动（那是点击操作）
    if (target && target.closest('button,input,.st-tag,.ph')) return;
    const w = target && target.closest('.icard-wrap');
    if (!w) return;
    wrap = w;
    startX = x; startY = y; locked = null; tracking = true;
    baseX = w.classList.contains('swiped') ? -OPEN_W : 0;
    CARD_GESTURE.swiping = false;
  };

  const onMove = (x, y, e) => {
    if (!tracking || !wrap) return;
    // 拖拽排序已经开始 → 完全让路
    if (document.querySelector('.drag-ghost')){ tracking = false; locked = null; return; }
    const dx = x - startX, dy = y - startY;
    if (locked === null){
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) locked = 'x';
      else if (Math.abs(dy) > 8){ locked = 'y'; tracking = false; cancelAllHolds(); return; }
      else return;
    }
    if (locked !== 'x') return;
    CARD_GESTURE.swiping = true;
    // 跟手：只往左走，右边界是 0，左边界是 -OPEN_W（加一点橡皮筋）
    const card = wrap.querySelector('.icard');
    if (!card) return;
    let nx = baseX + dx;
    if (nx > 0) nx *= .25;                        // 往右超界 → 橡皮筋
    if (nx < -OPEN_W) nx = -OPEN_W + (nx + OPEN_W) * .25;
    card.style.transition = 'none';
    card.style.transform = `translateX(${nx.toFixed(1)}px)`;
    if (e && e.cancelable) e.preventDefault();
  };

  const onUp = (x) => {
    if (!wrap){ tracking = false; locked = null; return; }
    const wasX = locked === 'x';
    const dx = x - startX;
    const card = wrap.querySelector('.icard');
    tracking = false; locked = null;
    if (!wasX){
      setTimeout(() => { CARD_GESTURE.swiping = false; }, 50);
      // 只是点了一下：如果这张是滑开的，点它收回
      if (wrap.classList.contains('swiped') && card && Math.abs(dx) < 8){
        wrap.classList.remove('swiped');
        card.style.transition = 'transform .18s cubic-bezier(.22,1,.36,1)';
        card.style.transform = '';
      }
      wrap = null;
      return;
    }
    setTimeout(() => { CARD_GESTURE.swiping = false; }, 450);
    if (!card){ wrap = null; return; }
    const nx = baseX + dx;
    const shouldOpen = nx < -34 || (baseX < 0 && dx > 34);   // 左滑超过阈值就开；已开时右滑超过阈值就关
    card.style.transition = 'transform .2s cubic-bezier(.22,1,.36,1)';
    if (shouldOpen && baseX === 0){
      closeAll(wrap);
      wrap.classList.add('swiped');
      card.style.transform = `translateX(-${OPEN_W}px)`;
    } else if (baseX < 0 && dx > 34){
      wrap.classList.remove('swiped');
      card.style.transform = '';
    } else {
      // 没够阈值 → 回到原状态
      card.style.transform = baseX < 0 ? `translateX(-${OPEN_W}px)` : '';
      if (baseX >= 0) wrap.classList.remove('swiped');
    }
    wrap = null;
  };

  grid.addEventListener('touchstart', e => {
    const t = e.touches[0]; onDown(t.clientX, t.clientY, e.target);
  }, { passive: true });
  grid.addEventListener('touchmove', e => {
    const t = e.touches[0]; onMove(t.clientX, t.clientY, e);
  }, { passive: false });
  grid.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; onUp(t ? t.clientX : startX);
  });
  grid.addEventListener('touchcancel', () => {
    if (wrap){
      const card = wrap.querySelector('.icard');
      if (card){ card.style.transition = 'transform .18s'; card.style.transform = wrap.classList.contains('swiped') ? `translateX(-${OPEN_W}px)` : ''; }
    }
    tracking = false; locked = null; wrap = null; CARD_GESTURE.swiping = false;
  });

  // 桌面/无头环境也要能验：鼠标拖拽同效
  grid.addEventListener('mousedown', e => onDown(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => { if (tracking) onMove(e.clientX, e.clientY, null); });
  window.addEventListener('mouseup', e => { if (tracking) onUp(e.clientX); });
  // 点空白/滚动列表 → 收起已滑开的卡
  on('#scr-home', 'scroll', () => closeAll(null));
  grid.addEventListener('click', e => {
    if (!e.target.closest('.icard-wrap.swiped')) closeAll(null);
  }, true);
})();

/* 长按卡片 → 进入拖拽排序模式（松手落到新位置） */
(function initCardDrag(){
  const grid = $('#igrid');
  let holdTimer = null, card = null, id = null, started = false;
  let ghost = null, offsetX = 0, offsetY = 0, lastSwapEl = null;
  let holdStartX = 0, holdStartY = 0;   // 长按起点，用来区分「手抖」和「真在滚动」
  const tracker = makeVelocityTracker();

  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  // 长按还没触发就被打断（弹面板/切页）→ 清干净，别让 ghost 凭空冒出来
  if (typeof pendingHoldCancels !== 'undefined') pendingHoldCancels.push(function(){
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card){ card.classList.remove('dragging-src'); card = null; }
    id = null; started = false; lastSwapEl = null;
  });

  const begin = (x, y) => {
    // 兜底：卡片已被重绘/移除，或计时器早该被取消 → 绝不凭空造一个 ghost
    if (!card || !card.isConnected) return;
    // 手势已被判定为「左滑删除」→ 不要再起拖动排序
    if (typeof CARD_GESTURE !== 'undefined' && CARD_GESTURE.swiping) return;
    started = true;
    tracker.reset(x, y);
    const r = card.getBoundingClientRect();
    offsetX = x - r.left;
    offsetY = y - r.top;

    // 做一个跟手的浮层
    ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);

    card.classList.add('dragging-src');
    if (navigator.vibrate) navigator.vibrate(12);
  };
  const move = (x, y) => {
    if (!ghost) return;
    ghost.style.left = (x - offsetX) + 'px';
    ghost.style.top = (y - offsetY) + 'px';

    // 液态形变：跟着拖动速度鼓起来（慢拖几乎看不出，快甩才明显）
    if (tracker){
      const { vx, vy, dt } = tracker.sample(x, y);
      applyLiquidDeform(ghost, vx, vy, dt, true);
    }

    // 找手指下面的那张卡，实时换位。
    // 网格现在按状态聚堆，所以只跟「同一状态」的卡片换位 ——
    // 否则把卡拖到别的状态堆里，松手重排又会弹回原堆，看着像失灵。
    ghost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    ghost.style.display = '';
    const overRaw = el && el.closest('#igrid .icard[data-item]');
    const selfItem = ITEMS.find(i => i.id === id);
    const over = (overRaw && selfItem && ITEMS.find(i => i.id === overRaw.dataset.item)?.st === selfItem.st)
      ? overRaw : null;
    if (over && over !== card && over !== lastSwapEl){
      lastSwapEl = over;
      const a = ITEMS.find(i => i.id === id);
      const b = ITEMS.find(i => i.id === over.dataset.item);
      if (a && b){
        // 交换 order，并立刻重排 DOM（不整表重绘，避免闪烁）
        const ao = a.order ?? 9999, bo = b.order ?? 9999;
        a.order = bo; b.order = ao;
        // ★ 卡片外面包了一层 .icard-wrap（左滑删除用的槽），所以换位要操作 wrapper：
        //   .icard 已经不是 #igrid 的直接子元素了。
        const aWrap = card.parentElement, bWrap = over.parentElement;
        const parent = grid;
        const kids = [...parent.children];
        const ai = kids.indexOf(aWrap), bi = kids.indexOf(bWrap);
        if (ai < 0 || bi < 0) return;
        if (ai < bi) parent.insertBefore(aWrap, bWrap.nextSibling);
        else parent.insertBefore(aWrap, bWrap);
      }
    }
  };

  const end = () => {
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card){ card.classList.remove('dragging-src'); }
    if (started){
      // 固化顺序：按当前 DOM 顺序重写 order。
      // 每种状态各自从 0 开始编号 —— 排序时是「先按状态堆、堆内再按 order」，
      // 共用一个全局序号会让不同堆之间互相干扰。
      const bySt = {};
      [...grid.querySelectorAll('.icard[data-item]')].forEach(el => {
        const it = ITEMS.find(x => x.id === el.dataset.item);
        if (!it) return;
        const k = it.st || 'inuse';
        bySt[k] = bySt[k] || 0;
        it.order = bySt[k]++;
      });
      renderItems();
      toast('顺序已保存');
      // ★ 拖拽已经发生 → 抑制紧随其后的 click，避免误触展开编辑
      suppressCardClickUntil = Date.now() + 400;
    }
    card = null; id = null; started = false; lastSwapEl = null;
  };

  const onStart = (x, y, target) => {
    card = target.closest('#igrid .icard[data-item]');
    if (!card) return;
    if (target.closest('input,button,.st-tag')){ card = null; return; }
    // 已经滑开的那张卡不要进入拖拽（先让它滑回去）
    const w = card.closest('.icard-wrap');
    if (w && w.classList.contains('swiped')){ card = null; return; }
    id = card.dataset.item;
    holdStartX = x; holdStartY = y;
    clearHold();
    holdTimer = setTimeout(() => begin(x, y), 420);   // 按住 0.42 秒才进入拖拽
  };

  grid.addEventListener('touchstart', e => {
    const t = e.touches[0]; onStart(t.clientX, t.clientY, e.target);
  }, { passive: true });
  grid.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (started){ if (e.cancelable) e.preventDefault(); move(t.clientX, t.clientY); }
    // ★ 长按还没触发时**不能无条件清掉计时器**：真机上手指几乎不可能完全不动，
    //   一抖就 clearHold() → 420ms 永远等不到 → 长按拖动彻底失灵（这一版就是这么坏的）。
    //   正确做法：只有「明显在滑动」（超过 10px）才判定为滚动并放弃长按；
    //   10px 以内视为手抖，继续等计时器。
    else if (Math.hypot(t.clientX - holdStartX, t.clientY - holdStartY) > 10) clearHold();
  }, { passive: false });
  grid.addEventListener('touchend', end);
  grid.addEventListener('touchcancel', end);

  grid.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => { if (started) move(e.clientX, e.clientY); });
  // ★ 松手无条件收尾：即使没进入拖拽，也要清掉长按计时器，
  //   否则"点一下卡片"之后计时器仍会触发，凭空冒出一个跟手浮层
  window.addEventListener('mouseup', end);
})();

/* 软件列表的长按拖动排序 + 左滑删除已整页删除（软件页没了）。 */

/* ---------- 液态形变：拖动中的卡片跟着速度「鼓起来」 ----------
   规范（motion-effects 的 fx2）：慢拖几乎不变形、快甩才明显；
   速度消失形变就消失；静止时精确等于原圆角矩形。 */
const BULGE_MAX = 9;          // 最大鼓出量（约卡宽 4%）
const DEFORM_K   = 0.0011;    // 速度 → 形变强度
const DEFORM_CAP = 0.75;      // 形变上限

function applyLiquidDeform(el, vx, vy, dt, dragging){
  if (!el) return;
  const speed = Math.hypot(vx, vy);
  const target = Math.min(speed * DEFORM_K, DEFORM_CAP);
  // 拖动中衰减慢、停手衰减快 —— 手指一停形变立刻收
  el.__deform = el.__deform || { s:0 };
  const decay = dragging ? Math.exp(-5 * dt) : Math.exp(-14 * dt);
  // 目标值参与，但用较快的衰减把「已积累」的部分释放掉
  el.__deform.s = el.__deform.s * decay + (target - el.__deform.s) * (1 - decay);
  const s = el.__deform.s;
  if (s < 0.004 && !dragging){ el.style.borderRadius = ''; el.style.transform = el.__baseTransform || ''; return; }
  // 鼓出量按运动方向加权：朝着运动方向那侧多鼓一点
  const bx = Math.abs(vx) > Math.abs(vy) ? BULGE_MAX * s * 1.5 : BULGE_MAX * s;
  const by = Math.abs(vy) > Math.abs(vx) ? BULGE_MAX * s * 1.5 : BULGE_MAX * s;
  el.style.borderRadius = `${18 + bx}px ${18 + by}px ${18 + by}px ${18 + bx}px / ${18 + by}px ${18 + bx}px ${18 + bx}px ${18 + by}px`;
  el.style.transform = `${el.__baseTransform || ''} scale(${1 + s * 0.02}, ${1 + s * 0.02})`;
}

/* 拖动速度追踪：喂给液态形变用 */
function makeVelocityTracker(){
  let lastX = 0, lastY = 0, lastT = 0, vx = 0, vy = 0;
  return {
    reset(x, y){ lastX = x; lastY = y; lastT = performance.now(); vx = 0; vy = 0; },
    sample(x, y){
      const now = performance.now();
      const dt = Math.max(0.001, (now - lastT) / 1000);
      vx = (x - lastX) / dt;
      vy = (y - lastY) / dt;
      lastX = x; lastY = y; lastT = now;
      return { vx, vy, dt };
    },
    get vx(){ return vx; },
    get vy(){ return vy; }
  };
}

/* 改数量的小弹窗 */
function qtyModal(it){
  let q = it.q;
  openModal(`
    <h3>${it.n}</h3>
    <p class="mhint">一共有几件？</p>
    <div style="display:flex;justify-content:center;padding:6px 0 4px">
      <div class="stepper">
        <button id="qmMinus"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <span class="v" id="qmV">${q}</span>
        <button id="qmPlus"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
    </div>
    <div class="mrow">
      <button class="btn" id="qmCancel">取消</button>
      <button class="btn pri" id="qmOk">保存</button>
    </div>
  `);
  $('#qmMinus').addEventListener('click', () => { q = Math.max(1, q - 1); $('#qmV').textContent = q; });
  $('#qmPlus').addEventListener('click', () => { q = Math.min(999, q + 1); $('#qmV').textContent = q; });
  $('#qmCancel').addEventListener('click', closeModal);
  $('#qmOk').addEventListener('click', () => {
    it.q = q; closeModal(); renderItems();
    toast(`数量已改为 ${q}`);
  });
}

// 点空白关掉归类菜单
document.addEventListener('click', e => {
  if (!popOpen) return;
  if (e.target.closest('#pop') || e.target.closest('.lk') || e.target.closest('[data-status]')) return;
  closePop();
}, true);
on('#scr-home', 'scroll', closePop);

/* 底部 Tab 栏、Tab 拖动切换、软件页事件 —— 全部删除（单页 app，没有 Tab、没有软件页）。 */

/* ================= 初始化 ================= */
function renderAll(){
  renderCatChips();
  renderItems();
  // 新渲染出来的按钮也要有按压反馈
  bindPressFeedback();
  // 指示块的落位：先同步对齐一次（不播动画），字体加载完再量一次
  syncAllChipInds(false);
  requestAnimationFrame(() => syncAllChipInds(false));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncAllChipInds(false));
  // 底栏高度（含安全区）要等布局稳定才量得准 → 这里补一次留白同步
  syncTabPad();
  requestAnimationFrame(syncTabPad);
}

async function boot(){
  // 先立刻渲染，保证界面马上可用（不阻塞在数据库上）
  try {
    // ★ 单页 app 没有 Tab 切换了，所以「进页面默认筛选」必须在这里设一次：
    //   状态 = 第一个（在用中）、分类 = 该状态下第一个有物品的分类。
    //   原来这步在 goItems()（Tab 点击）里做，现在没有 Tab 可点了。
    resetItemFiltersToDefault();
    renderAll();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncAllChipInds(false));
  } catch (e) {
    // 渲染失败也不能让页面空着：把错误显示出来便于排查
    console.error('[极简] 首次渲染失败', e);
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#fff;border:2px solid #c33f5c;border-radius:10px;padding:10px;font:12px/1.5 monospace;white-space:pre-wrap">渲染出错：' + (e && e.message) + '</div>');
    return;
  }

  // 再异步读库；读完如果有数据就重绘一次
  try {
    const had = await loadFromDB();
    suppressSave = false;
    if (had){
      renderAll();
      console.log('[极简] 已从本地存储恢复', ITEMS.length, '条物品');
    } else {
      console.log(dbReady ? '[极简] 首次使用' : '[极简] 当前环境不支持本地存储，改动不会保存');
    }
  } catch (e) {
    suppressSave = false;
    console.warn('[极简] 读取本地数据失败，使用当前数据', e);
  }

  // 调试用：地址带 #cat 时自动展开分类抽屉（方便截图/排查布局，
  // 正式使用时没人会带这个 hash，不影响正常体验）
  if (location.hash === '#cat'){
    setTimeout(() => {
      setCatDrawer(true);
      // headless 截图时动画不会推进（页面在后台会冻结过渡），
      // 这里直接把终态写成内联样式，保证截到的是展开后的真实样子。
      const dr = $('#catDrawer');
      if (dr){
        dr.style.transition = 'none';
        dr.style.opacity = '1';
        dr.style.transform = 'translateY(0) scaleY(1)';
      }
    }, 120);
  }
}
boot();

/* ================= Service Worker（离线可用） ================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(
      reg => console.log('[极简] 离线缓存已就绪', reg.scope),
      err => console.warn('[极简] 离线缓存注册失败', err)
    );
  });
}
