<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdfaf1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="极简">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>极简</title>
<style>
@font-face{font-family:'ZCOOLKuaiLe';src:url('./fonts/zcoolkuaile.woff2') format('woff2');font-display:swap}
@font-face{font-family:'ZCOOLQingKe';src:url('./fonts/zcoolqingke.woff2') format('woff2');font-display:swap}
@font-face{font-family:'MaShanZheng';src:url('./fonts/mashanzheng.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Kalam';src:url('./fonts/kalam700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'PatrickHand';src:url('./fonts/patrickhand.woff2') format('woff2');font-display:swap}

:root{
  --paper:#ecebe4;
  --screen:#fdfaf1;
  --ink:#16171b;
  --ink2:#3b3d45;
  --sub:#8b8c94;
  --accent:#c9e8cf;          /* 主色：浅绿（涂笔、按钮、加号） */
  --accent-deep:#6fa87d;     /* 主色加深：角标、通知点 */
  --hl:rgba(201,232,207,.92);      /* 荧光笔高亮块 / 胶带 */
  --hl-soft:rgba(201,232,207,.85); /* 更淡一层，用于说明条 */
  --blue:#c9e8cf;
  --blue-deep:#7fb08a;       /* 蓝绿互换后：原 --blue-deep 位 → 绿 */
  --green:#7fb0d4;           /* 蓝绿互换后：原 --green 位 → 蓝（进度条达标/接近用） */
  --warn:#d9861f;
  --hr:2.3px;
  --f-cn:'ZCOOLKuaiLe','MaShanZheng',sans-serif;
  --f-num:'Kalam','PatrickHand',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* 禁止双指捏合缩放（加进主屏后捏小会露出白边，看着像网页）。
   viewport 的 user-scalable=no 在 iOS 上会被忽略，touch-action 才管用；
   双击放大也用这条压掉（别用 touchend preventDefault，会吃掉 click）。 */
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
/* 禁掉长按选中文字 / 长按弹出「拷贝·查询」气泡 / 长按元素被拎起来放大。
   这三样是 Safari 的行为，出现在 App 里就会「一看就是网页」。
   -webkit-touch-callout 管的正是那个气泡和"拎起来"的效果，缺它光禁 user-select 不够。 */
html,body{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
/* 输入框例外：全局禁选之后必须把输入类元素开回来，
   否则长按输入框弹不出「粘贴」、没法长按改字。
   (-webkit-user-select 是给旧版 iOS Safari 的) */
input,textarea,select,[contenteditable]{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default;
}
/* iOS 在字号 <16px 的输入框聚焦时会自动放大整个页面，且退出后不会还原。
   所有输入类元素字号一律 ≥16px，彻底避免这个问题。 */
input,textarea,select{font-size:16px !important}
body{
  position:relative;background:var(--screen);color:var(--ink);
  font-family:'PatrickHand','ZCOOLKuaiLe',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;
  overflow:hidden;
  background-image:radial-gradient(circle, rgba(22,23,27,.075) 1px, transparent 1px);
  background-size:16px 16px;
}
.wrap{position:relative;z-index:1;width:100%;height:100%}
.stage{width:100%;height:100%}

/* 真机全屏：手机上直接铺满，桌面上才画一个手机框便于预览 */
.phone{position:relative;width:100%;height:100%;background:var(--screen);overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  /* 底部留白写死 104px，不叠加 env(safe-area-inset-bottom)：
     加到主屏后可视区已铺满整屏（含 Home Indicator 段），
     再按 safe-area 补一次等于留两遍，底部会空出一条。 */
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 40px;
  scrollbar-width:none;display:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
/* ===== 页面过渡 · 横向推移（Tab 之间用，像翻页） =====
   用 keyframes 而不是 transition：动画万一不执行，元素本身也是可见的（失败安全）。 */
.screen.on.slide-r{animation:slideFromRight .3s cubic-bezier(.22,1,.36,1) both}
.screen.on.slide-l{animation:slideFromLeft  .3s cubic-bezier(.22,1,.36,1) both}
@keyframes slideFromRight{
  from{opacity:0;transform:translateX(24%)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideFromLeft{
  from{opacity:0;transform:translateX(-24%)}
  to{opacity:1;transform:translateX(0)}
}

/* ===== 次级页面（设置）· 手势转场，「推拉门」结构 =====
   上级页面留在原地（轻微缩到 .97 制造层次），次级页是一扇门从右侧推上来覆盖它。
   拖动位移直接 = 进度；松手以「拖过页宽 55%」为唯一完成判据。 */
.screen.overlay{display:none;z-index:20;background:var(--screen);
  box-shadow:-8px 0 24px rgba(22,23,27,.18);
  will-change:transform}
.screen.overlay.on{display:block}
/* 被覆盖的上级页面：轻微缩小表示"被压在下面"，指针事件关掉避免误点 */
.phone.covered > .screen:not(.overlay){transform:scale(.97);filter:brightness(.94);
  transition:transform .3s ease,filter .3s ease;pointer-events:none}
.phone.covered > .screen.overlay{transform:none;filter:none;pointer-events:auto}
/* 拖动中不要过渡，否则不跟手 */
.phone.dragging-overlay > .screen:not(.overlay),
.phone.dragging-overlay > .screen.overlay{transition:none}

/* 桌面预览：给个手机框，方便电脑上看 */
@media (min-width: 620px){
  body{
    background:#ecebe4;
    background-image:radial-gradient(circle, rgba(22,23,27,.075) 1px, transparent 1px);
    background-size:16px 16px;
    overflow:auto;padding:40px 20px;
  }
  .wrap{max-width:760px;margin:0 auto;height:auto}
  .stage{display:flex;justify-content:center}
  .phone{width:378px;height:812px;border-radius:42px;border:2.8px solid var(--ink);
    box-shadow:7px 9px 0 rgba(22,23,27,.13);flex:0 0 auto}
  .screen{padding:22px 20px 40px}
}

/* 顶栏（设置页还在用；主页的顶栏/齿轮都已删，设置收进底部卡片行） */
.topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:16px}
.topbar .grp{display:flex;gap:10px;align-items:center}
.circ{width:45px;height:45px;background:#fff;border:2.3px solid var(--ink);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;position:relative;flex:0 0 auto;
  box-shadow:2px 3px 0 rgba(22,23,27,.14)}
.circ svg{width:20px;height:20px}
.circ .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--accent-deep);border:1.5px solid var(--ink)}
.c1{border-radius:50% 44% 50% 46%/46% 50% 44% 50%}
.c2{border-radius:45% 50% 46% 50%/50% 46% 50% 45%}
.back{width:45px;height:45px;background:#fff;border:2.3px solid var(--ink);display:grid;place-items:center;
  cursor:pointer;box-shadow:2px 3px 0 rgba(22,23,27,.14);border-radius:46% 50% 44% 50%/50% 44% 50% 46%}
.back svg{width:20px;height:20px}

/* ===== 底部 Tab 栏（状态行）+ 分类抽屉 =====
   ★ 造型沿用这个 App 原来的底栏（见 预览-新-总览.png）：
     一条**悬浮的米白胶囊**，2.5px 黑描边 + 右下硬阴影，左右各留 16px，
     不贴屏幕边。选中项是一枚**纯黑实心胶囊**（白字 + 白图标）滑到哪亮到哪。
     未选中项是浅灰细线图标 + 灰字。

   ★ 结构分三层：
       .tabbar            —— 定位壳子（贴底，管左右边距和安全区）
       .catdrawer         —— 分类抽屉，浮在胶囊上方，translateY 收放
       .tabbar-main       —— 胶囊本体（外框）里面装三个状态 tab
   ★ 抽屉必须挂在**定位壳子**上而不是胶囊本体上：
     胶囊本体是 overflow:hidden 的圆角块（要让内部黑色指示块被圆角裁住），
     抽屉挂在它里面会被一起裁掉。 */

/* ---- 定位壳子：贴底、管边距、不画任何视觉 ----
   ★ 抽屉要相对"胶囊顶边"定位，而胶囊高度是内容撑出来的（字体/行高都会影响），
     所以这里不在 CSS 里写死像素，而是让抽屉用 bottom:100% 相对**胶囊本身**定位
     —— 做法是把抽屉放进 .tabbar-main 内，并把胶囊的 overflow 从 hidden 改成 visible，
     用一个内层 .tabbar-track 负责裁切指示块的圆角。
   ★ 壳子本身零高度（只有 padding），别在它上面挂 bottom:100% 的东西。 */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:12;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  pointer-events:none}      /* 壳子透明区域不该挡住列表点击 */
.tabbar > *{pointer-events:auto}

/* ---- 胶囊本体（原底栏造型）---- */
.tabbar-main{position:relative;
  display:flex;align-items:center;
  background:var(--screen);
  border:2.5px solid var(--ink);
  border-radius:999px;
  box-shadow:3px 4px 0 rgba(22,23,27,.16);
  padding:5px}
/* 裁切层：指示块滑到两端时会被这个圆角框裁住（不能放在 .tabbar-main 上，
   否则同级的抽屉也会被一起裁掉） */
.tabbar-track{position:relative;display:flex;align-items:center;
  flex:1;min-width:0;border-radius:999px;overflow:hidden}

/* 三个状态 tab：等宽平分，等于原来「物品/总览/软件」那三格 */
.tabbar #stChips{display:flex;gap:0;overflow-x:visible;
  padding:0;position:relative;flex:1;
  /* 状态行的液态指示块要用外面这层做定位基准 */
  border-radius:999px}
.tabbar #stChips .chip{flex:1 1 0;justify-content:center;
  display:inline-flex;align-items:center;
  font-family:var(--f-cn);font-size:13px;font-weight:400;
  padding:9px 6px;border:none;background:transparent;box-shadow:none;
  color:var(--sub);border-radius:999px;cursor:pointer;
  position:relative;z-index:1;
  transition:color .16s}
/* ★ 图标和文字的间距写在图标自己的右边距上，不用 flex gap：
   一旦用 gap，计数 <span class="n"> 也会被同样推开，
   变成「在用中    0」这种断开的观感。 */
.tabbar #stChips .chip .n{font-family:'PatrickHand',sans-serif;font-size:11px;
  margin-left:3px;opacity:.7}
/* 选中项：白字（黑色底由 .chip-ind 指示块画，见外层 .has-ind 规则） */
.tabbar #stChips.has-ind .chip.on{color:#fdfaf1;background:transparent}
/* 万一指示块没挂上（首帧/异常），选中项自己也要能看清 */
.tabbar #stChips:not(.has-ind) .chip.on{background:var(--ink);color:#fdfaf1}
.tabbar #stChips .chip:active{transform:scale(.97)}
.tabbar #stChips .chip .n{font-family:'PatrickHand',sans-serif;font-size:11px;
  margin-left:2px;opacity:.75}

/* 指示块改成纯黑胶囊（原来那条用的是 --accent 淡绿，底栏上要深色才像旧版） */
.tabbar #stChips .chip-ind{background:var(--ink);border-radius:999px}

/* tab 内的图标：跟着 tab 文字颜色走（选中白、未选中灰）。
   图标右边留 5px 当"图标↔文字"的间距（不用 flex gap，见上条注释）。 */
.tabbar #stChips .chip svg{width:15px;height:15px;flex:0 0 auto;
  margin-right:5px;stroke:currentColor;display:block}

/* ---- 分类抽屉：浮在胶囊上方，独立于 .tabbar 定位 ----
   ★ 它是 .phone 的直接子元素（不是 .tabbar 的后代），原因见 HTML 注释：
     挂在 .tabbar 里会受父级 pointer-events:none 和边界裁切影响，
     分类一多折行就有部分点不动。
   ★ 位置用「贴底 + 让出胶囊所占高度」表达：胶囊高度 = 52px（内容）+ 12px（底距），
     这里用 CSS 变量统一，改胶囊内边距时只动一处。 */
.tabbar{--cap-h:52px;--cap-gap:12px}
.catdrawer{position:absolute;left:16px;right:16px;
  /* 52px = 胶囊内容高度；12px = 胶囊底距；7px = 与胶囊的间隙。
     这三个数跟着 .tabbar 的 padding / 胶囊内边距同步（改一处要一起改）。 */
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px + 52px + 7px);
  background:var(--screen);
  border:2.5px solid var(--ink);
  border-radius:26px;
  box-shadow:3px 4px 0 rgba(22,23,27,.16);
  padding:7px 8px;
  transform:translateY(10px) scaleY(.96);
  opacity:0;
  pointer-events:none;
  transform-origin:50% 100%;
  transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .22s ease;
  z-index:11;
  max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.catdrawer.open{transform:translateY(0) scaleY(1);opacity:1;pointer-events:auto}

/* 抽屉里的分类行：去掉顶部那条「从属竖线」（不再需要暗示父子关系）
   ★ 选择器一律用 #catDrawer 开头：抽屉已经不在 .tabbar 里了（见 HTML 注释），
     写成 .tabbar .chipRow 会一条都命中不了。 */
#catDrawer .chipRow.branch{padding-left:0}
#catDrawer .chipRow.branch::before{display:none}
#catDrawer .chipRow{margin-bottom:0}
/* ★ 分类行必须能折行。基础 .chips 是 overflow-x:auto + 单行 flex，
   分类一多就横向溢出、被挤出抽屉边界 —— 那些 chip 落在抽屉外面，
   elementFromPoint 打不到、点了完全没反应（就是"点多了点不了"这个 bug）。
   这里改成 wrap + overflow:visible，让抽屉跟着内容长高。 */
#catDrawer .chipRow .chips{display:flex;flex-wrap:wrap;overflow:visible;
  padding-bottom:0;justify-content:center;gap:7px;row-gap:7px}

/* 分类 chip：和上方状态 tab 同一套胶囊语言（圆角、无倾斜、无手绘方片），
   只是小一号、且选中时用淡绿填充而不是纯黑 —— 免得跟状态 tab
   抢"当前在哪一档"的视觉焦点。 */
#catDrawer .chipRow .chip{flex:0 0 auto;
  font-family:var(--f-cn);font-size:12.5px;
  padding:7px 14px;border:2.2px solid var(--ink);
  border-radius:999px;background:#fff;color:var(--ink2);
  box-shadow:2px 2px 0 rgba(22,23,27,.12);
  transform:none;transition:background .14s,color .14s,box-shadow .14s}
#catDrawer .chipRow .chip .n{font-family:'PatrickHand',sans-serif;font-size:11px;
  margin-left:4px;opacity:.65}
/* 选中：淡绿实心 + 黑字（去掉原来那套「变大 + 旋转」的标签让位） */
#catDrawer .chipRow .chip.on,
#catDrawer .chipRow .chips.has-ind .chip.on{background:var(--accent);color:var(--ink);
  transform:none;padding:7px 14px;font-size:12.5px;
  box-shadow:2px 3px 0 rgba(22,23,27,.18)}
#catDrawer .chipRow .chip.on:active,
#catDrawer .chipRow .chip:active{transform:scale(.96)}

/* 分类抽屉里不挂液态指示块（那套是给状态 tab 用的，分类是普通选择） */
#catDrawer .chipRow .chip-ind{display:none}

/* 抽屉空态 */
.cat-empty{font-size:11.5px;color:var(--sub);text-align:center;
  padding:2px 0 5px;line-height:1.5}

/* ===== 圆角胶囊 chip（弹窗里的「分类 / 状态」选择）=====
   和底部 tab 栏、分类抽屉、物品卡片同一套圆形语言。
   ★ 要写在 .chips .chip.on 之后并在特异性上压过它：
     基础选中态会加大 padding 并 rotate(-1.2deg)，这里全部归零。
   ★ 允许折行：分类可能很多，弹窗宽度有限，不能横向溢出到看不见。 */
.chips.round{display:flex;flex-wrap:wrap;overflow:visible;
  justify-content:flex-start;gap:7px;row-gap:7px}
.chips.round .chip{flex:0 0 auto;border-radius:999px;
  font-family:var(--f-cn);font-size:12.5px;padding:6px 13px;
  border:2.1px solid var(--ink);background:#fff;color:var(--ink2);
  box-shadow:2px 2px 0 rgba(22,23,27,.12);
  transform:none;transition:background .14s,color .14s,box-shadow .14s}
.chips.round .chip.on{background:var(--accent);color:var(--ink);
  transform:none;padding:6px 13px;font-size:12.5px;
  box-shadow:2px 3px 0 rgba(22,23,27,.18)}
.chips.round .chip:active,
.chips.round .chip.on:active{transform:scale(.96)}

/* 抽屉把手：胶囊上方一道小横杠，暗示"上面这块能拉开"。
   ★ pointer-events:none —— 它只是视觉提示，点击必须落到胶囊 tab 上。 */
.drawer-grip{position:absolute;left:0;right:0;bottom:100%;height:11px;
  margin-bottom:1px;
  display:grid;place-items:center;pointer-events:none}.drawer-grip span{width:34px;height:4px;border-radius:99px;background:var(--ink);
  opacity:.16;transition:opacity .2s,width .25s}
.tabbar.catopen .drawer-grip span{opacity:0;width:26px}
/* 「消耗中」没有分类可展开 → 把手也藏起来，别给假提示 */
.tabbar.nocat .drawer-grip{display:none}

/* 主页滚动区：给浮动胶囊留出空间，最后一条物品不会被压住。
   ★ 精确高度由 syncTabPad() 写内联（抽屉展开时还要加上抽屉高度），
     这里只给一个兜底值，避免 JS 还没跑时内容被压住。 */
#scr-home{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.tape{position:absolute;width:74px;height:25px;z-index:5;opacity:.8;box-shadow:0 1px 4px rgba(22,23,27,.13);
  clip-path:polygon(0 3%,4% 0,96% 2%,100% 0,99% 96%,95% 100%,5% 98%,1% 100%)}
.tape.p{background:var(--hl)}
.tape.b{background:rgba(214,205,238,.88)}

/* 区块标题 */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 11px}
.sec-head b{position:relative;display:inline-block;font-family:var(--f-cn);font-size:18px;font-weight:400}
.sec-head b::after{content:'';position:absolute;left:-6px;right:-7px;bottom:2px;height:10px;z-index:-1;
  background:var(--hl);border-radius:3px 10px 4px 11px;transform:rotate(-.8deg)}
.sec-head a{font-size:13px;color:var(--sub);text-decoration:none;font-family:'PatrickHand',sans-serif;cursor:pointer}

/* 快捷入口 */
.quick{display:flex;justify-content:space-between;gap:6px;margin:16px 0 18px}
.qa{flex:1;border:none;background:none;font-family:var(--f-cn);font-size:12.5px;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0;line-height:1.25}
.qa .ic{width:48px;height:48px;display:grid;place-items:center;background:#fff;border:2.3px solid var(--ink);
  border-radius:16px 6px 17px 7px/7px 17px 6px 16px;box-shadow:2px 3px 0 rgba(22,23,27,.14)}
.qa .ic svg{width:21px;height:21px}
.qa .ic.hot{background:var(--accent)}
.qa:nth-child(odd) .ic{transform:rotate(-2.2deg)}
.qa:nth-child(even) .ic{transform:rotate(2.2deg)}

/* 分类网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cat{background:#fff;border:var(--hr) solid var(--ink);border-radius:15px;
  box-shadow:4px 5px 0 rgba(22,23,27,.15);padding:11px 13px 12px;cursor:pointer;
  transform:rotate(-.55deg);transition:transform .12s,box-shadow .12s}
.cat:nth-child(even){transform:rotate(.6deg)}
.cat:active{transform:translate(2px,3px) rotate(0deg);box-shadow:1px 2px 0 rgba(22,23,27,.15)}
.cat .ct{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.cat .ct .dot{width:11px;height:11px;border-radius:50% 44% 52% 46%;border:1.7px solid var(--ink)}
.cat .ct span{font-size:14.5px;font-family:var(--f-cn)}
.cat .ct .arw{margin-left:auto;font-size:12px;color:var(--sub);font-family:'PatrickHand',sans-serif}
.cat .cn{display:flex;align-items:baseline;gap:4px}
.cat .cn .n{font-family:var(--f-num);font-weight:700;font-size:31px;line-height:.85}
.cat .cn small{font-size:12px;color:var(--sub)}
/* 分类卡上的目标进度条 / 「还差 N 件」文案已删除（用户要求，目标移到极简目标卡） */
.cat.add{border-style:dashed;background:rgba(255,255,255,.6);box-shadow:3px 4px 0 rgba(22,23,27,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:112px;text-align:center}
.cat.add svg{width:26px;height:26px}
.cat.add span{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2)}
.cat.add small{font-size:11px;color:var(--sub)}

/* 物品列表页 */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-head h2{margin:0;font-family:var(--f-cn);font-size:23px;font-weight:400}
.page-head .cnt{font-size:12.5px;color:var(--sub);font-family:'PatrickHand',sans-serif}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:2.2px solid var(--ink);
  border-radius:15px 6px 16px 7px/7px 16px 6px 15px;padding:10px 13px;margin-bottom:13px;
  box-shadow:3px 4px 0 rgba(22,23,27,.12)}
.search svg{width:17px;height:17px;flex:0 0 auto;color:var(--sub)}
.search input{border:none;outline:none;background:none;font-family:'PatrickHand',sans-serif;
  font-size:14px;width:100%;color:var(--ink)}
.search input::placeholder{color:#a9aab2}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
/* 行内选中的滑动指示器（液态Tab：前后边缘各一个弹簧，切换时先拉长再收缩）
   ★ 这里**不能用 transform 位移、也不能写 will-change** —— 两者都会把指示块
     提升成独立的合成层（compositing layer）。iOS Safari 上合成层会盖到未合成的
     兄弟节点（chip）上面，表现就是「选中项被那块底色整个糊住、文字看不见」。
     Chromium 不复现这个毛病，所以很容易在本地测着正常、到手机就中招。
     改用 left（绝对定位元素，不改兄弟布局）+ z-index 分层，最稳。 */
.chip-ind{position:absolute;left:0;top:0;width:0;height:0;z-index:0;opacity:0;
  background:var(--accent);pointer-events:none;
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px}
.chip-ind.on{opacity:1}
/* 「状态/必需」这两行居中显示（用户要求）；内容超宽时自动退回左对齐，免得首项被裁掉 */
/* 居中行（物品页/软件页的状态行）：写成 .chipRow .chips.center，
   否则会被下面同优先级的 .chipRow .chips{justify-content:flex-start} 压掉 */
.chipRow .chips.center{justify-content:center}
.chipRow .chips.center.overflowing{justify-content:flex-start}
/* 变换不用 CSS 变量中转：几何（让位位移 / 指示块宽高）一律由 WAAPI 和
   弹簧直接写 style.transform，免得 --flipx 这类变量与 .on 的 rotate 互相覆盖。 */
/* ★ 这里**不能**给 padding / transform 加 transition：
   「标签让位」的 FLIP 和「液态Tab」的指示块都是在 class 切换后**立刻**量
   getBoundingClientRect()。若 padding 还在过渡中，量到的是**过渡起点**的旧几何，
   FLIP 的位移动画为 0（邻项不动）、指示块也会停在旧位置不动。
   所以几何变化一律交给 WAAPI（FLIP / 弹簧）负责，CSS 只管颜色。 */
.chip{flex:0 0 auto;border:2.1px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:13px;padding:6px 13px;cursor:pointer;color:var(--ink2);position:relative;z-index:1;
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px;box-shadow:2px 2px 0 rgba(22,23,27,.12);
  transition:background .12s,box-shadow .12s}
/* 标签让位：选中项**真的变宽**（加大内边距，会改布局 → 邻项被推开），
   再配一点手写倾斜。★ 不能用 transform:scale 来"放大" ——
   scale 不参与布局，邻项不会被推开，也就没有"让位"这回事。
   ★ 样式必须写成 `.chips .chip.on`：小号行用 `.chips.small .chip`（两个类），
   写成 `.chip.on`（一个类）会被它压掉，选中项就不变大、邻项也没得让位
   —— 这正是原先"只有分类行有效"的原因。
   ★ 选中块的底色默认由自己画（--accent）；只有**真的挂了指示块**的行
   （容器带 .has-ind，由 JS 在创建指示块时加上）才把底色让给指示块。
   否则弹窗里那几组 chip（添加物品/添加软件的分类、状态选择，它们没有指示块）
   选中项会变成透明底 —— 在白色弹窗上跟未选中长得一模一样。 */
.chips .chip.on{background:var(--accent);color:var(--ink);
  padding:7px 17px;font-size:13.5px;
  transform:rotate(-1.2deg);
  box-shadow:2px 3px 0 rgba(22,23,27,.18)}
/* 有指示块的行：底色交给 .chip-ind（它跟着选中项跑），chip 自己透明 */
.chips.has-ind .chip.on{background:transparent}
.chips .chip.on:active{transform:rotate(-1.2deg) scale(.96)}
.chip:active{transform:scale(.96);box-shadow:1px 1px 0 rgba(22,23,27,.12)}
.chip .n{font-family:'PatrickHand',sans-serif;font-size:11.5px;opacity:.62;margin-left:3px}
/* 小号行的基准尺寸（必须排在下面那条 .on 之前，否则同特异性时会被它盖回去） */
.chips.small .chip{font-size:12px;padding:5px 11px}
/* 小号行的选中项也要比同排的略大一号（基准是 5px 11px / 12px） */
.chips.small .chip.on{padding:6px 15px;font-size:12.5px}
.chip.plus{border-style:dashed;color:var(--sub);background:rgba(255,255,255,.55)}
/* 筛选行：按钮直接左对齐（不再有前面的「分类/状态」小字占位）；
   加了 .center 的行居中显示（内容超宽时 JS 会补 .overflowing 退回左对齐） */
.chipRow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.chipRow .chips{flex:1;padding-bottom:7px;justify-content:flex-start}
/* ---------- 层级：状态行是「总行」，分类/位置/季节都是它的分支 ----------
   用三处视觉差把父子关系说出来，不动任何交互：
     ① 总行按钮略大、描边更重（看起来在"上一层"）
     ② 分支行整体缩进、按钮小一号（像挂在总行下面）
     ③ 分支行左侧一道渐变竖线，从总行底部往下引（真正的"从属"暗示） */
.chipRow.master .chip{font-size:13px;padding:6px 14px;border-width:2.4px}
.chips.small.master .chip{font-size:12.5px;padding:6px 13px;border-width:2.4px}
.chips.small.master .chip.on{padding:7px 17px;font-size:13px}
.chipRow.master .chip .n{opacity:.74;font-size:12px}
.chipRow.branch{position:relative;padding-left:12px}
.chipRow.branch::before{content:'';position:absolute;left:3.5px;top:-4px;bottom:10px;width:1.6px;
  background:linear-gradient(to bottom,rgba(22,23,27,.32),rgba(22,23,27,.08));
  border-radius:2px}
.chipRow.branch .chip{font-size:12px;padding:5px 11px}
.chips.small.branch .chip{font-size:11.5px;padding:4.5px 10px}
.chipRow.branch .chip.on{font-size:12.5px;padding:6px 14px}
.chips.small.branch .chip.on{font-size:12px;padding:5.5px 13px}
.count-row{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 11px}
.count-row b{font-family:var(--f-cn);font-size:14.5px;font-weight:400}
.count-row span{font-size:12.5px;color:var(--sub);font-family:'PatrickHand',sans-serif}

/* ============ 物品卡：单列竖排（一行一张，图左文右） ============
   用户从两个样板里选了方案 A。原来这里是两列网格（.igrid 1fr 1fr），
   卡片是「上图下文」；现在改成单列，卡片内部横向排布：
     左：方形缩略图（带日期/爱心/状态/数量的角标照旧压在图上）
     右：名称 / 位置+状态 / 用过几次，最右边一列是数量·爱心·打勾
   ★ 单列后卡片变宽，一屏能看到的张数反而更多（原来两列每屏约 4 张）。 */
.igrid{display:flex;flex-direction:column;gap:10px}
.icard{background:#fff;border:2.2px solid var(--ink);
  /* ★ 圆角胶囊：和底部 tab 栏同一套圆形语言（原来是手绘抖动方片） */
  border-radius:999px;overflow:hidden;
  box-shadow:4px 5px 0 rgba(22,23,27,.14);position:relative;
  display:flex;align-items:center;gap:11px;padding:7px 14px 7px 7px}
/* ★ 奇偶倾斜放在 wrapper 上，不放在 .icard 上 ——
   .icard 的 transform 要留给「左滑露出删除块」用，两者会互相覆盖。
   倾斜放在外层槽上，卡片在里面平移就不会打架。 */
.icard-wrap:nth-child(odd){transform:rotate(-.4deg)}
.icard-wrap:nth-child(even){transform:rotate(.4deg)}
/* 改了状态 → 卡片「离开这里、落到别处」的两段动画。
   注意卡片自身带轻微旋转（奇偶 ±0.5°），所以动效里要把旋转写进去，
   否则动画期间会把那张卡的倾斜抹平，看起来会"正"一下再回去。 */
.icard.leaving{opacity:0;transform:scale(.88) rotate(0deg);
  transition:opacity .2s ease,transform .2s cubic-bezier(.4,0,1,1)}
/* 落位动画加在 wrapper 上（卡片外面包了一层左滑删除的槽） */
.icard-wrap.arriving{animation:cardArrive .42s cubic-bezier(.22,1.15,.36,1)}
@keyframes cardArrive{
  0%{opacity:0;transform:translateY(14px) scale(.9)}
  60%{opacity:1;transform:translateY(-2px) scale(1.015)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
/* 方形缩略图（原来是占满卡宽的方图，现在缩成左侧固定 78×78） */
.icard .ph{position:relative;width:74px;height:74px;flex:0 0 auto;display:grid;place-items:center;
  border:2px solid var(--ink);border-radius:999px;
  cursor:pointer;overflow:hidden}
.icard .ph svg{width:54%;height:54%;color:var(--ink);opacity:.82}
.icard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 无照片时：图标居中，"+"号做成右下角的小提示（79px 放不下"加照片"三个字） */
.icard .ph .addph{position:absolute;right:3px;bottom:3px;width:17px;height:17px;z-index:2;
  display:grid;place-items:center;background:rgba(255,255,255,.92);
  border:1.5px solid var(--ink);border-radius:50% 46% 52% 48%;opacity:.85}
.icard .ph .addph svg{width:11px;height:11px;opacity:.9}
/* 缩略图只有 78px 塞不下几样东西 → 只留日期角标，其余信息都在文字区 */
/* 归类小菜单（浮在卡片上，现在只剩「状态」一种） */
.pop{position:absolute;z-index:40;background:var(--screen);border:2.4px solid var(--ink);
  border-radius:14px 6px 15px 7px/7px 15px 6px 14px;box-shadow:5px 6px 0 rgba(22,23,27,.22);
  padding:7px;display:none;min-width:112px}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
  font-family:var(--f-cn);font-size:13px;border-radius:10px 4px 11px 5px/5px 11px 4px 10px;white-space:nowrap}
.pop .pi:active{background:rgba(22,23,27,.07)}
.pop .pi.sel{background:rgba(22,23,27,.075)}
.pop .pi .mk{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center}
.pop .pi .mk svg{width:18px;height:18px;overflow:visible;
  fill:var(--lkc,#fff);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;paint-order:stroke fill}
.pop .pi .ck{margin-left:auto;font-family:'PatrickHand',sans-serif;font-size:13px;color:var(--ink2)}
.icard .meta{padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
/* 名称（单列变宽了，可以显示更长） */
.icard .meta .nm{font-family:var(--f-cn);font-size:14.5px;color:var(--ink);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 第二行：季节 + 状态标签 */
.icard .meta .line2{display:flex;align-items:center;gap:6px;min-width:0}
/* 季节（只有衣物才有）单独一个小字 */
.icard .se-txt{flex:0 0 auto;font-size:10.5px;color:#a3a4ab}
/* 卡片上的状态小标签（缩略图里放不下，挪到文字区） */
.icard .meta .st-tag{flex:0 0 auto;font-family:var(--f-cn);font-size:10px;padding:1px 8px;
  border:1.7px solid var(--ink);border-radius:999px;cursor:pointer;
  transition:transform .12s}
.icard .meta .st-tag:active{transform:translate(1px,1px)}
/* 右侧：数量 */
.icard .side{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.icard .side .qty{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--ink);
  background:#fff;border:1.8px solid var(--ink);border-radius:999px;padding:0 8px}
/* ---------- 左滑删除 ----------
   .icard-wrap 是「槽」：overflow:hidden 裁掉滑出去的部分，底层放删除块。
   ★ 卡片自身的硬阴影/倾斜都还在 .icard 上；槽只负责裁剪和定位。
   ★ 槽不能跟着倾斜（否则删除块也跟着歪），所以倾斜留在卡片上。
   ★ 槽要留一点外边距给阴影，否则 overflow:hidden 会把 4px 硬阴影切掉。 */
.icard-wrap{position:relative;overflow:hidden;
  border-radius:999px;
  margin:0 4px 4px 0;padding:0 0 5px 0}
.icard-wrap .swipe-del{position:absolute;top:0;right:0;bottom:5px;width:76px;
  display:grid;place-items:center;background:#f3c9d8;
  border-radius:0 999px 999px 0}
.icard-wrap .del-go{width:40px;height:40px;display:grid;place-items:center;cursor:pointer;
  background:#fff;border:2px solid var(--ink);border-radius:50% 46% 52% 48%;color:var(--ink)}
.icard-wrap .del-go svg{width:17px;height:17px}
.icard-wrap .del-go:active{transform:scale(.92)}
/* 滑开状态：卡片左移露出删除块 */
.icard-wrap.swiped .icard{transform:translateX(-76px) rotate(0deg)}
/* 卡片本身也要 transition（滑开/收回），但不能影响倾斜的基础态 */
.icard{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .12s}
/* 拖拽排序 */
.icard.dragging-src{opacity:.3}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.94;
  transform:rotate(-1.4deg) scale(1.04);border:2.4px solid var(--ink);border-radius:14px;
  background:#fff;overflow:hidden;box-shadow:8px 12px 24px rgba(22,23,27,.28)}
.icard.held{transform:scale(.97);box-shadow:0 0 0 2.4px var(--accent)}
.use-pop{position:fixed;z-index:9999;pointer-events:none;font-family:var(--f-num);font-weight:700;
  font-size:19px;color:var(--accent-deep);text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;
  animation:usePop .78s cubic-bezier(.22,.9,.24,1) forwards}
@keyframes usePop{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-14px) scale(1.18)}
  100%{opacity:0;transform:translate(-50%,-44px) scale(1)}
}
/* 「待处理」状态的降饱和样式已删除（该状态整个移除） */
.icard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:180px;border-style:dashed;background:rgba(255,255,255,.6);
  box-shadow:3px 4px 0 rgba(22,23,27,.1);cursor:pointer}
.icard.add svg{width:30px;height:30px}
.icard.add span{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2)}
.icard.add small{font-size:11px;color:var(--sub)}
.empty{background:#fff;border:2.2px dashed var(--ink);border-radius:26px;padding:26px 18px;text-align:center}
.empty b{display:block;font-family:var(--f-cn);font-size:15px;font-weight:400;margin-bottom:7px}
.empty span{font-size:13px;color:var(--sub)}
/* 空状态里的小按钮（如「显示全部」）：别继承 .btn 的 flex:1，否则会被拉满宽 */
.empty .btn{flex:0 0 auto;margin:12px auto 0;padding:8px 16px;font-size:13px}

/* ===== 底部两张大卡：添加物品（8）+ 设置（2） =====
   ★ 样式跟物品卡一样：白底、2.2px 黑边、不对称手绘圆角、4px 硬阴影、轻微倾斜。
   原来这里是右下角悬浮加号（.fab）和顶栏齿轮，两个都删了收进这一行。
   ★ 比例用 width 百分比写死（8:2），不用 flex:8/flex:2 ——
     flex 的数字是「按内容基准宽度分配剩余空间」，会被文字长度带偏
     （实测 8:2 出来是 75:25）。 */
.bottombar{display:flex;gap:10px;margin-top:12px}
.bottombar .bigcard{
  border:2.2px solid var(--ink);background:#fff;cursor:pointer;box-sizing:border-box;
  border-radius:15px 6px 16px 7px/7px 16px 6px 15px;
  box-shadow:4px 5px 0 rgba(22,23,27,.14);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--f-cn);font-size:14.5px;color:var(--ink);
  padding:14px 10px;transition:transform .12s,box-shadow .12s}
.bottombar .addnew{
  width:calc((100% - 10px) * 0.8);
  transform:rotate(-.4deg)}
.bottombar .gearcard{
  width:calc((100% - 10px) * 0.2);
  transform:rotate(.4deg);padding:14px 4px}
.bottombar .bigcard svg{width:19px;height:19px;flex:0 0 auto}
.bottombar .bigcard:active{transform:translate(2px,3px) rotate(0deg);box-shadow:1px 2px 0 rgba(22,23,27,.14)}

/* ===== 弹层 =====
   动画用 @keyframes 而不是 transition：万一动画不执行，元素的基础状态就是可见的，
   不会出现「弹窗卡在全透明、点不出来」这种致命问题。 */
.mask{position:absolute;inset:0;background:rgba(22,23,27,.34);z-index:30;display:none;
  align-items:center;justify-content:center;padding:22px}
.mask.on{display:flex;animation:maskIn .2s ease both}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--screen);border:2.6px solid var(--ink);border-radius:19px;
  box-shadow:6px 7px 0 rgba(22,23,27,.24);padding:17px 17px 15px;width:100%;max-width:296px;
  max-height:88%;overflow-y:auto;scrollbar-width:none;
  transform-origin:50% 100%}
.mask.on .modal{animation:modalIn .34s cubic-bezier(.34,1.36,.5,1) both}
@keyframes modalIn{
  from{transform:scale(.42) translateY(26px);opacity:0}
  to{transform:scale(1) translateY(0);opacity:1}
}
.modal::-webkit-scrollbar{display:none}
.modal h3{margin:0 0 4px;font-family:var(--f-cn);font-size:17.5px;font-weight:400}
.modal .mhint{margin:0 0 14px;font-size:12.5px;color:var(--sub)}
.modal label{display:block;font-family:var(--f-cn);font-size:13px;margin:0 0 6px;color:var(--ink2)}
.modal .fld{margin-bottom:14px}
.modal input[type=text]{width:100%;border:2.1px solid var(--ink);background:#fff;
  border-radius:12px 5px 13px 6px/6px 13px 5px 12px;padding:10px 12px;font-family:'PatrickHand',sans-serif;
  font-size:14.5px;color:var(--ink);outline:none}
.modal input[type=text]::placeholder{color:#a9aab2}
.modal .mrow{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;border:2.2px solid var(--ink);font-family:var(--f-cn);font-size:14px;padding:11px 8px;
  cursor:pointer;border-radius:14px 5px 15px 6px/6px 15px 5px 14px;background:#fff;color:var(--ink);
  box-shadow:2px 3px 0 rgba(22,23,27,.16)}
/* 按下反馈由 JS 弹簧驱动（硬阴影下压），这里只留键盘聚焦与降级 */
.btn:focus-visible{outline:2.2px solid var(--ink);outline-offset:2px}
.btn.pri{background:var(--accent)}
.btn.dan{background:#f3c9d8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border:2.2px solid var(--ink);background:#fff;cursor:pointer;
  /* 圆形图标按钮：和胶囊 chip 同一套圆形语言 */
  border-radius:50%;display:grid;place-items:center;
  box-shadow:2px 2px 0 rgba(22,23,27,.14)}
.stepper button svg{width:15px;height:15px}
.stepper button:active{transform:translate(1px,2px);box-shadow:0 0 0 rgba(0,0,0,0)}
.stepper .v{font-family:var(--f-num);font-weight:700;font-size:24px;min-width:40px;text-align:center}
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:2.1px solid var(--ink);background:#fff;
  padding:10px 13px;cursor:pointer;border-radius:13px 5px 14px 6px/6px 14px 5px 13px;
  box-shadow:2px 3px 0 rgba(22,23,27,.12);font-family:var(--f-cn);font-size:14px}
.opt:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(22,23,27,.12)}
.opt.sel{background:var(--accent)}
.opt .dot{width:12px;height:12px;border-radius:50% 44% 52% 46%;border:1.8px solid var(--ink);flex:0 0 auto}
.opt .sub{margin-left:auto;font-family:'PatrickHand',sans-serif;font-size:11.5px;color:var(--sub)}
.opt.sel .sub{color:var(--ink2)}

/* ===== 设置页 ===== */
.st-sec{background:#fff;border:2.3px solid var(--ink);border-radius:18px 7px 19px 8px/8px 19px 7px 18px;
  box-shadow:4px 5px 0 rgba(22,23,27,.13);padding:4px 15px;margin-bottom:13px}
.st-sec:nth-child(odd){transform:rotate(-.3deg)}
.st-sec:nth-child(even){transform:rotate(.3deg)}
.st-group{font-family:var(--f-cn);font-size:13px;color:var(--sub);margin:0 3px 8px;
  display:flex;align-items:center;gap:7px}
.st-group .badge{font-size:10.5px;padding:1px 7px;border:1.8px solid var(--ink);
  border-radius:8px 3px 9px 4px/4px 9px 3px 8px;background:var(--accent);color:var(--ink)}
.st-row{display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1.7px dashed rgba(22,23,27,.16);cursor:pointer}
.st-row:last-child{border-bottom:none}
.st-row .ic{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  border:2.1px solid var(--ink);border-radius:11px 4px 12px 5px/5px 12px 4px 11px}
.st-row .ic svg{width:18px;height:18px}
.st-row .tx{flex:1;min-width:0}
.st-row .tx b{display:block;font-family:var(--f-cn);font-size:14px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row .tx span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row .vv{font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13px;color:var(--sub);
  flex:0 0 auto;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .go{font-family:'PatrickHand',sans-serif;font-size:17px;color:var(--sub);flex:0 0 auto}
.st-row.danger .tx b{color:#b8465f}
.st-row:active{background:rgba(22,23,27,.04)}
/* 分类列表（可编辑） */
.st-cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:2px 0 9px;font-family:var(--f-cn);font-size:12.5px;color:var(--ink2)}
.st-cat-head .hint{font-size:11px;color:var(--sub)}
.st-cat{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1.7px dashed rgba(22,23,27,.16)}
.st-cat:last-child{border-bottom:none}
.st-cat .dot{width:14px;height:14px;border-radius:50% 44% 52% 46%;border:1.9px solid var(--ink);flex:0 0 auto}
.st-cat .nm{flex:1;min-width:0;font-family:var(--f-cn);font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-cat .cnt{font-family:'PatrickHand',sans-serif;font-size:12px;color:var(--sub);flex:0 0 auto}
.st-cat .mini{width:26px;height:26px;flex:0 0 auto;border:1.9px solid var(--ink);background:#fff;
  display:grid;place-items:center;cursor:pointer;border-radius:9px 3px 10px 4px/4px 10px 3px 9px}
.st-cat .mini svg{width:13px;height:13px}
.st-cat .mini:active{transform:translate(1px,1px)}
.st-cat .mini.rm{background:#f9e6ec}
/* ↑↓ 调顺序：两个小方块竖着叠，比横排省宽度（一行里还要放改名/删除） */
.st-cat .mv{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.st-cat .mvbtn{width:24px;height:19px;border-radius:7px 3px 8px 4px/4px 8px 3px 7px}
.st-cat .mvbtn svg{width:11px;height:11px}
.st-cat .mvbtn[disabled]{opacity:.26;cursor:default}
.st-cat .mvbtn[disabled]:active{transform:none}
.st-addrow{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0;
  font-family:var(--f-cn);font-size:13px;color:var(--ink2);cursor:pointer}
.st-addrow svg{width:19px;height:19px}
/* 外观（主色）选择已删除 —— 用户要求去掉主色功能，相关样式一并清掉 */
.st-note{font-size:12px;color:var(--sub);line-height:1.6;padding:2px 0 12px}
.st-meter{margin:0 0 12px}
.st-meter .tr{height:10px;border:2.1px solid var(--ink);border-radius:6px 3px 7px 3px/3px 7px 3px 6px;
  background:rgba(22,23,27,.05);position:relative;overflow:hidden}
.st-meter .fl{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px 2px 5px 2px/2px 5px 2px 4px;
  background:var(--accent)}
.st-ver{text-align:center;font-size:12px;color:var(--sub);padding:6px 0 10px;line-height:1.7}

/* ===== 物品详情页 ===== */
.dt-photo{position:relative;width:100%;aspect-ratio:1/1;max-height:250px;border:2.4px solid var(--ink);
  border-radius:18px 7px 19px 8px/8px 19px 7px 18px;overflow:hidden;background:#fff;cursor:pointer;
  box-shadow:5px 6px 0 rgba(22,23,27,.15);transform:rotate(-.4deg);margin-bottom:15px}
.dt-photo img{width:100%;height:100%;object-fit:cover;display:block}
.dt-photo.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,.6);border-style:dashed;box-shadow:3px 4px 0 rgba(22,23,27,.1)}
.dt-photo.empty svg{width:40%;height:40%;color:var(--ink);opacity:.45}
.dt-photo .dt-addhint{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2)}
.dt-photo .dt-like{position:absolute;top:11px;right:11px;width:17px;height:17px;border-radius:50%;
  border:2px solid var(--ink)}
/* 详情页大图上的喜欢标记（只读展示） */
.dt-photo .dt-lk{position:absolute;top:9px;right:9px;width:28px;height:28px;display:grid;place-items:center}
.dt-photo .dt-lk svg{width:28px;height:28px;overflow:visible;
  fill:#fff;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;paint-order:stroke fill}
/* 购入日期 */
#dtBuyIn{flex:1;min-width:0;border:2.1px solid var(--ink);background:#fff;
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;padding:7px 10px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);outline:none}
.dt-clearbtn{flex:0 0 auto;border:1.9px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:11.5px;padding:6px 11px;cursor:pointer;color:var(--ink2);
  border-radius:10px 4px 11px 5px/5px 11px 4px 10px;box-shadow:2px 2px 0 rgba(22,23,27,.1)}
.dt-clearbtn:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(0,0,0,0)}
.dt-photo .dt-st{position:absolute;bottom:11px;left:11px;font-family:var(--f-cn);font-size:11.5px;
  background:rgba(255,255,255,.95);border:2px solid var(--ink);
  border-radius:9px 3px 10px 4px/4px 10px 3px 9px;padding:2px 9px}
.dt-name{font-family:var(--f-cn);font-size:25px;font-weight:400;margin:0 0 5px;line-height:1.2}
.dt-meta{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.dt-card{background:#fff;border:2.3px solid var(--ink);border-radius:17px 7px 18px 8px/8px 18px 7px 17px;
  box-shadow:4px 5px 0 rgba(22,23,27,.13);padding:13px 15px;margin-bottom:13px}
.dt-qty{display:flex;align-items:center;justify-content:space-between}
.dt-qty .lb{font-family:var(--f-cn);font-size:15px}
.dt-qty .unit{font-size:12.5px;color:var(--sub)}
.dt-block{padding:11px 0;border-bottom:1.7px dashed rgba(22,23,27,.18)}
.dt-block:first-child{padding-top:0}
.dt-block:last-child{border-bottom:none;padding-bottom:0}
.dt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.dt-row .k{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2);flex:0 0 auto}
.dt-row .v{font-size:13.5px;color:var(--sub);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dt-row .v.filled{color:var(--ink)}
.dt-block > .k{display:block;font-family:var(--f-cn);font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.dt-seg{display:flex;gap:5px}
.dt-seg button{flex:1;border:2.1px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:11.5px;padding:8px 1px;cursor:pointer;color:var(--ink2);
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;box-shadow:2px 2px 0 rgba(22,23,27,.1);
  transition:background .12s,transform .1s}
.dt-seg button.on{background:var(--segc,#c9e8cf);color:var(--ink);transform:rotate(-1deg);
  box-shadow:2px 3px 0 rgba(22,23,27,.16)}
.dt-seg button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(22,23,27,.1)}
#dtLocIn{flex:1;min-width:0;border:2.1px solid var(--ink);background:#fff;
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;padding:7px 10px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);outline:none}
#dtNote{width:100%;min-height:66px;border:2.1px solid var(--ink);background:#fff;
  border-radius:12px 5px 13px 6px/6px 13px 5px 12px;padding:9px 11px;margin-top:2px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);
  outline:none;resize:vertical;line-height:1.5}
.dt-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.dt-acts .btn{width:100%}
.dt-acts .full{grid-column:1/-1}
.dt-delbtn{width:100%;background:#f3c9d8;margin-top:9px}

/* 轻提示 */
.toast{position:absolute;left:50%;transform:translateX(-50%) translateY(8px);
  /* 抬到固定底栏之上（栏本体约 66px + 安全区）。抽屉展开时栏更高，
     所以用 78px 而不是原来的 92px —— 那 92px 是给已删除的 Tab 栏留的。 */
  bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  background:var(--ink);color:#fdfaf1;font-family:var(--f-cn);font-size:13px;padding:9px 12px 9px 16px;
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:40;display:flex;align-items:center;gap:11px;
  max-width:330px;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .undo{font-family:var(--f-cn);font-size:12.5px;background:var(--accent);color:var(--ink);
  border:1.7px solid #fdfaf1;border-radius:9px 3px 10px 4px;padding:3px 10px;cursor:pointer;flex:0 0 auto}
.toast .txt{overflow:hidden;text-overflow:ellipsis}
</style>

<script>
/* 禁掉双指捏合缩放。加进主屏后还能捏小的话，露出的白边会让人一眼看出是网页。
   viewport 的 user-scalable=no 在 iOS 上基本被忽略，真正管用的是这两条：
     - gesturestart/change/end 是 iOS Safari 专有事件，拦掉即可
     - touchmove 里判断多指兜底（部分 WebView 不发 gesture 事件）
   注意：双击放大交给 CSS 的 touch-action:manipulation，
   千万别在 touchend 里 preventDefault —— 那会把后续 click 一起吃掉，按钮全点不动。
   iOS「辅助功能 → 缩放」的三指手势是系统级，网页拦不住也不该拦。 */
(function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
})();

/* ================= 动效内核 =================
   规范来源：app-interaction-design skill
   - 按钮按下/松手：button-feedback 的「硬阴影下压」
   - 点按钮长出面板：shape-and-text-motion 的 Trigger Morph
   - 长按拖拽：motion-effects 的「液态形变」+ interaction-patterns 的「拖拽排序」 */
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

/* 极简弹簧：x 当前值、t 目标值、v 速度、k 软硬、d 阻尼 */
function makeSpring(x = 0, k = 700, d = 40){ return { x, t:x, v:0, k, d }; }
function stepSpring(s, dt){
  s.v += (s.t - s.x) * s.k * dt;
  s.v *= Math.exp(-s.d * dt);
  s.x += s.v * dt;
  return s.x;
}

/* 一帧循环：只跑还活跃的弹簧，省电 */
const fxUpdaters = [];
let fxLast = performance.now();
function fxLoop(now){
  const dt = clamp((now - fxLast) / 1000, 0.001, 0.033);
  fxLast = now;
  for (const u of fxUpdaters) if (u.active) u.fn(dt);
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(t => { fxLast = t; requestAnimationFrame(fxLoop); });

/* 全局动效开关（尊重系统「减少动态效果」） */
const FX = {
  motionOff: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
};
if (window.matchMedia){
  try {
    window.matchMedia('(prefers-reduced-motion: reduce)')
      .addEventListener('change', e => { FX.motionOff = e.matches; });
  } catch(e){}
}

/* ---------- 硬阴影下压：按下 / 松手用两组弹簧 ----------
   文档要求：阴影钉在纸上不动，按钮面下沉去「吃掉」它；
   按下过阻尼（几乎不过冲），松手欠阻尼（出回弹）。 */
const PRESS_DOWN = { k:700, d:40 };   // ζ≈0.76，干脆到底
const PRESS_UP   = { k:700, d:22 };   // ζ≈0.42，松手回弹
const PRESS_DEPTH = 4.2;              // 下沉行程（阴影 5px，留 0.8px 黑边）

function bindPressFeedback(root){
  const scope = root || document;
  // 自动识别按钮：不依赖手写属性，任何 <button>（含动态生成的）都有按压反馈
  const sel = 'button, [data-press], .cat[data-cat], .goal';
  scope.querySelectorAll(sel).forEach(el => {
    if (el.__pressBound) return;
    // 输入类控件不需要按压反馈
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    // Tab 栏已有滑动指示块，再叠按压会显得抖（文档明确排除 Tabs）
    if (el.classList.contains('tb')) return;
    el.__pressBound = true;

    const spring = makeSpring(0, PRESS_DOWN.k, PRESS_DOWN.d);
    let running = false;
    // 阴影量：按元素自身 box-shadow 的纵向偏移推算，最大限制在 5px
    const shadowY = (() => {
      const sh = getComputedStyle(el).boxShadow || '';
      const m = sh.match(/rgba?\([^)]*\)\s+(-?[\d.]+)px\s+(-?[\d.]+)px/);
      return m ? clamp(parseFloat(m[2]) || 3, 2, 5) : 3;
    })();

    const updater = { active:false, fn(dt){
      stepSpring(spring, dt);
      const y = spring.x;
      el.style.transform = y === 0 ? '' : `translateY(${y.toFixed(2)}px)`;
      // 阴影随着按钮下沉被吃掉，两者由同一个弹簧值驱动
      el.style.boxShadow = `0 ${(shadowY - y).toFixed(2)}px 0 rgba(22,23,27,.16)`;
      if (Math.abs(spring.v) < 0.5 && Math.abs(spring.t - spring.x) < 0.05){
        spring.x = spring.t; spring.v = 0;
        el.style.transform = spring.t === 0 ? '' : `translateY(${spring.t}px)`;
        el.style.boxShadow = '';
        updater.active = false;
      }
    }};
    fxUpdaters.push(updater);

    const down = () => {
      if (FX.motionOff){ el.style.transform = `translateY(${PRESS_DEPTH}px)`; return; }
      spring.t = PRESS_DEPTH; spring.k = PRESS_DOWN.k; spring.d = PRESS_DOWN.d;
      updater.active = true;
    };
    const up = () => {
      if (FX.motionOff){ el.style.transform = ''; return; }
      spring.t = 0; spring.k = PRESS_UP.k; spring.d = PRESS_UP.d;
      updater.active = true;
    };

    el.addEventListener('pointerdown', e => { if (e.button === undefined || e.button === 0) down(); });
    ['pointerup','pointercancel','pointerleave','blur'].forEach(ev => el.addEventListener(ev, up));
    // 键盘触发也要有反馈
    el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') down(); });
    el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });
  });
}

/* ---------- Trigger Morph：面板从被点按钮的形状长出来 ----------
   文档要求：起点必须等于按钮真实矩形（实时量），圆角与尺寸一起插值，
   内容延迟到约 60% 才淡入，关闭必须原路收回。 */
let lastPointerDownTarget = null;
/* 记住「这次点是哪个元素触发的」，供形变展开当起点。
   选择器要覆盖所有会弹面板的入口：按钮、chips、分类卡、物品卡、软件行、目标卡。 */
const MORPH_ANCHOR_SEL = [
  'button',
  '.chip',
  '.cat',
  '.icard',
  '.arow',
  '.goal',
  '.st-row',
  '.mini',
  '.need',        // 软件行的「必需/暂用/待删」标签
  '.appcat',      // 软件行副行里的「分类」小标签
  '[data-morph-anchor]'
].join(',');
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest(MORPH_ANCHOR_SEL);
  lastPointerDownTarget = t || null;
}, true);

function morphFromButton(panel, btnEl, done, opts){
  const o = opts || {};
  const dur = o.duration || 620;
  const endRadius = o.radius || '19px';
  const btn = btnEl || lastPointerDownTarget;
  panel.style.transformOrigin = '50% 100%';

  if (!btn || FX.motionOff){
    // 拿不到按钮（或用户关了动效）就普通弹出，功能不受影响
    panel.animate([{opacity:0},{opacity:1}], {duration:180, easing:'ease-out'});
    if (done) done();
    return;
  }

  const b = btn.getBoundingClientRect();
  const p = panel.getBoundingClientRect();
  // 起点：和按钮同尺寸、同圆角；终点：面板当前几何
  const sx = Math.max(0.04, b.width / p.width);
  const sy = Math.max(0.04, b.height / p.height);
  const dx = (b.left + b.width / 2) - (p.left + p.width / 2);
  const dy = (b.top + b.height / 2) - (p.top + p.height / 2);

  const inner = panel.querySelector('.modal-inner') || panel.firstElementChild;
  const anim = panel.animate([
    { transform:`translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, borderRadius:'999px', opacity:1 },
    { transform:'translate(0,0) scale(1,1)', borderRadius:endRadius, opacity:1 }
  ], { duration: FX.motionOff ? 1 : dur, easing:'cubic-bezier(.22,.9,.24,1)', fill:'both' });

  if (inner){
    inner.animate([{opacity:0, offset:0},{opacity:0, offset:.62},{opacity:1, offset:1}],
      { duration: FX.motionOff ? 1 : dur, easing:'linear', fill:'both' });
  }
  anim.onfinish = () => { if (done) done(); };
  return anim;
}

/* 全局：取消所有正在等待的长按（弹面板、切页等情况要主动调用，
   否则松手后计时器仍会触发，凭空冒出一个跟手的拖拽浮层） */
const pendingHoldCancels = [];
function cancelAllHolds(){ pendingHoldCancels.forEach(fn => { try { fn(); } catch(e){} }); }

/* ---------- 标签让位（skill 的 Expanding Tag Selection）----------
   点某一行里的 chip 时：选中项**真的变宽**（`.chip.on` 加大内边距 → 改布局），
   同排的其它 chip 于是按**真实布局**被推开；用 FLIP 把这次位移补成平滑动画。

   ★ 两条硬约束（都踩过）：
   1. 不能用 `transform: scale()` 当"放大" —— scale 不参与布局，
      邻项根本不会被推开，"让位"就无从谈起。必须改**真的会影响布局**的属性
      （这里是 padding / font-size）。
   2. 让位位移用 **WAAPI** 播，不要用 CSS 变量 + transition ——
      自定义属性默认不可补间（没注册 @property 时会被当成离散值），
      写 `--flipx` 再改回去是**瞬间跳变**，看不到动画。
   3. 选中态的 class 切换必须发生在 `mutate` 回调**里面**：
      FLIP 靠"改之前量一次、改之后再量一次"求位移，切换放在外面则位移恒为 0。*/
function chipsReflow(chipRow, sel, mutate){
  if (!chipRow) return;
  const all = [...chipRow.querySelectorAll(sel || '.chip')];
  if (!all.length){ mutate(); return; }

  // ★ 量位置一律用 offsetLeft/offsetTop（布局盒），不能用 getBoundingClientRect：
  //   选中项带 rotate(-1.2deg)，它的 bbox 比真实盒子大 ~2px 还偏上，
  //   既会把「同一排」的判断顶出阈值，也会算错让位位移。
  const before = all.map(c => ({ l: c.offsetLeft, t: c.offsetTop }));

  mutate();   // 切换选中态：会真正改变布局

  // 液态Tab 指示块：跟着新的选中项跑（双弹簧，会先拉长再收缩）
  syncChipInd(chipRow, true);

  const after = all.map(c => ({ l: c.offsetLeft, t: c.offsetTop }));
  if (FX && FX.motionOff) return;

  // 只让「同一排」的 chip 让位：折行时纵向位移会像整块重排，手感很差
  const top0 = before[0].t;
  all.forEach((c, i) => {
    if (Math.abs(before[i].t - top0) > 2) return;
    const dx = before[i].l - after[i].l;
    // ★ 不能豁免「刚被选中的那个」：左对齐的行里它只是右边缘变宽、左边缘不动，
    //   本来就会被下面的 0.5px 阈值挡掉；但**居中**的行（状态行 / 必需行）里
    //   它是被推着走的那个 —— 左边那项一下缩窄 ~10px，整排重新居中，
    //   它的左边缘真的会移 ~10px。豁免它 = 这一行完全没有让位动画。
    if (!dx || Math.abs(dx) < 0.5) return;
    // 先无动画落回旧位置，再滑到新位置
    const anim = c.animate(
      [{ transform: `translateX(${dx.toFixed(2)}px) rotate(${c.classList.contains('on') ? '-1.2deg' : '0deg'})` },
       { transform: `translateX(0) rotate(${c.classList.contains('on') ? '-1.2deg' : '0deg'})` }],
      { duration: 300, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'none' }
    );
    // 失败安全：动画被打断也要回到基础状态（不依赖 fill 留住终点）
    anim.onfinish = anim.oncancel = () => { try { anim.cancel(); } catch(e){} };
  });
}

/* ---------- 液态Tab 指示块（skill 的 Liquid Tab Indicator）----------
   每行放一个 .chip-ind 作为「选中背景块」，它跟着选中项跑。
   关键在**前后边缘各用一个独立弹簧**、并按本次移动方向动态指派：
     · 前沿（朝着移动方向的边缘）用更硬的弹簧 → 先冲出去
     · 后沿用更软的 → 稍后跟上
   于是过渡中块会被**拉长**（实测能到 +50% 宽），过中点后收缩，末尾轻微回弹。
   如果两个边缘用同一套参数、或固定不管方向，就会退化成"整块平移"，
   或者向左切时顺序颠倒（先缩后长）—— 都是错的。

   ★ 只操作 transform/width，不碰布局；文字与点击区完全不动（指示块 z-index 在下面）。
   ★ 首帧同步定位一次（不能等 rAF），字体加载完再量一次（手写字体宽度会变）。*/
const IND_LEAD  = { k: 240, d: 14 };    // 前沿：冲得快
const IND_TRAIL = { k: 165, d: 12.5 };  // 后沿：跟得慢
const chipInds = new Map();             // containerId -> {el, L, R, active}

function ensureChipInd(container){
  if (!container || !container.id) return null;
  let rec = chipInds.get(container.id);
  if (rec && rec.el && rec.el.isConnected) return rec;
  // 复用或新建指示块
  let el = container.querySelector(':scope > .chip-ind');
  if (!el){
    el = document.createElement('span');
    el.className = 'chip-ind';
    container.insertBefore(el, container.firstChild);
  }
  // 只有真正挂了指示块的行才让出选中底色（弹窗里的 chip 组没有指示块，
  // 必须自己画底色，否则选中项会变成透明底）
  container.classList.add('has-ind');
  rec = {
    el,
    L: makeSpring(0, IND_LEAD.k, IND_LEAD.d),
    R: makeSpring(0, IND_TRAIL.k, IND_TRAIL.d),
    active: false
  };
  chipInds.set(container.id, rec);
  el.style.width = '0px';
  el.style.height = '0px';
  return rec;
}

/* 把指示块同步（或动画）到当前选中项。
   animate=false 用于首帧/重绘后的即时对齐；true 用于切换时播液态过渡。 */
function syncChipInd(container, animate){
  const rec = ensureChipInd(container);
  if (!rec) return;

  // 居中行：内容比容器宽时退回左对齐（否则 justify-content:center 会把首项裁掉一截）。
  // ★ clientWidth 为 0 说明这一页此刻是 display:none，量不出真实宽度。
  //   此时**不能**下判断 —— 否则会算成"溢出"并把 .overflowing 一直挂住，
  //   等页面显示出来就变成左对齐，看着像居中没生效。等下一次可量的同步再说。
  if (container.classList.contains('center') && container.clientWidth > 0){
    const kids = [...container.querySelectorAll('.chip')];
    const total = kids.reduce((s, c) => s + c.offsetWidth, 0) + 7 * Math.max(0, kids.length - 1);
    container.classList.toggle('overflowing', total > container.clientWidth - 6);
  }

  const on = container.querySelector('.chip.on');
  const el = rec.el;
  if (!on || !on.offsetWidth){
    el.classList.remove('on');
    rec.active = false;
    return;
  }
  // ★ 记下「这一行之前有没有选中项」：决定这次是"就地出现"还是"滑过去"。
  const wasVisible = el.classList.contains('on');
  el.classList.add('on');

  // 目标几何：直接用 offsetLeft/Top/Width/Height（都是相对容器 padding 盒的布局盒尺寸），
  // 与 .chip-ind{position:absolute;left:0;top:0} 的坐标系一致。
  // ★ 不要用 getBoundingClientRect：选中项的 rotate(-1.2deg) 会把 bbox 撑大 ~2px 且偏上，
  //   指示块会明显比按钮大一圈、还偏一点。
  const r = { left: on.offsetLeft, top: on.offsetTop, width: on.offsetWidth, height: on.offsetHeight };

  const targetL = r.left, targetR = r.left + r.width;
  el.style.height = r.height + 'px';
  el.style.top = r.top + 'px';

  if (!animate || (FX && FX.motionOff)){
    // ★ 若弹簧正在跑（用户刚点了别的标签，而重绘又跑了一次静态对齐），
    //   这里绝不能直接把 x 钉到目标 —— 那会把液体动画瞬间掐断成"跳变"。
    //   改成只更新目标，让已经在跑的弹簧自己滑过去。
    if (rec.active && FX && !FX.motionOff){ rec.L.t = targetL; rec.R.t = targetR; return; }
    rec.L.x = rec.L.t = targetL;
    rec.R.x = rec.R.t = targetR;
    rec.L.v = rec.R.v = 0;
    el.style.width = r.width + 'px';
    el.style.left = targetL.toFixed(1) + 'px';
    rec.active = false;
    return;
  }

  // ★ 这一行原先没有选中项（指示块刚从隐藏变显示）→ **就地出现，不要滑**。
  //   否则弹簧会从 x=0 起步，长距离冲过来时前沿会扫过并糊住沿途的按钮
  //   —— 用户报的「点第一个分类时那块绿色把它遮住」就是这么来的。
  //   首帧直接落在目标上，只保留一次轻微的宽度呼吸（下面 width 由弹簧给出）。
  if (!wasVisible){
    rec.L.x = rec.L.t = targetL;
    rec.R.x = rec.R.t = targetR;
    rec.L.v = rec.R.v = 0;
    el.style.width = r.width + 'px';
    el.style.left = targetL.toFixed(1) + 'px';
    rec.active = false;
    return;
  }

  // 前进方向决定谁是前沿、谁是后沿（每次都按本次方向重新指派）
  const toward = (targetL + targetR) / 2 >= (rec.L.x + rec.R.x) / 2 ? 1 : -1;
  const leadSpring  = toward > 0 ? rec.R : rec.L;   // 向右走：前沿是右边缘
  const trailSpring = toward > 0 ? rec.L : rec.R;
  leadSpring.k  = IND_LEAD.k;  leadSpring.d  = IND_LEAD.d;
  trailSpring.k = IND_TRAIL.k; trailSpring.d = IND_TRAIL.d;
  rec.L.t = targetL; rec.R.t = targetR;

  if (!rec.active){
    rec.active = true;
    // ★ 液体拉伸时前沿会冲过目标（实测长距离横移可超出 50px）。
    //   行是 overflow-x:auto，冲出行左边缘的部分会被**直接裁掉** ——
    //   表现就是「选中分类行第一个时，那块绿色被切掉/糊在按钮上」。
    //   所以把绘制范围夹在「本行 chip 的实际范围内」。
    //   ★ 边界必须由 chip 自己算，**不能用 container.scrollWidth**：
    //     绝对定位的指示块本身也算进滚动溢出，用它当上界会自激（越界→上界变大→更越界）。
    const kids = [...container.querySelectorAll('.chip')];
    const minX = kids.length ? kids[0].offsetLeft : 0;
    const last = kids[kids.length - 1];
    const maxX = last ? (last.offsetLeft + last.offsetWidth) : container.clientWidth;
    const updater = {
      active: true,
      fn(dt){
        stepSpring(rec.L, dt); stepSpring(rec.R, dt);
        // 夹住两个边缘（同时把弹簧的当前位置也钉在边界上，否则速度会一直把它推在外侧，
        // 看起来像"粘住不动"；速度本身保留，目标一变就能自然离开）
        if (rec.L.x < minX) rec.L.x = minX;
        if (rec.R.x > maxX) rec.R.x = maxX;
        let l = rec.L.x, r = rec.R.x;
        if (r < l + 4) r = l + 4;                 // 防止宽度为负
        el.style.width = (r - l).toFixed(1) + 'px';
        el.style.left = l.toFixed(1) + 'px';
        const settled = Math.abs(rec.L.v) < 0.6 && Math.abs(rec.R.v) < 0.6
          && Math.abs(rec.L.t - rec.L.x) < 0.3 && Math.abs(rec.R.t - rec.R.x) < 0.3;
        if (settled){
          rec.L.x = rec.L.t; rec.R.x = rec.R.t; rec.L.v = rec.R.v = 0;
          const fl = Math.max(minX, rec.L.x), fr = Math.min(maxX, rec.R.x);
          el.style.width = (fr - fl).toFixed(1) + 'px';
          el.style.left = fl.toFixed(1) + 'px';
          updater.active = false;
          rec.active = false;
        }
      }
    };
    fxUpdaters.push(updater);
  }
  // 已在跑 → 只更新目标（弹簧保留当前 x/v，快速连点自然从当前形态接续）
}

/* 给页里所有 chip 行都挂上指示块；rows 为空则扫全部 */
function syncAllChipInds(animate){
  $$('.chips').forEach(c => { if (c.querySelector('.chip')) syncChipInd(c, !!animate); });
}

/* 按 key 复用已有的 chip 节点，只更新文案/计数/选中态。
   ★ 为什么要复用：标签让位靠 FLIP，而 FLIP 要求「同一批 DOM 节点」跨越改动前后。
   如果每次都 innerHTML 重建，节点全换了，动画无从谈起。
   返回 true 表示复用了已有节点。 */
function syncChips(container, keys, htmlOf, clsOf){
  if (!container) return false;
  // ★ 只数 .chip：容器里还有一个 .chip-ind 指示块（是它的一级子元素）。
  //   若直接用 container.children，指示块会被当成第 0 个 chip，
  //   数量与 key 全都对不上 → 每次都走 innerHTML 重建，
  //   既把指示块本身冲掉，又破坏了 FLIP 要求的「同一批 DOM 节点」。
  const kids = [...container.children].filter(el => el.classList.contains('chip'));
  if (!kids.length) return false;                     // 首次渲染：交给调用方重建
  const keyAt = el => el.dataset.chipKey || '';
  if (kids.length !== keys.length) return false;
  for (let i = 0; i < keys.length; i++){
    if (keyAt(kids[i]) !== keys[i]) return false;     // 集合变了 → 重建
  }
  keys.forEach((k, i) => {
    const el = kids[i];
    const html = htmlOf(k);
    if (el.__chipHTML !== html){ el.innerHTML = html; el.__chipHTML = html; }
    const want = clsOf(k);
    if (el.className !== want) el.className = want;
  });
  return true;
}

/* 面板里聚焦输入框：必须等形变展开动画结束再 focus。
   动画进行中 focus 会让 iOS 在「元素还在缩放/位移」时把输入法唤起来，
   中文输入法的候选词条会因此不显示（打字能看到字，但选词栏是空的）。
   这里等动画真正落地（onfinish）再聚焦，并兜一个超时保险。*/
function focusInputWhenSettled(input, opts){
  if (!input) return;
  const o = opts || {};
  const doFocus = () => {
    try {
      input.focus({ preventScroll: true });
      if (o.select) input.select();
    } catch (e) { /* 忽略：某些环境不支持 preventScroll */ }
  };
  const anims = (typeof modal !== 'undefined' && modal && modal.getAnimations)
    ? modal.getAnimations() : [];
  if (!anims.length){ setTimeout(doFocus, 40); return; }

  let settled = false;
  const once = () => { if (settled) return; settled = true; doFocus(); };
  anims.forEach(a => {
    try { a.finished.then(once).catch(once); } catch (e) { once(); }
  });
  // 保险：动画最长 620ms，700ms 后无论怎样都聚焦
  setTimeout(once, 700);
}

   以前这里塞了 35 条假数据（白 T 恤、牛仔外套…），会让用户以为自己的清单里
   有这些东西。现在首次打开是空清单，引导去点「添加物品」。 */
let ITEMS = [];

/* 物品 id：必须全局唯一且跨会话稳定。
   ★ 不要用「内存计数器」生成（如 let uid=1; 'i'+(uid++)）—— 计数器不会存进数据库，
   重开页面后它又从头开始，新物品就会拿到一个已被占用的 id；
   而 ITEMS.find(x => x.id === id) 只会返回数组里靠前的那个，
   于是照片/编辑会"跳到"另一件同 id 的物品上。用时间戳+随机数即可避免。 */
function newItemId(){
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* 软件 id 同理（也别用 Date.now() —— 同一毫秒连加两条会撞车） */
function newAppId(){
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* 分类 id（物品 / 软件通用） */
function newCatId(prefix){
  return (prefix || 'c') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* 修复历史数据里已经存在的重复 id：保留第一条，后面的重新分配。
   这样用户库里已经撞车的条目会在下次打开时自动恢复。 */
function repairDuplicateItemIds(){
  const seen = new Set();
  let fixed = 0;
  ITEMS.forEach(i => {
    if (!i.id || seen.has(i.id)){
      i.id = newItemId();
      fixed++;
    }
    seen.add(i.id);
  });
  return fixed;
}

ITEMS.forEach(i => {
  if (!i.id) i.id = newItemId();
  if (!i.st) i.st = 'inuse';
});
repairDuplicateItemIds();

const ST_TEXT  = { inuse:'在用中', stored:'收纳中', consuming:'消耗中' };
const ST_COLOR = { inuse:'#fdfaf1', stored:'#dbeaf7', consuming:'#d9eddd' };
/* 状态的固定顺序（列表排序、筛选 chip、添加弹窗都用这一份，别各写各的）
   ★ 「待处理」已删除（用户要求）：它只进不出、又不影响任何汇总口径，
     还带一个降饱和的视觉否定，是四个状态里最没有功能的一个。 */
const ST_KEYS  = ['inuse', 'stored', 'consuming'];
/* 分段控件里的选中填充：在用也要看得出被选中，所以不用纯白 */
const ST_FILL  = { inuse:'#e8e6dc', stored:'#cfe4f4', consuming:'#c9e8cf' };
const LIKE_COLOR = { like:'#e0a03a', neutral:'#8b8c94', dislike:'#d4517f' };
/* 选中态的填充色：比圆点色淡，避免「必备」看起来像禁用 */
const TINTS = ['#f9dcec','#dbeaf7','#f7e9cf','#d9eddd','#e9e1f4','#f9e0d3'];

const state = { cat:'all', st:'all', season:'allyear', q:'', justMovedId:null };
/* 用户主动点了「清除分类筛选」时置 true：此时 state.cat='all' 是**用户意图**，
   renderCatChips 的「兜底自动选第一个分类」不能把它又改回去。
   用户重新点任意分类或切换状态时复位。 */
let catShowAll = false;
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
/* 安全绑定：元素不存在时跳过，避免一处缺失就中断整个脚本（曾因此导致页面空白） */
const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
const catOf = id => CATS.find(c => c.id === id) || { name:'未分类', tone:'#ddd' };

/* ================= 计算 ================= */
const liveItems = () => ITEMS;
function sumQty(rows){ return rows.reduce((s,i) => s + i.q, 0); }
function catQty(cid){ return sumQty(ITEMS.filter(i => i.c === cid)); }

/* ★ 筛选行的层级：状态行是「总行」，分类 / 位置 / 季节都是它的分支。
   所以两套口径必须分开：
     · 状态行 = 该状态下的**全部**物品（不受分类影响）—— 它才配叫"总"
     · 分支行 = 只算「当前状态」里的物品
   否则会出现用户实测报过的对不上：分类写着全部数量，可列表只显示
   「状态 ∩ 分类」，看起来像数字在撒谎。
   单位统一用**条数**（跟列表标题的「N 条」一致），不用件数——
   否则一件 q=3 的东西会让"状态 1 / 分类 3"再次对不上。 */
function itemsInSt(st){ return st === 'all' ? ITEMS : ITEMS.filter(i => i.st === st); }
function catQtyIn(cid, st){ return itemsInSt(st).filter(i => i.c === cid).length; }

/* ================= 总览 ================= */
/* 「我的收纳」主卡（总量/目标/状态分布/分类目标/清理队列）已按用户要求整块删除 ——
   现在这个 app 是纯收纳目录：筛选框 + 物品列表。
   ★ 不是把卡藏起来，是数据和函数一起删（GOAL_TOTAL / GOAL_APPS / SNAPSHOTS /
     DISPOSED / describe 那一套全部移除），避免留下一堆没人调用的死代码。
   renderHome 曾经是自动保存的挂载点之一，现在只剩 renderItems 负责，见那边。 */

/* 长按分类卡拖拽排序已删除 —— 分类网格（#catGrid）也从总览页删掉了，
   这个 IIFE 里的 grid 会是 null，addEventListener 直接抛错、中断整个脚本。 */

/* ================= 物品列表 ================= */
/* 筛选只剩两行：状态（总行）+ 分类（分支）。位置行和季节行已按用户要求删除。 */
function syncFilterGroup(){
  renderStChips();
  renderCatChips();
}

/* 「分类行第一个」= 该状态下第一个真有东西的分类。
   分类行只列 qty>0 的分类（见 renderCatChips），所以这里必须用同一口径，
   否则会选中一个根本没显示出来的分类。 */
function firstCatWithItems(st){
  const c = CATS.find(x => catQtyIn(x.id, st) > 0);
  return c ? c.id : 'all';
}

/* 进物品页的默认视图：状态行的第一个（在用中）+ **分类行的第一个**。
   用户明确要求「进去物品页后先显示在用中和分类行第一个」。
   从总览点某个分类进来时用那个分类（不然点进去看不到自己想看的）。 */
function resetItemFiltersToDefault(cat){
  state.st = ST_KEYS[0];            // 「在用中」
  state.cat = cat || firstCatWithItems(state.st);
}

function renderCatChips(){
  // 分类行 = 状态行的分支：只算「当前状态」里的物品，
  // 并且**只列出该状态下真有东西的分类**（数量为 0 的不出现，
  // 否则「收纳中只有 1 个」时下面还挂着 5 个 0，看不出从属关系）。
  //
  // ★ 「消耗中」**不要分类行**（用户要求：消耗品就是日用品，不用再按分类挑）。
  //   这里把这一行整个从 DOM 摘掉（不是 display:none 留空白）；
  //   切回别的状态时由 ensureCatRow() 插回去。cat 在 renderItems 里已归 'all'。
  if (state.st === 'consuming'){
    const row0 = $('#catRow');
    if (row0) row0.remove();
    return;
  }
  ensureCatRow();

  // ★ 兜底：分类没选中任何一项（'all'）时，默认选「当前状态下第一个有物品的分类」。
  //   正常路径下状态行点击已经选好了，这里是防止从别的入口进来时漏掉
  //   （比如空状态的「显示全部」、导入备份、首次渲染），
  //   否则会出现"分类行显示了、但一个都没选中"，用户不知道现在在看什么。
  //   ★ 但用户主动点了「清除筛选」(catShowAll) 时不兜底 —— 那是他的明确意图，
  //     弹回第一个分类等于把他刚做的操作撤销掉。
  if (state.cat === 'all' && !catShowAll){
    const first = firstCatWithItems(state.st);
    if (first !== 'all') state.cat = first;
  }

  // ★ 筛选的分类在当前状态下已经空了 → 换成**该状态的第一个分类**
  //   （跟进页面时的默认一致；直接退回「全部」会变成一行里一个都没选中，
  //    用户就分不清当前在看什么了）。
  //   放在建列表之前，否则这一帧还会把它画成选中，下一帧才消失，看着像闪一下。
  if (state.cat !== 'all' && catQtyIn(state.cat, state.st) === 0){
    state.cat = firstCatWithItems(state.st);
  }

  const list = CATS
    .map(c => ({ ...c, qty: catQtyIn(c.id, state.st) }))
    .filter(c => c.qty > 0 || state.cat === c.id);
  const keys = list.map(c => c.id);
  // 容器可能刚被 ensureCatRow() 插回来，取一次并确认存在
  const catBox = $('#catChips');
  if (!catBox) return;
  // 复用已有节点（标签让位要求同一批 DOM 跨越改动前后）
  const reused = syncChips(catBox, keys,
    k => { const c = list.find(x => x.id === k);
           return `${c.name}<span class="n">${c.qty}</span>`; },
    k => 'chip' + (state.cat === k ? ' on' : ''));
  if (!reused){
    catBox.innerHTML = list.map(c =>
      `<button class="chip${state.cat === c.id ? ' on' : ''}" data-cat="${c.id}" data-chip-key="${c.id}">${c.name}<span class="n">${c.qty}</span></button>`
    ).join('');
  }
  const row = $('#catRow');
  if (row) row.style.display = list.length ? 'flex' : 'none';

  // ★ 空态：这一档下一条物品都没有（或所有分类都空），抽屉里会只剩一片空白，
  //   看起来像坏了。给一句说明，别让用户以为功能失效。
  const emptyEl = $('#catEmpty');
  if (emptyEl) emptyEl.style.display = list.length ? 'none' : 'block';
}

/* 状态 tab 的图标：三个状态各一个，线条风格和页面里其它图标一致
   （stroke:currentColor，粗细 2，跟着 tab 的选中/未选中变色）。 */
const ST_ICON = {
  // 在用中：一只举手/人形 —— 正在被使用的意思
  inuse: '<path d="M12 12.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"/><path d="M5.4 19.4c0-3.1 2.9-5.2 6.6-5.2s6.6 2.1 6.6 5.2"/>',
  // 收纳中：一个收好的箱子
  stored: '<path d="M4.2 8.2 12 4.6l7.8 3.6v7.6L12 19.4 4.2 15.8Z"/><path d="M4.2 8.2 12 11.8l7.8-3.6M12 11.8v7.6"/>',
  // 消耗中：一滴水（用掉一点少一点）
  consuming: '<path d="M12 4.4c3.1 3.6 5.2 6.3 5.2 8.9a5.2 5.2 0 0 1-10.4 0c0-2.6 2.1-5.3 5.2-8.9Z"/>',
};

function stChipHTML(k){
  const ico = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ST_ICON[k] || ''}</svg>`;
  return `${ico}${ST_TEXT[k]}<span class="n">${itemsInSt(k).length}</span>`;
}

/* 状态行 = 底部三个 tab：每一档显示**该状态下的全部条数**（不受分类影响）。 */
function renderStChips(){
  const sts = ST_KEYS;
  const keys = sts;
  const reused = syncChips($('#stChips'), keys,
    k => stChipHTML(k),
    k => 'chip' + (state.st === k ? ' on' : ''));
  if (!reused){
    $('#stChips').innerHTML = sts.map(k =>
      `<button class="chip${state.st === k ? ' on' : ''}" data-st="${k}" data-chip-key="${k}">${stChipHTML(k)}</button>`
    ).join('');
  }
}

/* 喜欢筛选行已删除（用户要求）；卡片上的喜欢圆点、编辑面板里的喜欢选择都保留 */

/* 软件页已整页删除（用户明确说「我不需要软件页功能」）。
   原来这里有一整套软件相关的函数：renderNeedChips / renderAppCatChips /
   renderApps / openAppPop / openAppCatPop / newAppModal / deleteApp /
   initAppDrag / initAppSwipe / migrateNeedValues，以及 appsInNeed 等口径函数。
   ★ 数据字段保留：APPS / APP_CATS / appState 仍在内存与备份结构里
     （删掉会让旧备份导入报错），只是界面上不再有入口。 */

/* 季节筛选行已删除（用户要求：筛选只保留「状态 + 分类」两行）。
   ★ 物品的 i.season 字段还在：季节是衣物卡上要显示的信息，不是筛选维度。
     位置（i.loc）则整套删掉了 —— 筛选、显示、编辑输入都没有了。 */

/* 消耗中那一档会把 #catRow 从 DOM 摘掉（消耗品就是日用品，不用再按分类挑）。
   切回其他状态时用它把这一行插回抽屉的 .catdrawer-in 里。

   ★ 这里改成了「事件委托」的写法配合：重建出来的节点是新对象，
     原来直接绑在 #catChips 上的 click 监听会跟着旧节点一起消失。
     所以点击监听现在绑在 #tabbar 上（见下方 on('#tabbar', ...)），
     这个函数只负责把 DOM 放回去。 */
function ensureCatRow(){
  if ($('#catRow')) return;
  const host = document.getElementById('catDrawer');
  if (!host) return;
  const div = document.createElement('div');
  div.className = 'chipRow branch';
  div.id = 'catRow';
  div.innerHTML = '<div class="chips center" id="catChips"></div>';
  // 插在空态提示**之前**：分类行要在上、空态文字在下
  const empty = document.getElementById('catEmpty');
  if (empty) host.insertBefore(div, empty);
  else host.appendChild(div);
}

/* ---- 分类抽屉：展开 / 收起 ----
   ★ 触发方式是「再点一次当前已选中的状态 tab」，不是点别的 tab。
     因为点任何一个状态 tab 都会把分类重置成「该状态下第一个有物品的分类」，
     若靠点状态唤出抽屉，就永远没法从「在用中·衣物」直接跳到「在用中·数码」——
     中间会被悄悄重置一次。 */
function catDrawerOpen(){ return $('#catDrawer')?.classList.contains('open'); }

function setCatDrawer(open, opts){
  const bar = $('#tabbar');
  const dr = $('#catDrawer');
  if (!bar || !dr) return;
  // 「消耗中」没有分类维度，抽屉无从展开 → 强制收起
  if (open && state.st === 'consuming') open = false;
  // 没有分类可展开时也把把手藏掉，不给假提示
  bar.classList.toggle('nocat', state.st === 'consuming');
  const was = dr.classList.contains('open');
  // ★ 抽屉是 .phone 的直接子元素，不挂在 .tabbar 下面（见 HTML 注释：
  //   否则折行后超出父级边界的 chip 点不动），所以开合状态记在它自己身上。
  bar.classList.toggle('catopen', !!open);   // 只用于把手/样式的联动
  dr.classList.toggle('open', !!open);

  syncTabPad();
  if (open !== was && !(opts && opts.silent)){
    if (open) requestAnimationFrame(() => syncChipInd($('#catChips'), false));
  }
}

function toggleCatDrawer(){ setCatDrawer(!catDrawerOpen()); }

/* 滚动区底部留白：至少让最后一条物品能滚到固定底栏上方。
   抽屉是浮在底栏之上的（position:absolute），展开时会盖住列表底部，
   所以展开时把抽屉高度也算进留白里。 */
function syncTabPad(){
  const bar = $('#tabbar');
  const home = $('#scr-home');
  if (!bar || !home) return;
  const dr = $('#catDrawer');
  const open = !!(dr && dr.classList.contains('open'));
  const extra = open ? dr.offsetHeight + 7 : 0;   // 7 = 抽屉与胶囊之间的间隙
  home.style.paddingBottom = (bar.offsetHeight + extra + 16) + 'px';
}

function renderItems(){
  // ★ 「消耗中」不要分类行（那一档 cat 归 all，列表显示全部消耗品）。
  //   其他状态会把分类行插回来（如果上一帧刚被摘掉）。
  if (state.st === 'consuming'){
    state.cat = 'all';
    setCatDrawer(false, { silent: true });   // 没有分类维度 → 抽屉也收起来
  } else {
    ensureCatRow();
    // ★ 从「消耗中」切回来时必须把 nocat 复位，否则抽屉把手一直藏着。
    //   这里只同步 nocat，不动展开状态（用户手动的收/放要保留）。
    const barEl = $('#tabbar');
    if (barEl) barEl.classList.remove('nocat');
  }
  // 底部两张大卡（添加物品 + 设置）只在「消耗中」出现（用户要求）
  const bar = $('#bottombar');
  if (bar) bar.style.display = (state.st === 'consuming') ? 'flex' : 'none';
  syncFilterGroup();  // 筛选只剩「分类 × 状态」两个维度（喜欢 / 位置 / 季节 / 搜索框都已删除）。
  const rows = ITEMS.filter(i =>
    (state.cat === 'all' || i.c === state.cat) &&
    (state.st === 'all' || i.st === state.st)
  );
  // 排序：先按状态聚在一起（在用中 → 收纳中 → 消耗中 → 待处理），
  // 状态内部再按用户拖拽的顺序。这样改了状态的卡片是真会挪到另一堆里去，
  // 而不是留在原地不动。
  const ST_ORDER = { inuse:0, stored:1, consuming:2 };
  rows.sort((a, b) => {
    const d = (ST_ORDER[a.st] ?? 9) - (ST_ORDER[b.st] ?? 9);
    if (d) return d;
    return (a.order ?? 9999) - (b.order ?? 9999);
  });
  const qty = sumQty(rows);

  const catName = state.cat === 'all' ? '全部物品' : catOf(state.cat).name;
  const stName = state.st === 'all' ? '' : ` · ${ST_TEXT[state.st]}`;
  $('#resTitle').textContent = catName + stName;
  $('#resCnt').textContent = `${rows.length} 条 · ${qty} 件`;
  // 底栏（含展开的抽屉）高度会变 → 滚动区底部留白跟着改，
  // 否则最后一条物品会被压在栏底下点不到。
  syncTabPad();
  // ★ 原来这里还给 #listTitle / #listCnt 赋值，但那个 .page-head 已删（和 count-row 重复），
  //   保留赋值会 TypeError 打断 renderItems。

  const cards = rows.map(i => {
    const k = ITEMS.indexOf(i);
    const tint = TINTS[k % TINTS.length];
    const seasonTxt = i.season ? (SEASONS.find(s => s.id === i.season) || {}).name : '';

    // 缩略图只有 79px：「加照片」的文字放不下（会和图标叠在一起），
    // 只留一个淡淡的 + 提示，具体文案靠点击后的行为表达。
    const phInner = i.photo
      ? `<img src="${i.photo}" alt="">`
      : `<span class="addph">
           <svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v10M7 12h10"/></svg>
         </span>
         <svg class="phic"><use href="#${i.ic || 'ic-box'}"/></svg>`;

    const qtyBadge = i.q > 1 ? `<span class="qty">×${i.q}</span>` : '';

    // 单列横卡：左缩略图 → 右文字（名称/季节/状态）→ 右侧数量
    // ★ 日期、位置、删除按钮都已删除（用户要求）：
    //   卡片只剩「这是什么 + 几件 + 什么状态」，删除改成在卡片上左滑。
    // ★ 外层 .icard-wrap 是左滑删除的「槽」：底层放删除块，上层 .icard 会滑开。
    return `<div class="icard-wrap" data-wrap="${i.id}">
      <div class="swipe-del">
        <button class="del-go" data-delitem="${i.id}" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.6 7V5.2h4.8V7M7 7l1 12.4h8L17 7"/></svg>
        </button>
      </div>
      <div class="icard" data-item="${i.id}" draggable="false">
        <div class="ph" style="background:${i.photo ? '#fff' : tint}" data-photo="${i.id}">
          ${phInner}
        </div>
        <div class="meta">
          <div class="nm">${i.n}</div>
          <div class="line2">
            ${seasonTxt ? `<span class="se-txt">${seasonTxt}</span>` : ''}
            <span class="st-tag" data-status="${i.id}" style="background:${ST_COLOR[i.st]}">${ST_TEXT[i.st]}</span>
          </div>
        </div>
        <div class="side">
          ${qtyBadge}
        </div>
      </div>
    </div>`;
  }).join('');

  // 不再放「添加物品」虚线卡——用右下角的加号按钮
  $('#igrid').innerHTML = cards;

  if (!rows.length){
    // 空状态分两种：库里真没有 vs 只是被当前筛选挡住了（后者给一键显示全部，
    // 否则用户会以为"刚加的东西没进去"）
    // ★ 容器现在是 flex 单列，用 flex:0 0 auto + width:100% 占满（grid-column 在 flex 里无效）
    // ★ 底部那两张卡只在「消耗中」出现，所以在其他档位空列表时，
    //   这里必须自带一个添加入口，否则用户无处可点（会以为 app 坏了）。
    if (!ITEMS.length){
      $('#igrid').innerHTML = `<div class="empty" style="flex:0 0 auto;width:100%">
        <b>还没有物品</b><span>从这里加第一件</span>
        <button class="btn pri" id="emptyAdd" style="max-width:170px;margin:12px auto 0">添加物品</button>
      </div>`;
    } else {
      $('#igrid').innerHTML = `<div class="empty" style="flex:0 0 auto;width:100%">
        <b>当前筛选下没有物品</b>
        <span>库里有 ${ITEMS.length} 条，只是被筛选挡住了</span>
        <button class="btn pri" id="itemShowAll" style="max-width:170px;margin:12px auto 0">显示全部</button>
      </div>`;
    }
  }

  // 刚改完状态的那张卡：在新位置上播一个"落位"动画并滚到可见处，
  // 让人看清它到底挪到哪里去了
  // ★ 动画加在 .icard-wrap 上（不是 .icard）—— .icard 自己要带倾斜，
  //   而且左滑删除会用 transform 移动它，两者叠在一起会互相覆盖。
  if (state.justMovedId){
    const movedId = state.justMovedId;
    state.justMovedId = null;
    const el = $('#igrid').querySelector(`.icard-wrap[data-wrap="${movedId}"]`);
    if (el){
      el.classList.add('arriving');
      setTimeout(() => el.classList.remove('arriving'), 480);
      if (!FX.motionOff) setTimeout(() => el.scrollIntoView({ block:'nearest', behavior:'smooth' }), 60);
    }
  }
  // 物品页的两行 chip 都在这里渲染完 → 把指示块对齐到选中项
  syncChipInd($('#stChips'), false);
  syncChipInd($('#catChips'), false);
  saveSoon();
}

/* ================= 导航 ================= */
/* ★ 只有一个页面（目标卡 + 物品列表）：底部 Tab 和软件页都已删除，
   showTab / syncTabInd / TAB_ORDER / goItems 这些切页逻辑一并删掉。
   「回到列表顶部」现在由 renderItems 之后的滚动处理负责。 */


/* ================= 弹层 ================= */
const mask = $('#mask'), modal = $('#modal');
let modalAnim = null;

function openModal(html, anchorEl){
  // 弹面板说明用户已经松手了：先把还挂着的长按计时器掐掉，
  // 否则 420ms 后 begin() 会照着已松手的位置克隆一张卡飘在屏幕上（去不掉）
  cancelAllHolds();
  modal.innerHTML = html;
  // 关掉 CSS 里的默认弹出动画，改由 Trigger Morph 接管
  modal.style.animation = 'none';
  mask.classList.add('on');
  // 面板的起点要贴合被点的按钮：优先用调用方指定的锚点，否则用 pointerdown 记下的那个
  const btn = anchorEl || lastPointerDownTarget;
  if (modalAnim){ try { modalAnim.cancel(); } catch(e){} }
  modalAnim = morphFromButton(modal, btn);
}
function closeModal(){
  mask.classList.remove('on');
  if (modalAnim){ try { modalAnim.cancel(); } catch(e){} modalAnim = null; }
  // 收起时把内联样式清掉，下次打开才不会带着旧几何
  modal.style.transform = '';
  modal.style.borderRadius = '';
  modal.style.opacity = '';
}
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });

/* --- 新建分类 --- */
function newCatModal(){
  openModal(`
    <h3>新建分类</h3>
    <p class="mhint">给这一类物品起个名字，之后可以随时改名</p>
    <div class="fld">
      <label>分类名称</label>
      <input type="text" id="newCatName" placeholder="比如 厨房、文具、工具" maxlength="8">
    </div>
    <div class="mrow">
      <button class="btn" id="catCancel">取消</button>
      <button class="btn pri" id="catOk" disabled>创建</button>
    </div>
  `);
  const nameIn = $('#newCatName'), okBtn = $('#catOk');
  nameIn.addEventListener('input', () => { okBtn.disabled = !nameIn.value.trim(); });
  focusInputWhenSettled(nameIn);
  $('#catCancel').addEventListener('click', closeModal);
  okBtn.addEventListener('click', () => {
    const name = nameIn.value.trim();
    if (!name) return;
    const tone = NEW_TONES[CATS.length % NEW_TONES.length];
    CATS.push({ id:'c' + Date.now(), name, tone });
    closeModal();
    // 设置页的分类列表也要跟着刷新（新建入口现在就在这里）
    renderSettings(); renderCatChips(); renderItems();
    toast(`已新建分类「${name}」`);
  });
}

/* --- 添加物品 --- */
function newItemModal(){
  // 分类可能一个都不剩（用户可以在设置里全删光）：
  // 读 CATS[0].id 会抛异常 → 整个按钮静默失效。这里兜一个「未分类」。
  if (!CATS.length) CATS.push({ id:'none', name:'未分类', tone:'#e6e6ea' });
  let qty = 1, cat = (state.cat !== 'all' ? state.cat : CATS[0].id);
  // 当前筛选的分类可能刚被删掉 → 回落到第一个可用的
  if (!CATS.some(c => c.id === cat)) cat = CATS[0].id;
  const catChips = () => CATS.map(c =>
    `<button class="chip${cat === c.id ? ' on' : ''}" data-pick="${c.id}">${c.name}</button>`).join('');
  // 状态：默认「在用中」（用户要求把原来这里的选择换掉）
  let st = 'inuse';
  const stChips = () => ST_KEYS.map(k =>
    `<button class="chip${st === k ? ' on' : ''}" data-pickst="${k}">${ST_TEXT[k]}</button>`).join('');

  openModal(`
    <h3>添加物品</h3>
    <p class="mhint">只有名称是必填的，其他都能以后再补</p>
    <div class="fld">
      <label>名称</label>
      <input type="text" id="niName" placeholder="比如 白 T 恤" maxlength="14">
    </div>
    <div class="fld">
      <label>分类</label>
      <div class="chips round" id="niCat" style="padding-bottom:2px">${catChips()}</div>
    </div>
    <div class="fld">
      <label>状态</label>
      <div class="chips round" id="niSt" style="padding-bottom:2px">${stChips()}</div>
    </div>
    <div class="fld">
      <label>数量</label>
      <div class="stepper">
        <button id="niMinus"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <span class="v" id="niQty">1</span>
        <button id="niPlus"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
    </div>
    <div class="mrow">
      <button class="btn" id="niCancel">取消</button>
      <button class="btn pri" id="niOk" disabled>添加</button>
    </div>
  `);

  const nameIn = $('#niName'), okBtn = $('#niOk');
  nameIn.addEventListener('input', () => { okBtn.disabled = !nameIn.value.trim(); });
  focusInputWhenSettled(nameIn);
  $('#niMinus').addEventListener('click', () => { qty = Math.max(1, qty - 1); $('#niQty').textContent = qty; });
  $('#niPlus').addEventListener('click', () => { qty = Math.min(999, qty + 1); $('#niQty').textContent = qty; });
  $('#niCat').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    cat = b.dataset.pick;
    $('#niCat').innerHTML = catChips();
  });
  $('#niSt').addEventListener('click', e => {
    const b = e.target.closest('[data-pickst]'); if (!b) return;
    st = b.dataset.pickst;
    $('#niSt').innerHTML = stChips();
  });
  $('#niCancel').addEventListener('click', closeModal);
  okBtn.addEventListener('click', () => {
    const name = nameIn.value.trim();
    if (!name) return;
    // 喜欢默认「必备」，之后在卡片上点爱心改
    const item = { id:newItemId(), n:name, c:cat, q:qty, st, ic:'ic-box' };
    ITEMS.push(item);
    closeModal();
    renderSettings(); renderCatChips(); renderItems();
    // ★ 归属透明：如果它不在当前视图里（分类/状态与当前筛选不符），
    //   明确告诉用户去哪找，而不是让人以为"添加了却没生效"
    const catName = (CATS.find(x => x.id === item.c) || {}).name || '';
    const outsideCat = state.cat !== 'all' && state.cat !== item.c;
    const outsideSt = state.st !== 'all' && state.st !== item.st;
    if (outsideCat || outsideSt){
      const where = [catName, ST_TEXT[item.st]].filter(Boolean).join(' · ');

       ${cur === m.k ? '<span class="ck">✓</span>' : ''}
     </div>`).join('');

  let left = aRect.left - phoneRect.left - 8;

  pop.style.left = left + 'px';

  morphFromButton(pop, anchor, null, { duration: 380, radius: '14px' });

    const cardEl = document.querySelector(`#igrid .icard[data-item="${it.id}"]`);

    } else {

  };
}
