/* --- 导出备份 --- */
function exportBackup(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    cats: CATS, appCats: APP_CATS,
    items: ITEMS, apps: APPS,
    goals: { total: GOAL_TOTAL, apps: GOAL_APPS },
    snapshots: SNAPSHOTS
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `收纳备份-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`已导出 ${ITEMS.length} 条物品 · ${APPS.length} 个软件`);
  } catch (err) {
    toast('导出失败，换个浏览器试试');
  }
}

/* --- 导入备份（可选 覆盖 / 合并） --- */
function importBackup(){
  openModal(`
    <h3>导入备份</h3>
    <p class="mhint">先选怎么处理，再挑备份文件</p>
    <div class="optlist" id="ibModes">
      <div class="opt sel" data-mode="merge">
        <span style="font-family:var(--f-cn)">合并</span>
        <span class="sub">保留现有 ${ITEMS.length} 条物品</span>
      </div>
      <div class="opt" data-mode="replace">
        <span style="font-family:var(--f-cn)">覆盖</span>
        <span class="sub">清掉现在的，换成备份的</span>
      </div>
    </div>
    <div class="mhint" id="ibTip" style="margin-top:11px">同名同类物品会合并数量，不会出现重复两条。</div>
    <div class="mrow">
      <button class="btn" id="ibCancel">取消</button>
      <button class="btn pri" id="ibOk">选择文件</button>
    </div>
  `);
  let mode = 'merge';
  $('#ibModes').addEventListener('click', e => {
    const o = e.target.closest('[data-mode]'); if (!o) return;
    mode = o.dataset.mode;
    $$('#ibModes .opt').forEach(x => x.classList.toggle('sel', x === o));
    $('#ibTip').textContent = mode === 'merge'
      ? '同名同类物品会合并数量，不会出现重复两条。'
      : '当前数据会被全部替换，导入前建议先导出一份。';
  });
  $('#ibCancel').addEventListener('click', closeModal);
  $('#ibOk').addEventListener('click', () => {
    closeModal();
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (!d || !Array.isArray(d.items) || !Array.isArray(d.apps)) throw new Error('bad');
          const res = applyBackup(d, mode);
          toast(mode === 'merge'
            ? `已合并：新增 ${res.added} 条 · 合并数量 ${res.merged} 条`
            : `已覆盖：${ITEMS.length} 条物品 · ${APPS.length} 个软件`);
        } catch (err) {
          toast('这个备份文件无法读取');
        }
      };
      fr.readAsText(f);
    };
    inp.click();
  });
}

/* mode: 'replace' 覆盖 | 'merge' 合并 */
function applyBackup(d, mode){
  // 备份里图片是 dataURL 直接带着的，不用额外处理
  const inItems = (d.items || []).map(i => ({ ...i }));
  const inApps  = (d.apps  || []).map(a => ({ ...a }));
  inItems.forEach((i, n) => { if (!i.id) i.id = 'bk-i' + (n + 1); if (!i.st) i.st = 'inuse'; });
  inApps.forEach((a, n) => { if (!a.id) a.id = 'bk-a' + (n + 1); });

  if (mode === 'replace'){
    CATS     = (d.cats || []).map(c => ({ ...c }));
    APP_CATS = (d.appCats || []).map(c => ({ ...c }));
    ITEMS    = inItems;
    APPS     = inApps;
    GOAL_TOTAL = (d.goals && d.goals.total) || 0;
    GOAL_APPS  = (d.goals && d.goals.apps) || 0;
    if (Array.isArray(d.snapshots) && d.snapshots.length) SNAPSHOTS = d.snapshots;
  } else {
    // ---- 合并 ----
    // 1) 分类：按名字去重，备份里没有的分类补进来
    const mergeCats = (cur, inc) => {
      inc.forEach(ic => {
        const hit = cur.find(c => c.name === ic.name);
        if (hit){
          if (!hit.goal && ic.goal) hit.goal = ic.goal;   // 本地没设目标就用备份的
        } else {
          cur.push({ ...ic, id: 'mg-' + Math.random().toString(36).slice(2, 8) });
        }
      });
    };
    mergeCats(CATS, d.cats || []);
    mergeCats(APP_CATS, d.appCats || []);

    // 2) 物品：同名 + 同分类 → 合并数量；否则新增
    let added = 0, merged = 0;
    inItems.forEach(ii => {
      const cName = ((d.cats || []).find(c => c.id === ii.c) || {}).name;
      const targetCat = CATS.find(c => c.name === cName) || CATS.find(c => c.id === ii.c);
      const dup = ITEMS.find(x => x.n === ii.n && (!targetCat || x.c === targetCat.id));
      if (dup){
        dup.q = (dup.q || 1) + (ii.q || 1);          // 数量相加
        if (!dup.photo && ii.photo) dup.photo = ii.photo;   // 没图的补图
        if (!dup.loc && ii.loc) dup.loc = ii.loc;
        if (!dup.note && ii.note) dup.note = ii.note;
        if (!dup.buy && ii.buy) dup.buy = ii.buy;
        merged++;
      } else {
        ITEMS.push({ ...ii, id: 'mg-i' + Math.random().toString(36).slice(2, 8),
          c: targetCat ? targetCat.id : ii.c });
        added++;
      }
    });

    // 3) 软件：同名 → 跳过；否则新增（软件不分分类）
    inApps.forEach(ia => {
      const dup = APPS.find(x => x.n === ia.n);
      if (dup){
        if (!dup.photo && ia.photo) dup.photo = ia.photo;
        if (!dup.note && ia.note) dup.note = ia.note;
        if (!dup.loc && ia.loc) dup.loc = ia.loc;
      } else {
        APPS.push({ ...ia, id: 'mg-a' + Math.random().toString(36).slice(2, 8) });
        added++;
      }
    });

    renderSettings(); renderHome(); renderCatChips(); renderSeasonChips();
    renderItems(); renderApps();
    saveSoon();
    return { added, merged };
  }

  renderSettings(); renderHome(); renderCatChips(); renderSeasonChips();
  renderItems(); renderApps();
  saveSoon();
  return { added: inItems.length, merged: 0 };
}

/* ================= 持久化：IndexedDB =================
   图片存 Blob（不用 base64，省约 1/3 空间）；其余数据存 JSON。
   没有数据库环境时自动降级为「不保存」，页面照常能用。 */
const DB_NAME = 'digital-shelf';
const DB_VER  = 1;

function openDB(){
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VER); }
    catch (e){ resolve(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
    req.onblocked = () => resolve(null);
    // 隐私模式或库被占用时可能一直挂起，1.5 秒后放弃（界面已经先渲染了，不影响使用）
    setTimeout(() => resolve(null), 1500);
  });
}

/* 收集要存的整份状态 */
function snapshotState(){
  return {
    version: 1,
    savedAt: Date.now(),
    accentId,
    photoStyle,
    lastSnapAt,
    goals: { total: GOAL_TOTAL, apps: GOAL_APPS },
    cats: CATS.map(c => ({ ...c })),
    appCats: APP_CATS.map(c => ({ ...c })),
    // 图片单独存，这里只留标记，避免 JSON 里塞大字符串
    items: ITEMS.map(i => { const { photo, ...rest } = i; return { ...rest, hasPhoto: !!photo }; }),
    apps:  APPS.map(a => { const { photo, ...rest } = a; return { ...rest, hasPhoto: !!photo }; }),
    snapshots: SNAPSHOTS
  };
}

async function saveNow(){
  if (!db || suppressSave) return;
  try {
    const tx = db.transaction(['kv', 'photos'], 'readwrite');
    const kv = tx.objectStore('kv');
    const ph = tx.objectStore('photos');

    kv.put(snapshotState(), 'state');
    // 图片：dataURL → Blob 后存（Blob 更省空间）
    const all = [...ITEMS.map(i => ({ id:'item:' + i.id, d:i.photo })),
                 ...APPS.map(a => ({ id:'app:' + a.id,  d:a.photo }))];
    all.forEach(({ id, d }) => {
      if (d) ph.put(dataURLtoBlob(d), id);
      else ph.delete(id);
    });
    // 清理已删条目的图片
    const keys = await new Promise(res => {
      const r = ph.getAllKeys();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => res([]);
    });
    const alive = new Set(all.filter(x => x.d).map(x => x.id));
    keys.forEach(k => { if (!alive.has(k)) ph.delete(k); });
  } catch (e) {
    console.warn('保存失败', e);
  }
}

/* 防抖保存：连续改动只写一次 */
function saveSoon(){
  if (!db || suppressSave) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}

/* 页面隐藏/关闭时立刻落盘，避免防抖窗口内丢改动 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && db && !suppressSave){
    clearTimeout(saveTimer);
    saveNow();
  }
});
window.addEventListener('pagehide', () => {
  if (db && !suppressSave){ clearTimeout(saveTimer); saveNow(); }
});

function dataURLtoBlob(dataURL){
  try {
    const [head, body] = dataURL.split(',');
    const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
    const bin = atob(body);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  } catch (e){ return null; }
}

function blobToDataURL(blob){
  return new Promise(resolve => {
    if (!blob) return resolve(null);
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => resolve(null);
    fr.readAsDataURL(blob);
  });
}

/* 启动时读库 */
async function loadFromDB(){
  db = await openDB();
  if (!db){ dbReady = false; return false; }
  dbReady = true;
  try {
    const tx = db.transaction(['kv', 'photos'], 'readonly');
    const kv = tx.objectStore('kv');
    const ph = tx.objectStore('photos');
    const state = await new Promise(res => {
      const r = kv.get('state');
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
    if (!state) return false;   // 首次使用 → 保留种子数据

    // 恢复图片
    const getPhoto = id => new Promise(res => {
      const r = ph.get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });

    suppressSave = true;

    CATS     = (state.cats || CATS).map(c => ({ ...c }));
    APP_CATS = (state.appCats || APP_CATS).map(c => ({ ...c }));
    GOAL_TOTAL = (state.goals && state.goals.total) || 0;
    GOAL_APPS  = (state.goals && state.goals.apps) || 0;
    if (typeof state.accentId === 'string') accentId = state.accentId;
    if (typeof state.photoStyle === 'number') photoStyle = state.photoStyle;
    if (typeof state.lastSnapAt === 'number') lastSnapAt = state.lastSnapAt;
    if (Array.isArray(state.snapshots) && state.snapshots.length) SNAPSHOTS = state.snapshots;

    ITEMS = (state.items || []).map(i => ({ ...i, photo: null }));
    APPS  = (state.apps  || []).map(a => ({ ...a, photo: null }));

    // 并发取回图片
    await Promise.all([
      ...ITEMS.map(async i => {
        if (!i.hasPhoto) return;
        const b = await getPhoto('item:' + i.id);
        if (b) i.photo = await blobToDataURL(b);
      }),
      ...APPS.map(async a => {
        if (!a.hasPhoto) return;
        const b = await getPhoto('app:' + a.id);
        if (b) a.photo = await blobToDataURL(b);
      })
    ]);

    suppressSave = false;
    return true;
  } catch (e) {
    console.warn('读取失败', e);
    suppressSave = false;
    return false;
  }
}

/* ================= 每周自动快照 =================
   规则（照 PRD）：每次打开 App 时检查，距上次记录满 7 天才记一条；
   记录的是「持有量」（在用 + 收纳中 + 消耗中，不含待处理）；用户完全无感。 */
function maybeSnapshot(){
  const WEEK = 7 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  if (lastSnapAt && (now - lastSnapAt) < WEEK) return false;

  // 一条都没录时不记，免得曲线起点是 0 看着奇怪
  if (!ITEMS.length && !APPS.length) return false;

  const d = new Date();
  const label = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // 同一天不重复记
  if (SNAPSHOTS.length && SNAPSHOTS[SNAPSHOTS.length - 1].d === label){
    lastSnapAt = now;
    return false;
  }

  const held = sumQty(ITEMS.filter(i => i.st !== 'todo'));
  SNAPSHOTS.push({ d: label, items: held, entries: ITEMS.length, apps: APPS.length });
  if (SNAPSHOTS.length > 60) SNAPSHOTS.shift();   // 最多留 60 条，约一年
  lastSnapAt = now;
  return true;
}

/* 长按卡片 → 进入拖拽排序模式（松手落到新位置） */
(function initCardDrag(){
  const grid = $('#igrid');
  let holdTimer = null, card = null, id = null, started = false;
  let ghost = null, offsetX = 0, offsetY = 0, lastSwapEl = null;
  const tracker = makeVelocityTracker();

  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  // 长按还没触发就被打断（弹面板/切页）→ 清干净，别让 ghost 凭空冒出来
  if (typeof pendingHoldCancels !== 'undefined') pendingHoldCancels.push(function(){
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card){ card.classList.remove('dragging-src'); card = null; }
    id = null; started = false; lastSwapEl = null;
  });

  const begin = (x, y) => {
    // 兜底：卡片已被重绘/移除，或计时器早该被取消 → 绝不凭空造一个 ghost
    if (!card || !card.isConnected) return;
    started = true;
    tracker.reset(x, y);
    const r = card.getBoundingClientRect();
    offsetX = x - r.left;
    offsetY = y - r.top;

    // 做一个跟手的浮层
    ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);

    card.classList.add('dragging-src');
    if (navigator.vibrate) navigator.vibrate(12);
  };
  const move = (x, y) => {
    if (!ghost) return;
    ghost.style.left = (x - offsetX) + 'px';
    ghost.style.top = (y - offsetY) + 'px';

    // 液态形变：跟着拖动速度鼓起来（慢拖几乎看不出，快甩才明显）
    if (tracker){
      const { vx, vy, dt } = tracker.sample(x, y);
      applyLiquidDeform(ghost, vx, vy, dt, true);
    }

    // 找手指下面的那张卡，实时换位
    ghost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    ghost.style.display = '';
    const over = el && el.closest('#igrid .icard[data-item]');
    if (over && over !== card && over !== lastSwapEl){
      lastSwapEl = over;
      const a = ITEMS.find(i => i.id === id);
      const b = ITEMS.find(i => i.id === over.dataset.item);
      if (a && b){
        // 交换 order，并立刻重排 DOM（不整表重绘，避免闪烁）
        const ao = a.order ?? 9999, bo = b.order ?? 9999;
        a.order = bo; b.order = ao;
        const parent = grid;
        const kids = [...parent.children];
        const ai = kids.indexOf(card), bi = kids.indexOf(over);
        if (ai < bi) parent.insertBefore(card, over.nextSibling);
        else parent.insertBefore(card, over);
      }
    }
  };

  const end = () => {
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card){ card.classList.remove('dragging-src'); }
    if (started){
      // 固化顺序：按当前 DOM 顺序重写 order
      const ids = [...grid.querySelectorAll('.icard[data-item]')].map(el => el.dataset.item);
      ids.forEach((iid, n) => { const it = ITEMS.find(x => x.id === iid); if (it) it.order = n; });
      renderItems();
      toast('顺序已保存');
      // ★ 拖拽已经发生 → 抑制紧随其后的 click，避免误触展开编辑
      suppressCardClickUntil = Date.now() + 400;
    }
    card = null; id = null; started = false; lastSwapEl = null;
  };

  const onStart = (x, y, target) => {
    card = target.closest('#igrid .icard[data-item]');
    if (!card) return;
    if (target.closest('input,button,.lk,.st,.use')){ card = null; return; }
    id = card.dataset.item;
    clearHold();
    holdTimer = setTimeout(() => begin(x, y), 420);   // 按住 0.42 秒才进入拖拽
  };

  grid.addEventListener('touchstart', e => {
    const t = e.touches[0]; onStart(t.clientX, t.clientY, e.target);
  }, { passive: true });
  grid.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (started){ if (e.cancelable) e.preventDefault(); move(t.clientX, t.clientY); }
    else clearHold();
  }, { passive: false });
  grid.addEventListener('touchend', end);
  grid.addEventListener('touchcancel', end);

  grid.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => { if (started) move(e.clientX, e.clientY); });
  // ★ 松手无条件收尾：即使没进入拖拽，也要清掉长按计时器，
  //   否则"点一下卡片"之后计时器仍会触发，凭空冒出一个跟手浮层
  window.addEventListener('mouseup', end);
})();

/* 软件列表：同样的长按拖拽排序（行是上下排列的） */
(function initAppDrag(){
  const list = $('#alist');
  let holdTimer = null, row = null, started = false;
  let ghost = null, offsetX = 0, offsetY = 0;
  const tracker = makeVelocityTracker();

  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  // 长按还没触发就被打断（弹面板/切页）→ 清干净，别让 ghost 凭空冒出来
  if (typeof pendingHoldCancels !== 'undefined') pendingHoldCancels.push(function(){
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (row){ row.classList.remove('dragging-src'); row = null; }
    started = false;
  });

  const begin = (x, y) => {
    // 兜底：行已被重绘/移除，或计时器早该被取消 → 绝不凭空造一个 ghost
    if (!row || !row.isConnected) return;
    started = true;
    tracker.reset(x, y);
    const r = row.getBoundingClientRect();
    offsetX = x - r.left;
    offsetY = y - r.top;
    ghost = row.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    row.classList.add('dragging-src');
    if (navigator.vibrate) navigator.vibrate(12);
  };

  const move = (x, y) => {
    if (!ghost) return;
    ghost.style.left = (x - offsetX) + 'px';
    ghost.style.top = (y - offsetY) + 'px';
    // 液态形变
    const { vx, vy, dt } = tracker.sample(x, y);
    applyLiquidDeform(ghost, vx, vy, dt, true);
    ghost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    ghost.style.display = '';
    const over = el && el.closest('#alist .arow[data-app]');
    if (over && over !== row){
      const kids = [...list.children];
      if (kids.indexOf(row) < kids.indexOf(over)) list.insertBefore(row, over.nextSibling);
      else list.insertBefore(row, over);
    }
  };

  const end = () => {
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (row) row.classList.remove('dragging-src');
    if (started){
      const ids = [...list.querySelectorAll('.arow[data-app]')].map(el => el.dataset.app);
      ids.forEach((aid, n) => { const a = APPS.find(x => x.id === aid); if (a) a.order = n; });
      renderApps();
      toast('顺序已保存');
      suppressCardClickUntil = Date.now() + 400;
    }
    row = null; started = false;
  };

  const onStart = (x, y, target) => {
    row = target.closest('#alist .arow[data-app]');
    if (!row) return;
    if (target.closest('input,button,.need')){ row = null; return; }
    clearHold();
    holdTimer = setTimeout(() => begin(x, y), 420);
  };

  list.addEventListener('touchstart', e => {
    const t = e.touches[0]; onStart(t.clientX, t.clientY, e.target);
  }, { passive: true });
  list.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (started){ if (e.cancelable) e.preventDefault(); move(t.clientX, t.clientY); }
    else clearHold();
  }, { passive: false });
  list.addEventListener('touchend', end);
  list.addEventListener('touchcancel', end);
  list.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => { if (started) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);
})();

/* ---------- 液态形变：拖动中的卡片跟着速度「鼓起来」 ----------
   规范（motion-effects 的 fx2）：慢拖几乎不变形、快甩才明显；
   速度消失形变就消失；静止时精确等于原圆角矩形。 */
const BULGE_MAX = 9;          // 最大鼓出量（约卡宽 4%）
const DEFORM_K   = 0.0011;    // 速度 → 形变强度
const DEFORM_CAP = 0.75;      // 形变上限

function applyLiquidDeform(el, vx, vy, dt, dragging){
  if (!el) return;
  const speed = Math.hypot(vx, vy);
  const target = Math.min(speed * DEFORM_K, DEFORM_CAP);
  // 拖动中衰减慢、停手衰减快 —— 手指一停形变立刻收
  el.__deform = el.__deform || { s:0 };
  const decay = dragging ? Math.exp(-5 * dt) : Math.exp(-14 * dt);
  // 目标值参与，但用较快的衰减把「已积累」的部分释放掉
  el.__deform.s = el.__deform.s * decay + (target - el.__deform.s) * (1 - decay);
  const s = el.__deform.s;
  if (s < 0.004 && !dragging){ el.style.borderRadius = ''; el.style.transform = el.__baseTransform || ''; return; }
  // 鼓出量按运动方向加权：朝着运动方向那侧多鼓一点
  const bx = Math.abs(vx) > Math.abs(vy) ? BULGE_MAX * s * 1.5 : BULGE_MAX * s;
  const by = Math.abs(vy) > Math.abs(vx) ? BULGE_MAX * s * 1.5 : BULGE_MAX * s;
  el.style.borderRadius = `${18 + bx}px ${18 + by}px ${18 + by}px ${18 + bx}px / ${18 + by}px ${18 + bx}px ${18 + bx}px ${18 + by}px`;
  el.style.transform = `${el.__baseTransform || ''} scale(${1 + s * 0.02}, ${1 + s * 0.02})`;
}

/* 拖动速度追踪：喂给液态形变用 */
function makeVelocityTracker(){
  let lastX = 0, lastY = 0, lastT = 0, vx = 0, vy = 0;
  return {
    reset(x, y){ lastX = x; lastY = y; lastT = performance.now(); vx = 0; vy = 0; },
    sample(x, y){
      const now = performance.now();
      const dt = Math.max(0.001, (now - lastT) / 1000);
      vx = (x - lastX) / dt;
      vy = (y - lastY) / dt;
      lastX = x; lastY = y; lastT = now;
      return { vx, vy, dt };
    },
    get vx(){ return vx; },
    get vy(){ return vy; }
  };
}

// 底部 Tab
function activateTab(t){

  else showTab('home');

/* 拖动切换：按住胶囊左右滑，松手落在哪个 Tab 就切到哪个 */
(function initTabDrag(){
  const bar = $('#tabbar');
  const ind = $('#tabInd');
  const tabs = $$('.tb');
  let dragging = false, moved = false, startX = 0, startY = 0;

  const idxFromX = clientX => {
    let best = 0, bestDist = Infinity;
    tabs.forEach((b, i) => {
      const r = b.getBoundingClientRect();
      const d = Math.abs(clientX - (r.left + r.width / 2));
      if (d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  };

  // 手指位置 → 指示块跟手平移（滑动过程中不切页面，只挪块）
  const moveIndTo = i => {
    const r = tabs[i].getBoundingClientRect();
    const br = bar.getBoundingClientRect();
    ind.style.transition = 'none';
    ind.style.width = r.width + 'px';
    ind.style.transform = `translateX(${r.left - br.left - 5}px)`;
  };

  const onDown = e => {
    const pt = e.touches ? e.touches[0] : e;
    dragging = true; moved = false;
    startX = pt.clientX; startY = pt.clientY;
    bar.style.touchAction = 'none';          // 关键：告诉浏览器这里不要滚页面
  };

  const onMove = e => {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    if (!moved){
      // 横向位移明显大于纵向才认定是滑动（避免误伤纵向滚动）
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) moved = true;
      else if (Math.abs(dy) > 12){ dragging = false; bar.style.touchAction = ''; return; }
    }
    if (!moved) return;
    if (e.cancelable) e.preventDefault();
    moveIndTo(idxFromX(pt.clientX));
  };

  const onUp = e => {
    if (!dragging) return;
    dragging = false;
    bar.style.touchAction = '';
    if (!moved){ syncTabInd(); return; }     // 没滑动 → 恢复并交给 click
    const pt = e.changedTouches ? e.changedTouches[0] : e;
    const i = idxFromX(pt.clientX);
    ind.style.transition = '';               // 恢复过渡动画
    activateTab(tabs[i].dataset.tab);
    // 阻止随后的 click 重复触发
    const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
    bar.addEventListener('click', swallow, { capture: true, once: true });
    setTimeout(() => bar.removeEventListener('click', swallow, { capture: true }), 80);
  };

  bar.addEventListener('touchstart', onDown, { passive: true });
  bar.addEventListener('touchmove', onMove, { passive: false });
  bar.addEventListener('touchend', onUp);
  bar.addEventListener('touchcancel', onUp);
  bar.addEventListener('mousedown', e => { onDown(e); });
  window.addEventListener('mousemove', e => { if (dragging) onMove(e); });
  window.addEventListener('mouseup', e => { if (dragging) onUp(e); });

  // 尺寸/字体变化后重新对齐
  window.addEventListener('resize', () => syncTabInd());
  window.addEventListener('orientationchange', () => setTimeout(() => syncTabInd(), 200));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncTabInd());
  window.addEventListener('load', () => syncTabInd());
  requestAnimationFrame(() => syncTabInd());
  setTimeout(() => syncTabInd(), 120);
  setTimeout(() => syncTabInd(), 500);
})();

/* ================= 初始化 ================= */
function renderAll(){
  applyAccent(accentId);
  renderHome();
  renderCatChips();
  renderSeasonChips();
  renderItems();
  renderApps();
  // 新渲染出来的按钮也要有按压反馈
  bindPressFeedback();
}

async function boot(){
  // 先立刻渲染，保证界面马上可用（不阻塞在数据库上）
  try {
    renderAll();
    showTab('home');
    syncTabInd();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncTabInd());
  } catch (e) {
    // 渲染失败也不能让页面空着：把错误显示出来便于排查
    console.error('[极简] 首次渲染失败', e);
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#fff;border:2px solid #c33f5c;border-radius:10px;padding:10px;font:12px/1.5 monospace;white-space:pre-wrap">渲染出错：' + (e && e.message) + '</div>');
    return;
  }

  // 再异步读库；读完如果有数据就重绘一次
  try {
    const had = await loadFromDB();
    suppressSave = false;
    if (had){
      renderAll();
      syncTabInd();
      console.log('[极简] 已从本地存储恢复', ITEMS.length, '条物品 /', APPS.length, '个软件');
    } else {
      console.log(dbReady ? '[极简] 首次使用' : '[极简] 当前环境不支持本地存储，改动不会保存');
    }
  } catch (e) {
    suppressSave = false;
    console.warn('[极简] 读取本地数据失败，使用当前数据', e);
  }
}
boot();

/* ================= Service Worker（离线可用） ================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(
      reg => console.log('[极简] 离线缓存已就绪', reg.scope),
      err => console.warn('[极简] 离线缓存注册失败', err)
    );
  });
}
