<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdfaf1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="极简">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>极简</title>
<style>
@font-face{font-family:'ZCOOLKuaiLe';src:url('./fonts/zcoolkuaile.woff2') format('woff2');font-display:swap}
@font-face{font-family:'ZCOOLQingKe';src:url('./fonts/zcoolqingke.woff2') format('woff2');font-display:swap}
@font-face{font-family:'MaShanZheng';src:url('./fonts/mashanzheng.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Kalam';src:url('./fonts/kalam700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'PatrickHand';src:url('./fonts/patrickhand.woff2') format('woff2');font-display:swap}

:root{
  --paper:#ecebe4;
  --screen:#fdfaf1;
  --ink:#16171b;
  --ink2:#3b3d45;
  --sub:#8b8c94;
  --accent:#c9e8cf;          /* 主色：浅绿（涂笔、按钮、加号） */
  --accent-deep:#6fa87d;     /* 主色加深：角标、通知点 */
  --hl:rgba(201,232,207,.92);      /* 荧光笔高亮块 / 胶带 */
  --hl-soft:rgba(201,232,207,.85); /* 更淡一层，用于说明条 */
  --blue:#c9e8cf;
  --blue-deep:#7fb08a;       /* 蓝绿互换后：原 --blue-deep 位 → 绿 */
  --green:#7fb0d4;           /* 蓝绿互换后：原 --green 位 → 蓝（进度条达标/接近用） */
  --warn:#d9861f;
  --hr:2.3px;
  --f-cn:'ZCOOLKuaiLe','MaShanZheng',sans-serif;
  --f-num:'Kalam','PatrickHand',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* 禁止双指捏合缩放（加进主屏后捏小会露出白边，看着像网页）。
   viewport 的 user-scalable=no 在 iOS 上会被忽略，touch-action 才管用；
   双击放大也用这条压掉（别用 touchend preventDefault，会吃掉 click）。 */
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
/* iOS 在字号 <16px 的输入框聚焦时会自动放大整个页面，且退出后不会还原。
   所有输入类元素字号一律 ≥16px，彻底避免这个问题。 */
input,textarea,select{font-size:16px !important}
body{
  position:relative;background:var(--screen);color:var(--ink);
  font-family:'PatrickHand','ZCOOLKuaiLe',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;
  overflow:hidden;
  background-image:radial-gradient(circle, rgba(22,23,27,.075) 1px, transparent 1px);
  background-size:16px 16px;
}
.wrap{position:relative;z-index:1;width:100%;height:100%}
.stage{width:100%;height:100%}

/* 真机全屏：手机上直接铺满，桌面上才画一个手机框便于预览 */
.phone{position:relative;width:100%;height:100%;background:var(--screen);overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  /* 底部留白写死 104px，不叠加 env(safe-area-inset-bottom)：
     加到主屏后可视区已铺满整屏（含 Home Indicator 段），
     再按 safe-area 补一次等于留两遍，底部会空出一条。 */
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 104px;
  scrollbar-width:none;display:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
/* ===== 页面过渡 · 横向推移（Tab 之间用，像翻页） =====
   用 keyframes 而不是 transition：动画万一不执行，元素本身也是可见的（失败安全）。 */
.screen.on.slide-r{animation:slideFromRight .3s cubic-bezier(.22,1,.36,1) both}
.screen.on.slide-l{animation:slideFromLeft  .3s cubic-bezier(.22,1,.36,1) both}
@keyframes slideFromRight{
  from{opacity:0;transform:translateX(24%)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideFromLeft{
  from{opacity:0;transform:translateX(-24%)}
  to{opacity:1;transform:translateX(0)}
}

/* ===== 次级页面（设置）· 手势转场，「推拉门」结构 =====
   上级页面留在原地（轻微缩到 .97 制造层次），次级页是一扇门从右侧推上来覆盖它。
   拖动位移直接 = 进度；松手以「拖过页宽 55%」为唯一完成判据。 */
.screen.overlay{display:none;z-index:20;background:var(--screen);
  box-shadow:-8px 0 24px rgba(22,23,27,.18);
  will-change:transform}
.screen.overlay.on{display:block}
/* 被覆盖的上级页面：轻微缩小表示"被压在下面"，指针事件关掉避免误点 */
.phone.covered > .screen:not(.overlay){transform:scale(.97);filter:brightness(.94);
  transition:transform .3s ease,filter .3s ease;pointer-events:none}
.phone.covered > .screen.overlay{transform:none;filter:none;pointer-events:auto}
/* 拖动中不要过渡，否则不跟手 */
.phone.dragging-overlay > .screen:not(.overlay),
.phone.dragging-overlay > .screen.overlay{transition:none}

/* 桌面预览：给个手机框，方便电脑上看 */
@media (min-width: 620px){
  body{
    background:#ecebe4;
    background-image:radial-gradient(circle, rgba(22,23,27,.075) 1px, transparent 1px);
    background-size:16px 16px;
    overflow:auto;padding:40px 20px;
  }
  .wrap{max-width:760px;margin:0 auto;height:auto}
  .stage{display:flex;justify-content:center}
  .phone{width:378px;height:812px;border-radius:42px;border:2.8px solid var(--ink);
    box-shadow:7px 9px 0 rgba(22,23,27,.13);flex:0 0 auto}
  .screen{padding:22px 20px 104px}
  /* 桌面预览时安全区为 0，位置固定即可 */
  .tabbar{bottom:17px}
  .fab{right:22px;bottom:96px}
  .toast{bottom:104px}
}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.topbar .grp{display:flex;gap:10px;align-items:center}
.avatar{width:46px;height:46px;display:grid;place-items:center;background:var(--accent);
  border:2.3px solid var(--ink);font-family:var(--f-cn);font-size:19px;
  border-radius:50% 46% 52% 48%/48% 52% 46% 50%;transform:rotate(-3deg);box-shadow:2px 3px 0 rgba(22,23,27,.15)}
.circ{width:45px;height:45px;background:#fff;border:2.3px solid var(--ink);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;position:relative;flex:0 0 auto;
  box-shadow:2px 3px 0 rgba(22,23,27,.14)}
.circ svg{width:20px;height:20px}
.circ .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--accent-deep);border:1.5px solid var(--ink)}
.c1{border-radius:50% 44% 50% 46%/46% 50% 44% 50%}
.c2{border-radius:45% 50% 46% 50%/50% 46% 50% 45%}
.back{width:45px;height:45px;background:#fff;border:2.3px solid var(--ink);display:grid;place-items:center;
  cursor:pointer;box-shadow:2px 3px 0 rgba(22,23,27,.14);border-radius:46% 50% 44% 50%/50% 44% 50% 46%}
.back svg{width:20px;height:20px}

/* 主卡 */
.hero{position:relative;margin-bottom:19px;transform:rotate(-.7deg)}
.hero svg{display:block;width:100%;height:auto}
.hero .over{position:absolute;inset:0;padding:14px 19px 13px;display:flex;flex-direction:column;justify-content:space-between}
.hero .ttl{font-family:var(--f-cn);font-size:21px;line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.42)}
.hero .mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
.hero .split{font-size:13px;line-height:1.6;opacity:.85;font-family:'PatrickHand',sans-serif;text-shadow:0 1px 0 rgba(255,255,255,.38)}
.hero .big{font-family:var(--f-num);font-weight:700;font-size:52px;line-height:.84;text-shadow:0 1px 0 rgba(255,255,255,.42)}
.hero .foot{display:flex;justify-content:space-between;font-size:13.5px;font-family:'PatrickHand',sans-serif;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tape{position:absolute;width:74px;height:25px;z-index:5;opacity:.8;box-shadow:0 1px 4px rgba(22,23,27,.13);
  clip-path:polygon(0 3%,4% 0,96% 2%,100% 0,99% 96%,95% 100%,5% 98%,1% 100%)}
.tape.p{background:var(--hl)}
.tape.b{background:rgba(214,205,238,.88)}

/* 区块标题 */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 11px}
.sec-head b{position:relative;display:inline-block;font-family:var(--f-cn);font-size:18px;font-weight:400}
.sec-head b::after{content:'';position:absolute;left:-6px;right:-7px;bottom:2px;height:10px;z-index:-1;
  background:var(--hl);border-radius:3px 10px 4px 11px;transform:rotate(-.8deg)}
.sec-head a{font-size:13px;color:var(--sub);text-decoration:none;font-family:'PatrickHand',sans-serif;cursor:pointer}

/* 目标卡 */
.goal{background:#fff;border:var(--hr) solid var(--ink);border-radius:20px;
  box-shadow:5px 6px 0 rgba(22,23,27,.15);padding:13px 17px 14px;transform:rotate(-.4deg)}
.goal .r1{display:flex;align-items:flex-end;justify-content:space-between}
.goal .big{display:flex;align-items:baseline;gap:5px}
.goal .big .n{font-family:var(--f-num);font-weight:700;font-size:43px;line-height:.85}
.goal .big .of{font-size:18px;color:var(--sub);font-family:var(--f-num);font-weight:700}
.tag{font-size:12.5px;padding:4px 10px;border:2px solid var(--ink);
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;background:rgba(91,152,200,.22);
  color:#3d6f9e;transform:rotate(-1.6deg);display:inline-block;font-family:var(--f-cn)}
.gbar{margin:11px 0 8px}
.gbar svg{display:block;width:100%;height:auto}
.hint{font-size:13px;color:var(--sub)}

/* 快捷入口 */
.quick{display:flex;justify-content:space-between;gap:6px;margin:16px 0 18px}
.qa{flex:1;border:none;background:none;font-family:var(--f-cn);font-size:12.5px;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0;line-height:1.25}
.qa .ic{width:48px;height:48px;display:grid;place-items:center;background:#fff;border:2.3px solid var(--ink);
  border-radius:16px 6px 17px 7px/7px 17px 6px 16px;box-shadow:2px 3px 0 rgba(22,23,27,.14)}
.qa .ic svg{width:21px;height:21px}
.qa .ic.hot{background:var(--accent)}
.qa:nth-child(odd) .ic{transform:rotate(-2.2deg)}
.qa:nth-child(even) .ic{transform:rotate(2.2deg)}

/* 分类网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cat{background:#fff;border:var(--hr) solid var(--ink);border-radius:15px;
  box-shadow:4px 5px 0 rgba(22,23,27,.15);padding:11px 13px 12px;cursor:pointer;
  transform:rotate(-.55deg);transition:transform .12s,box-shadow .12s}
.cat:nth-child(even){transform:rotate(.6deg)}
.cat:active{transform:translate(2px,3px) rotate(0deg);box-shadow:1px 2px 0 rgba(22,23,27,.15)}
.cat .ct{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.cat .ct .dot{width:11px;height:11px;border-radius:50% 44% 52% 46%;border:1.7px solid var(--ink)}
.cat .ct span{font-size:14.5px;font-family:var(--f-cn)}
.cat .ct .arw{margin-left:auto;font-size:12px;color:var(--sub);font-family:'PatrickHand',sans-serif}
.cat .cn{display:flex;align-items:baseline;gap:4px;margin-bottom:7px}
.cat .cn .n{font-family:var(--f-num);font-weight:700;font-size:31px;line-height:.85}
.cat .cn small{font-size:12px;color:var(--sub)}
.cat .cg{font-size:11.5px;color:var(--sub);margin-top:6px}
.cat .cg.over{color:#b8700f}
.mbar{height:8px;position:relative}
.mbar .tr{position:absolute;inset:0;border:1.9px solid var(--ink);border-radius:5px 2px 6px 3px/3px 6px 2px 5px;background:rgba(22,23,27,.05)}
.mbar .fl{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px 2px 5px 2px/2px 5px 2px 4px}
.cat.add{border-style:dashed;background:rgba(255,255,255,.6);box-shadow:3px 4px 0 rgba(22,23,27,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:112px;text-align:center}
.cat.add svg{width:26px;height:26px}
.cat.add span{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2)}
.cat.add small{font-size:11px;color:var(--sub)}

/* 物品列表页 */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-head h2{margin:0;font-family:var(--f-cn);font-size:23px;font-weight:400}
.page-head .cnt{font-size:12.5px;color:var(--sub);font-family:'PatrickHand',sans-serif}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:2.2px solid var(--ink);
  border-radius:15px 6px 16px 7px/7px 16px 6px 15px;padding:10px 13px;margin-bottom:13px;
  box-shadow:3px 4px 0 rgba(22,23,27,.12)}
.search svg{width:17px;height:17px;flex:0 0 auto;color:var(--sub)}
.search input{border:none;outline:none;background:none;font-family:'PatrickHand',sans-serif;
  font-size:14px;width:100%;color:var(--ink)}
.search input::placeholder{color:#a9aab2}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2.1px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:13px;padding:6px 13px;cursor:pointer;color:var(--ink2);
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px;box-shadow:2px 2px 0 rgba(22,23,27,.12);
  transition:background .12s,transform .1s}
.chip.on{background:var(--accent);color:var(--ink);transform:rotate(-1.2deg);box-shadow:2px 3px 0 rgba(22,23,27,.18)}
.chip:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(22,23,27,.12)}
.chip .n{font-family:'PatrickHand',sans-serif;font-size:11.5px;opacity:.62;margin-left:3px}
.chips.small .chip{font-size:12px;padding:5px 11px}
.chip.plus{border-style:dashed;color:var(--sub);background:rgba(255,255,255,.55)}
.chipRow{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.chipRow .lb{font-family:var(--f-cn);font-size:11.5px;color:var(--sub);flex:0 0 auto;width:26px}
.chipRow .chips{flex:1;padding-bottom:7px}
.count-row{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 11px}
.count-row b{font-family:var(--f-cn);font-size:14.5px;font-weight:400}
.count-row span{font-size:12.5px;color:var(--sub);font-family:'PatrickHand',sans-serif}

.igrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.icard{background:#fff;border:2.2px solid var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:4px 5px 0 rgba(22,23,27,.14);transition:transform .12s,box-shadow .12s;position:relative}
.icard:nth-child(odd){transform:rotate(-.5deg)}
.icard:nth-child(even){transform:rotate(.5deg)}
.icard .ph{position:relative;aspect-ratio:1/1;display:grid;place-items:center;
  border-bottom:2.2px solid var(--ink);cursor:pointer;overflow:hidden}
.icard .ph svg{width:52%;height:52%;color:var(--ink);opacity:.82}
.icard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.icard .ph .addph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-family:var(--f-cn);font-size:11px;color:var(--ink2);opacity:.72}
.icard .ph .addph svg{width:22px;height:22px;opacity:.8}
.icard .ph .qty{position:absolute;bottom:7px;right:7px;font-family:var(--f-num);font-weight:700;font-size:14px;
  background:#fff;border:1.9px solid var(--ink);border-radius:9px 3px 10px 4px/4px 10px 3px 9px;padding:1px 7px;z-index:3}
.icard .ph .lk{position:absolute;top:7px;right:7px;width:23px;height:23px;z-index:3;cursor:pointer;
  display:grid;place-items:center;transition:transform .12s;background:none;border:none;padding:0}
.icard .ph .lk:active{transform:scale(.86)}
.icard .ph .lk::after{content:'';position:absolute;inset:-8px}
/* <use> 影子树里外部类选择器无效，只能用继承属性：fill / stroke / stroke-width 写在外层 svg 上 */
.icard .ph .lk svg{width:23px;height:23px;overflow:visible;
  fill:var(--lkc,#fff);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;
  paint-order:stroke fill}
.icard .ph .st{position:absolute;bottom:7px;left:7px;font-family:var(--f-cn);font-size:10.5px;
  background:rgba(255,255,255,.95);border:1.8px solid var(--ink);border-radius:8px 3px 9px 4px/4px 9px 3px 8px;
  padding:1px 7px;cursor:pointer;z-index:3;transition:transform .12s}
.icard .ph .st:active{transform:translate(1px,1px)}
.icard .ph .st::after{content:'';position:absolute;inset:-7px}
/* 归类小菜单（浮在卡片上） */
.pop{position:absolute;z-index:40;background:var(--screen);border:2.4px solid var(--ink);
  border-radius:14px 6px 15px 7px/7px 15px 6px 14px;box-shadow:5px 6px 0 rgba(22,23,27,.22);
  padding:7px;display:none;min-width:112px}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
  font-family:var(--f-cn);font-size:13px;border-radius:10px 4px 11px 5px/5px 11px 4px 10px;white-space:nowrap}
.pop .pi:active{background:rgba(22,23,27,.07)}
.pop .pi.sel{background:rgba(22,23,27,.075)}
.pop .pi .mk{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center}
.pop .pi .mk svg{width:18px;height:18px;overflow:visible;
  fill:var(--lkc,#fff);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;paint-order:stroke fill}
.pop .pi .ck{margin-left:auto;font-family:'PatrickHand',sans-serif;font-size:13px;color:var(--ink2)}
.icard .meta{padding:8px 9px 9px}
/* 收起态：名称 + 位置并排，紧凑 */
.icard .meta .row-name{display:flex;align-items:center;gap:6px}
.icard .nm-txt{font-family:var(--f-cn);font-size:14px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.icard .loc-txt{font-size:11.5px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.icard .loc-txt:empty{display:none}
/* 购入日期角标（图片左上角） */
.icard .ph .buy{position:absolute;top:7px;left:7px;font-family:'PatrickHand',sans-serif;
  font-size:10.5px;background:rgba(255,255,255,.94);border:1.7px solid var(--ink);
  border-radius:8px 3px 9px 4px/4px 9px 3px 8px;padding:1px 6px;z-index:3}
/* 展开态相关样式已移除：物品卡的编辑改为从卡片形变长出的面板 */
.icard .nm-in,.icard .loc-in,.icard .date-in,.icard .del-btn,.icard .expand{display:none}
.icard .nm-in{width:100%;border:none;background:transparent;padding:2px 0;
  font-family:var(--f-cn);font-size:13.5px;color:var(--ink);outline:none;
  border-bottom:1.6px dashed transparent;transition:border-color .15s}
.icard .nm-in:focus{border-bottom-color:var(--ink)}
.icard .nm-in::placeholder{color:#b5b6bd}
.icard .date-row{display:flex;align-items:center;gap:6px}
/* 使用次数按钮 */
/* 使用次数按钮：钉在卡片最右侧（位置为空时也不会跑到名称旁边） */
.icard .row-name .use-btn{margin-left:auto}
.icard .use-btn{width:26px;height:26px;flex:0 0 auto;border-radius:50% 46% 52% 48%;
  background:var(--accent);border:1.9px solid var(--ink);display:grid;place-items:center;
  cursor:pointer;box-shadow:1px 2px 0 rgba(22,23,27,.14);transition:transform .12s}
.icard .use-btn svg{width:14px;height:14px}
.icard .use-btn:active{transform:scale(.86)}
.icard .use-btn.bump{animation:useBump .45s}
@keyframes useBump{
  0%{transform:scale(1)} 35%{transform:scale(1.28)} 65%{transform:scale(.94)} 100%{transform:scale(1)}
}
/* 删除按钮 */
.icard .del-btn{width:22px;height:22px;flex:0 0 auto;border-radius:50% 46% 52% 48%;
  background:#fff;border:1.8px solid var(--ink);display:grid;place-items:center;cursor:pointer}
.icard .del-btn svg{width:11px;height:11px}
.icard .del-btn:active{background:#f3c9d8}
/* 拖拽排序 */
.icard.dragging-src{opacity:.3}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.94;
  transform:rotate(-1.4deg) scale(1.04);border:2.4px solid var(--ink);border-radius:14px;
  background:#fff;overflow:hidden;box-shadow:8px 12px 24px rgba(22,23,27,.28)}
.icard.held{transform:scale(.97);box-shadow:0 0 0 2.4px var(--accent)}
/* 位置 / 日期 */
.icard .loc-in,.icard .date-in{flex:1;min-width:0;border:none;background:transparent;padding:1px 0;
  font-size:11.5px;color:var(--sub);outline:none;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;
  border-bottom:1.6px dashed transparent;transition:border-color .15s}
.icard .loc-in:focus,.icard .date-in:focus{border-bottom-color:var(--ink);color:var(--ink)}
.icard .loc-in::placeholder{color:#c2c3c9}
.icard .date-in{color:#8b8c94}
.icard .ph .use{position:absolute;right:7px;bottom:7px;font-family:var(--f-cn);font-size:10px;
  background:rgba(255,255,255,.94);border:1.7px solid var(--ink);
  border-radius:8px 3px 9px 4px/4px 9px 3px 8px;padding:1px 6px;z-index:3}
.icard.todo .ph{filter:saturate(.35)}
.icard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:180px;border-style:dashed;background:rgba(255,255,255,.6);
  box-shadow:3px 4px 0 rgba(22,23,27,.1);cursor:pointer}
.icard.add svg{width:30px;height:30px}
.icard.add span{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2)}
.icard.add small{font-size:11px;color:var(--sub)}
.empty{background:#fff;border:2.2px dashed var(--ink);border-radius:16px;padding:26px 18px;text-align:center}
.empty b{display:block;font-family:var(--f-cn);font-size:15px;font-weight:400;margin-bottom:7px}
.empty span{font-size:13px;color:var(--sub)}

/* 悬浮添加（在底栏之上） */
.fab{position:absolute;right:20px;width:56px;height:56px;background:var(--accent);
  bottom:96px;
  border:2.4px solid var(--ink);display:none;place-items:center;cursor:pointer;z-index:12;
  border-radius:50% 46% 52% 48%/48% 52% 46% 50%;box-shadow:3px 4px 0 rgba(22,23,27,.2)}
.fab svg{width:24px;height:24px}
.fab:active{transform:translate(2px,3px);box-shadow:1px 2px 0 rgba(22,23,27,.2)}

/* ===== 底部 Tab：胶囊容器 + 滑动选中块 ===== */
.tabbar{position:absolute;left:15px;right:15px;z-index:14;
  /* 距屏幕底写死 17px，不叠加 safe-area（理由同 .screen） */
  bottom:17px;
  background:rgba(253,250,241,.98);border:2.6px solid var(--ink);
  border-radius:999px;box-shadow:4px 5px 0 rgba(22,23,27,.17);
  padding:5px;display:flex;gap:3px;transform:rotate(-.35deg);
  touch-action:none;user-select:none;-webkit-user-select:none}
/* 滑动指示块：跟着选中项平移 */
.tab-ind{position:absolute;top:5px;bottom:5px;left:5px;width:60px;border-radius:999px;
  background:var(--ink);z-index:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.4,.5,1),width .3s cubic-bezier(.34,1.4,.5,1)}
.tabbar.dragging .tab-ind{transition:none}
.tb{flex:1;border:none;background:none;font-family:var(--f-cn);font-size:11px;color:var(--sub);
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  padding:10px 2px;border-radius:999px;position:relative;z-index:1;
  transition:color .2s}
.tb svg{width:17px;height:17px;color:var(--ink2);opacity:.6;flex:0 0 auto;transition:color .2s,opacity .2s}
.tb.on{color:#fdfaf1}
.tb.on svg{color:#fdfaf1;opacity:1}
.tb .badge{min-width:15px;height:15px;padding:0 4px;background:var(--accent-deep);color:#fff;
  border:1.5px solid var(--ink);border-radius:8px 3px 9px 4px;font-family:'PatrickHand',sans-serif;
  font-size:10px;line-height:12px;text-align:center;flex:0 0 auto;transition:background .2s,color .2s}
.tb.on .badge{background:var(--accent);color:var(--ink);border-color:#fdfaf1}

/* ===== 弹层 =====
   动画用 @keyframes 而不是 transition：万一动画不执行，元素的基础状态就是可见的，
   不会出现「弹窗卡在全透明、点不出来」这种致命问题。 */
.mask{position:absolute;inset:0;background:rgba(22,23,27,.34);z-index:30;display:none;
  align-items:center;justify-content:center;padding:22px}
.mask.on{display:flex;animation:maskIn .2s ease both}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--screen);border:2.6px solid var(--ink);border-radius:19px;
  box-shadow:6px 7px 0 rgba(22,23,27,.24);padding:17px 17px 15px;width:100%;max-width:296px;
  max-height:88%;overflow-y:auto;scrollbar-width:none;
  transform-origin:50% 100%}
.mask.on .modal{animation:modalIn .34s cubic-bezier(.34,1.36,.5,1) both}
@keyframes modalIn{
  from{transform:scale(.42) translateY(26px);opacity:0}
  to{transform:scale(1) translateY(0);opacity:1}
}
.modal::-webkit-scrollbar{display:none}
.modal h3{margin:0 0 4px;font-family:var(--f-cn);font-size:17.5px;font-weight:400}
.modal .mhint{margin:0 0 14px;font-size:12.5px;color:var(--sub)}
.modal label{display:block;font-family:var(--f-cn);font-size:13px;margin:0 0 6px;color:var(--ink2)}
.modal .fld{margin-bottom:14px}
.modal input[type=text]{width:100%;border:2.1px solid var(--ink);background:#fff;
  border-radius:12px 5px 13px 6px/6px 13px 5px 12px;padding:10px 12px;font-family:'PatrickHand',sans-serif;
  font-size:14.5px;color:var(--ink);outline:none}
.modal input[type=text]::placeholder{color:#a9aab2}
.modal .mrow{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;border:2.2px solid var(--ink);font-family:var(--f-cn);font-size:14px;padding:11px 8px;
  cursor:pointer;border-radius:14px 5px 15px 6px/6px 15px 5px 14px;background:#fff;color:var(--ink);
  box-shadow:2px 3px 0 rgba(22,23,27,.16)}
/* 按下反馈由 JS 弹簧驱动（硬阴影下压），这里只留键盘聚焦与降级 */
.btn:focus-visible{outline:2.2px solid var(--ink);outline-offset:2px}
.btn.pri{background:var(--accent)}
.btn.dan{background:#f3c9d8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border:2.2px solid var(--ink);background:#fff;cursor:pointer;
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px;display:grid;place-items:center;
  box-shadow:2px 2px 0 rgba(22,23,27,.14)}
.stepper button svg{width:15px;height:15px}
.stepper button:active{transform:translate(1px,2px);box-shadow:0 0 0 rgba(0,0,0,0)}
.stepper .v{font-family:var(--f-num);font-weight:700;font-size:24px;min-width:40px;text-align:center}
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:2.1px solid var(--ink);background:#fff;
  padding:10px 13px;cursor:pointer;border-radius:13px 5px 14px 6px/6px 14px 5px 13px;
  box-shadow:2px 3px 0 rgba(22,23,27,.12);font-family:var(--f-cn);font-size:14px}
.opt:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(22,23,27,.12)}
.opt.sel{background:var(--accent)}
.opt .dot{width:12px;height:12px;border-radius:50% 44% 52% 46%;border:1.8px solid var(--ink);flex:0 0 auto}
.opt .sub{margin-left:auto;font-family:'PatrickHand',sans-serif;font-size:11.5px;color:var(--sub)}

/* ===== 软件列表 ===== */
.alist{display:flex;flex-direction:column;gap:9px}
.arow{display:flex;align-items:center;gap:11px;background:#fff;border:2.2px solid var(--ink);
  border-radius:15px 6px 16px 7px/7px 16px 6px 15px;padding:10px 12px;
  box-shadow:3px 4px 0 rgba(22,23,27,.13);position:relative}
.arow:nth-child(odd){transform:rotate(-.35deg)}
.arow:nth-child(even){transform:rotate(.35deg)}

  overflow:hidden;cursor:pointer;position:relative}

.arow .del{width:24px;height:24px;flex:0 0 auto;border-radius:50% 46% 52% 48%;

/* ===== 极简进程页 ===== */

.pg-total{background:#fff;border:2.3px solid var(--ink);border-radius:19px 7px 20px 8px/8px 20px 7px 19px;

/* 分类目标列表 */

.st-sec{background:#fff;border:2.3px solid var(--ink);border-radius:18px 7px 19px 8px/8px 19px 7px 18px;
  box-shadow:4px 5px 0 rgba(22,23,27,.13);padding:4px 15px;margin-bottom:13px}
.st-sec:nth-child(odd){transform:rotate(-.3deg)}

  display:flex;align-items:center;gap:7px}

  border-radius:8px 3px 9px 4px/4px 9px 3px 8px;background:var(--accent);color:var(--ink)}
.st-row{display:flex;align-items:center;gap:11px;padding:12px 0;

/* 购入日期 */
#dtBuyIn{flex:1;min-width:0;border:2.1px solid var(--ink);background:#fff;
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;padding:7px 10px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);outline:none}
.dt-clearbtn{flex:0 0 auto;border:1.9px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:11.5px;padding:6px 11px;cursor:pointer;color:var(--ink2);
  border-radius:10px 4px 11px 5px/5px 11px 4px 10px;box-shadow:2px 2px 0 rgba(22,23,27,.1)}
.dt-clearbtn:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(0,0,0,0)}
.dt-photo .dt-st{position:absolute;bottom:11px;left:11px;font-family:var(--f-cn);font-size:11.5px;
  background:rgba(255,255,255,.95);border:2px solid var(--ink);
  border-radius:9px 3px 10px 4px/4px 10px 3px 9px;padding:2px 9px}
.dt-name{font-family:var(--f-cn);font-size:25px;font-weight:400;margin:0 0 5px;line-height:1.2}
.dt-meta{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.dt-card{background:#fff;border:2.3px solid var(--ink);border-radius:17px 7px 18px 8px/8px 18px 7px 17px;
  box-shadow:4px 5px 0 rgba(22,23,27,.13);padding:13px 15px;margin-bottom:13px}
.dt-qty{display:flex;align-items:center;justify-content:space-between}
.dt-qty .lb{font-family:var(--f-cn);font-size:15px}
.dt-qty .unit{font-size:12.5px;color:var(--sub)}
.dt-block{padding:11px 0;border-bottom:1.7px dashed rgba(22,23,27,.18)}
.dt-block:first-child{padding-top:0}
.dt-block:last-child{border-bottom:none;padding-bottom:0}
.dt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.dt-row .k{font-family:var(--f-cn);font-size:13.5px;color:var(--ink2);flex:0 0 auto}
.dt-row .v{font-size:13.5px;color:var(--sub);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dt-row .v.filled{color:var(--ink)}
.dt-block > .k{display:block;font-family:var(--f-cn);font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.dt-seg{display:flex;gap:5px}
.dt-seg button{flex:1;border:2.1px solid var(--ink);background:#fff;font-family:var(--f-cn);
  font-size:11.5px;padding:8px 1px;cursor:pointer;color:var(--ink2);
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;box-shadow:2px 2px 0 rgba(22,23,27,.1);
  transition:background .12s,transform .1s}
.dt-seg button.on{background:var(--segc,#c9e8cf);color:var(--ink);transform:rotate(-1deg);
  box-shadow:2px 3px 0 rgba(22,23,27,.16)}
.dt-seg button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(22,23,27,.1)}
#dtLocIn{flex:1;min-width:0;border:2.1px solid var(--ink);background:#fff;
  border-radius:11px 4px 12px 5px/5px 12px 4px 11px;padding:7px 10px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);outline:none}
#dtNote{width:100%;min-height:66px;border:2.1px solid var(--ink);background:#fff;
  border-radius:12px 5px 13px 6px/6px 13px 5px 12px;padding:9px 11px;margin-top:2px;
  font-family:'PatrickHand','ZCOOLKuaiLe',sans-serif;font-size:13.5px;color:var(--ink);
  outline:none;resize:vertical;line-height:1.5}
.dt-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.dt-acts .btn{width:100%}
.dt-acts .full{grid-column:1/-1}
.dt-delbtn{width:100%;background:#f3c9d8;margin-top:9px}

/* 轻提示 */
.toast{position:absolute;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:104px;
  background:var(--ink);color:#fdfaf1;font-family:var(--f-cn);font-size:13px;padding:9px 12px 9px 16px;
  border-radius:13px 5px 14px 6px/6px 14px 5px 13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:40;display:flex;align-items:center;gap:11px;
  max-width:330px;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .undo{font-family:var(--f-cn);font-size:12.5px;background:var(--accent);color:var(--ink);
  border:1.7px solid #fdfaf1;border-radius:9px 3px 10px 4px;padding:3px 10px;cursor:pointer;flex:0 0 auto}
.toast .txt{overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-6%" y="-10%" width="112%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-8%" y="-14%" width="116%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="heroPath" d="M17 6 C104 3.5, 236 4.5, 320 7 C329 7.4, 332 12.5, 331.5 20.5 L330.5 129 C330 138, 326 144, 318 144 L18 144.5 C9 144.5, 6.5 138, 6.5 129 L7 20.5 C7.5 11.5, 9 6.4, 17 6 Z"/>
    <g id="dryStrokes">
      <!-- 白色颜料笔触：道数多、粗细与倾角各异，模拟反复涂刷 -->
      <g fill="#ffffff">
        <polygon points="-52,166 -44,166 54,-16 62,-16" opacity=".93"/>
        <polygon points="-24,166 -18,166 78,-16 86,-16" opacity=".82"/>
        <polygon points="4,166 14,166 100,-16 112,-16" opacity=".8"/>
        <polygon points="28,166 44,166 130,-16 150,-16" opacity=".88"/>
        <polygon points="52,166 76,166 158,-16 184,-16" opacity=".95"/>
        <polygon points="80,166 90,166 172,-16 184,-16" opacity=".74"/>
        <polygon points="106,166 118,166 200,-16 214,-16" opacity=".78"/>
        <polygon points="128,166 148,166 226,-16 250,-16" opacity=".9"/>
        <polygon points="148,166 174,166 252,-16 280,-16" opacity=".92"/>
        <polygon points="176,166 186,166 262,-16 274,-16" opacity=".76"/>
        <polygon points="204,166 216,166 296,-16 310,-16" opacity=".8"/>
        <polygon points="226,166 246,166 322,-16 346,-16" opacity=".9"/>
        <polygon points="246,166 272,166 348,-16 376,-16" opacity=".94"/>
        <polygon points="276,166 286,166 360,-16 372,-16" opacity=".75"/>
        <polygon points="302,166 314,166 396,-16 410,-16" opacity=".76"/>
        <polygon points="322,166 342,166 414,-16 438,-16" opacity=".88"/>
        <polygon points="344,166 370,166 448,-16 476,-16" opacity=".9"/>
        <polygon points="374,166 384,166 458,-16 470,-16" opacity=".72"/>
      </g>
      <!-- 干笔拖痕：颜料将尽时的细丝线 -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <line x1="-26" y1="162" x2="46" y2="4" stroke-width="4.5" opacity=".5"/>
        <line x1="8" y1="158" x2="74" y2="8" stroke-width="3.4" opacity=".44"/>
        <line x1="30" y1="164" x2="98" y2="12" stroke-width="3.6" opacity=".42"/>
        <line x1="60" y1="160" x2="122" y2="10" stroke-width="4.2" opacity=".46"/>
        <line x1="86" y1="160" x2="156" y2="6" stroke-width="5" opacity=".48"/>
        <line x1="112" y1="163" x2="176" y2="14" stroke-width="3.2" opacity=".4"/>
        <line x1="132" y1="163" x2="196" y2="16" stroke-width="3.2" opacity=".4"/>
        <line x1="158" y1="159" x2="220" y2="8" stroke-width="4.6" opacity=".47"/>
        <line x1="178" y1="161" x2="248" y2="4" stroke-width="4.8" opacity=".5"/>
        <line x1="204" y1="163" x2="266" y2="14" stroke-width="3.4" opacity=".41"/>
        <line x1="228" y1="164" x2="292" y2="12" stroke-width="3.8" opacity=".42"/>
        <line x1="252" y1="159" x2="314" y2="6" stroke-width="4.4" opacity=".46"/>
        <line x1="274" y1="160" x2="344" y2="6" stroke-width="5.2" opacity=".48"/>
        <line x1="300" y1="163" x2="362" y2="16" stroke-width="3.2" opacity=".4"/>
        <line x1="324" y1="163" x2="388" y2="14" stroke-width="3.4" opacity=".4"/>
        <line x1="348" y1="159" x2="410" y2="8" stroke-width="4.6" opacity=".46"/>
        <line x1="366" y1="161" x2="436" y2="4" stroke-width="4.4" opacity=".46"/>
        <line x1="392" y1="163" x2="452" y2="12" stroke-width="3.6" opacity=".42"/>
      </g>
    </g>
    <g id="ic-tshirt" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M8.6 3.8 5.2 5.9 3.4 9.6l3 1.5 1.6-1.8v9.1h8V9.3l1.6 1.8 3-1.5-1.8-3.7-3.4-2.1a3.2 3.2 0 0 1-5.8 0Z"/>
    </g>
    <g id="ic-long" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M8.8 3.8 4.6 6 2.8 12.4l2.6 1.2 1.4-2.2v8.2h8.4V11.4l1.4 2.2 2.6-1.2L17.4 6l-4.2-2.2a3 3 0 0 1-4.4 0Z"/>
    </g>
    <g id="ic-jacket" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M9 3.6 5 5.8v14.4h14V5.8l-4-2.2-3 3.4-3-3.4Z"/><path d="M12 7v13.2"/>
    </g>
    <g id="ic-shirt" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M9 3.8 5.6 5.6v14.6h12.8V5.6L15 3.8l-3 3.2-3-3.2Z"/><path d="M12 7v13"/>
    </g>
    <g id="ic-pants" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M6.6 3.8h10.8l-.7 16.4h-3.9L12 10.6l-.8 9.6H7.3L6.6 3.8Z"/>
    </g>
    <g id="ic-dress" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M9.4 3.6 7.4 5.4l2.1 4.4-3 10.6h11l-3-10.6 2.1-4.4-2-1.8a2.6 2.6 0 0 1-5.2 0Z"/>
    </g>
    <g id="ic-down" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M8.8 3.8 4.8 6v14.2h14.4V6l-4-2.2a3 3 0 0 1-6.4 0Z"/>
      <path d="M4.8 9.4h14.4M4.8 13.2h14.4M4.8 16.8h14.4"/>
    </g>
    <g id="ic-skirt" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M9.4 4.2 7 5.6l-2 14.2h14l-2-14.2-2.4-1.4a2.6 2.6 0 0 1-5.2 0Z"/>
      <path d="M10.4 8.6 9.6 19M13.6 8.6l.8 10.4"/>
    </g>
    <g id="ic-shoe" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M3.4 15.6c1.6-1 2.4-2.2 2.8-3.6l.6-2.4h3.4l.8 2c.6 1.4 1.8 2 3.6 2.2l4.4.6c1 .2 1.6.8 1.6 1.8v1.4H3.4v-2Z"/>
    </g>
    <g id="ic-bag" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M6.4 8.2h11.2l-1 12.2H7.4L6.4 8.2Z"/><path d="M9.2 8.2V6.4a2.8 2.8 0 0 1 5.6 0v1.8"/>
    </g>
    <g id="ic-phone" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.6 18.4h2.8"/>
    </g>
    <g id="ic-cup" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M6.6 7h10.8l-1 13.2H7.6L6.6 7Z"/><path d="M9.4 4.2h5.2"/>
    </g>
    <g id="ic-bottle" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M10 3.2h4v2.6l1.6 2.1v13.1H8.4V7.9L10 5.8V3.2Z"/><path d="M8.4 12.4h7.2"/>
    </g>
    <g id="ic-lamp" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M8 4.2h8l2 6.4H6l2-6.4Z"/><path d="M12 10.6v8M8.4 20.4h7.2"/>
    </g>
    <g id="ic-box" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M4 8.6 12 4l8 4.6v6.9L12 20l-8-4.5V8.6Z"/><path d="M4 8.6 12 13.2l8-4.6M12 13.2V20"/>
    </g>

    <!-- ===== 喜欢程度标记：手绘形状 =====
         注意：<use> 引用的是影子树，外部 CSS 的类选择器进不去，
         所以这里不写 class，只靠「继承属性」——外层 svg 设 fill/stroke，内部不覆盖。 -->
    <!-- 喜欢：爱心 -->
    <g id="mk-like">
      <path d="M12 20.4c-.4 0-.8-.15-1.1-.42C6.3 15.9 3.4 13.2 3.4 9.9c0-2.6 2-4.6 4.5-4.6 1.6 0 3.1.8 4.1 2.2 1-1.4 2.5-2.2 4.1-2.2 2.5 0 4.5 2 4.5 4.6 0 3.3-2.9 6-7.5 10.1-.3.27-.7.42-1.1.42Z"/>
    </g>
    <!-- 一般：手绘圆环 -->
    <g id="mk-neutral">
      <path d="M12 3.6c4.7 0 8.5 3.7 8.4 8.4 0 4.7-3.8 8.5-8.5 8.4-4.6 0-8.4-3.8-8.3-8.5C3.6 7.4 7.4 3.6 12 3.6Z"/>
    </g>
    <!-- 不喜欢：爱心加一道斜线 -->
    <g id="mk-dislike">
      <path d="M12 20.4c-.4 0-.8-.15-1.1-.42C6.3 15.9 3.4 13.2 3.4 9.9c0-2.6 2-4.6 4.5-4.6 1.6 0 3.1.8 4.1 2.2 1-1.4 2.5-2.2 4.1-2.2 2.5 0 4.5 2 4.5 4.6 0 3.3-2.9 6-7.5 10.1-.3.27-.7.42-1.1.42Z"/>
      <path d="M5.8 18.4 18.2 5.6" fill="none" stroke-width="1.5"/>
    </g>
    <!-- 状态/分类用的小色点 -->
    <g id="mk-dot"><circle cx="12" cy="12" r="8.2"/></g>
  </defs>
</svg>

<div class="wrap">
  <div class="stage">
    <div class="phone">

      <!-- ================= 总览 ================= -->
      <div class="screen on" id="scr-home">

        <div class="topbar">
          <div class="avatar">简</div>
          <div class="grp">
            <button class="circ c1" id="qSettings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.6v2.2M12 18.2v2.2M4.7 7.8l1.9 1.1M17.4 15.1l1.9 1.1M4.7 16.2l1.9-1.1M17.4 8.9l1.9-1.1"/></svg></button>
          </div>
        </div>

        <div class="hero">
          <span class="tape p" style="left:-13px;top:-10px;transform:rotate(-16deg)"></span>
          <span class="tape b" style="right:-12px;bottom:-9px;transform:rotate(-14deg)"></span>
          <svg viewBox="0 0 338 151" preserveAspectRatio="none" aria-label="我的收纳">
            <use href="#heroPath" fill="#c9e8cf" stroke="#16171b" stroke-width="3" filter="url(#rough)"/>
            <clipPath id="clipHero"><use href="#heroPath"/></clipPath>
            <g clip-path="url(#clipHero)"><use href="#dryStrokes"/></g>
            <g filter="url(#rough2)"><line x1="20" y1="54" x2="318" y2="53" stroke="#16171b" stroke-width="2.4" stroke-linecap="round"/></g>
          </svg>
          <div class="over">
            <div class="ttl">我的收纳</div>
            <div class="mid">
              <span class="split" id="heroSplit"></span>
              <span class="big" id="heroTotal">0</span>
            </div>
            <div class="foot"><span id="heroEntries"></span><span id="heroApps"></span></div>
          </div>
        </div>

        <div class="sec-head"><b>极简目标</b></div>
        <div class="goal" id="goalCard">
          <div class="r1">
            <div class="big"><span class="n" id="goalNow">0</span><span class="of" id="goalOf">/ 0</span></div>
            <span class="tag" id="goalTag">—</span>
          </div>
          <div class="gbar">
            <svg viewBox="0 0 300 12" preserveAspectRatio="none">
              <g filter="url(#rough2)">
                <line x1="4" y1="6" x2="296" y2="6" stroke="#16171b" stroke-width="6.4" stroke-linecap="round" opacity=".13"/>
                <line id="goalBar" x1="5" y1="6" x2="277" y2="6" stroke="#16171b" stroke-width="6.4" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
          <div class="hint" id="goalHint">—</div>
        </div>

        <div class="sec-head"><b>分类</b></div>
        <div class="grid2" id="catGrid"></div>

      </div>

      <!-- ================= 物品列表 ================= -->
      <div class="screen" id="scr-items">

        <div class="page-head">
          <h2 id="listTitle">物品</h2>
          <span class="cnt" id="listCnt"></span>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6 20 20"/></svg>
          <input id="q" type="text" placeholder="搜索名称、位置、备注">
        </div>

        <!-- 状态放最上面 -->
        <div class="chipRow">
          <span class="lb">状态</span>
          <div class="chips small" id="stChips">
            <button class="chip" data-st="inuse">在用中</button>
            <button class="chip" data-st="stored">收纳中</button>
            <button class="chip" data-st="consuming">消耗中</button>
            <button class="chip" data-st="todo">待处理</button>
          </div>
        </div>
        <!-- 以下三行只在「在用中 / 收纳中」时出现：
             消耗品和待处理的东西没必要再按喜欢/位置/分类去筛 -->
        <div id="filterGroup">
          <div class="chipRow">
            <span class="lb">喜欢</span>
            <div class="chips small" id="likeChips">
              <button class="chip" data-like="like">喜欢</button>
              <button class="chip" data-like="neutral">一般</button>
              <button class="chip" data-like="dislike">不喜欢</button>
            </div>
          </div>
        </div>
        <div class="chipRow" id="locRow" style="display:none">
          <span class="lb">位置</span>
          <div class="chips small" id="locChips"></div>
        </div>
        <div class="chipRow" id="seasonRow" style="display:none">
          <span class="lb">季节</span>
          <div class="chips small" id="seasonChips"></div>
        </div>
        <!-- 分类行：平时不显示（跟季节行一样按条件出现）。
             只有从总览点了某个分类进来、或正在按分类筛的时候才出现，
             方便切换 / 取消。 -->
        <div class="chipRow" id="catRow" style="display:none">
          <span class="lb">分类</span>
          <div class="chips" id="catChips"></div>
        </div>

        <div class="count-row">
          <b id="resTitle">全部物品</b>
          <span id="resCnt"></span>
        </div>

        <div class="igrid" id="igrid"></div>

      </div>

      <button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.7" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>

      <!-- ================= 软件列表 ================= -->
      <div class="screen" id="scr-apps">

        <div class="page-head">
          <h2>手机软件</h2>
          <span class="cnt" id="appCnt"></span>
        </div>

        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6 20 20"/></svg>
          <input id="aq" type="text" placeholder="搜索软件名、备注">
        </div>

        <!-- 必需程度放最上面 -->
        <div class="chipRow">
          <span class="lb">必需</span>
          <div class="chips small" id="needChips">
            <button class="chip" data-need="need">必需</button>
            <button class="chip" data-need="temp">暂用</button>
            <button class="chip" data-need="todel">待删</button>
          </div>
        </div>

        <div class="count-row">
          <b id="appResTitle">全部软件</b>
          <span id="appResCnt"></span>
        </div>

        <div class="alist" id="alist"></div>

      </div>

      <button class="fab" id="fabApp"><svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.7" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>

      <!-- ================= 设置 ================= -->

<script>
/* 禁掉双指捏合缩放。加进主屏后还能捏小的话，露出的白边会让人一眼看出是网页。
   viewport 的 user-scalable=no 在 iOS 上基本被忽略，真正管用的是这两条：
     - gesturestart/change/end 是 iOS Safari 专有事件，拦掉即可
     - touchmove 里判断多指兜底（部分 WebView 不发 gesture 事件）
   注意：双击放大交给 CSS 的 touch-action:manipulation，
   千万别在 touchend 里 preventDefault —— 那会把后续 click 一起吃掉，按钮全点不动。
   iOS「辅助功能 → 缩放」的三指手势是系统级，网页拦不住也不该拦。 */
(function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
})();

/* ================= 动效内核 =================
   规范来源：app-interaction-design skill
   - 按钮按下/松手：button-feedback 的「硬阴影下压」
   - 点按钮长出面板：shape-and-text-motion 的 Trigger Morph
   - 长按拖拽：motion-effects 的「液态形变」+ interaction-patterns 的「拖拽排序」 */
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

/* 极简弹簧：x 当前值、t 目标值、v 速度、k 软硬、d 阻尼 */
function makeSpring(x = 0, k = 700, d = 40){ return { x, t:x, v:0, k, d }; }
function stepSpring(s, dt){
  s.v += (s.t - s.x) * s.k * dt;
  s.v *= Math.exp(-s.d * dt);
  s.x += s.v * dt;
  return s.x;
}

/* 一帧循环：只跑还活跃的弹簧，省电 */
const fxUpdaters = [];
let fxLast = performance.now();
function fxLoop(now){
  const dt = clamp((now - fxLast) / 1000, 0.001, 0.033);
  fxLast = now;
  for (const u of fxUpdaters) if (u.active) u.fn(dt);
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(t => { fxLast = t; requestAnimationFrame(fxLoop); });

/* 全局动效开关（尊重系统「减少动态效果」） */
const FX = {
  motionOff: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
};
if (window.matchMedia){
  try {
    window.matchMedia('(prefers-reduced-motion: reduce)')
      .addEventListener('change', e => { FX.motionOff = e.matches; });
  } catch(e){}
}

/* ---------- 硬阴影下压：按下 / 松手用两组弹簧 ----------
   文档要求：阴影钉在纸上不动，按钮面下沉去「吃掉」它；
   按下过阻尼（几乎不过冲），松手欠阻尼（出回弹）。 */
const PRESS_DOWN = { k:700, d:40 };   // ζ≈0.76，干脆到底
const PRESS_UP   = { k:700, d:22 };   // ζ≈0.42，松手回弹
const PRESS_DEPTH = 4.2;              // 下沉行程（阴影 5px，留 0.8px 黑边）

function bindPressFeedback(root){
  const scope = root || document;
  // 自动识别按钮：不依赖手写属性，任何 <button>（含动态生成的）都有按压反馈
  const sel = 'button, [data-press], .cat[data-cat], .goal';
  scope.querySelectorAll(sel).forEach(el => {
    if (el.__pressBound) return;
    // 输入类控件不需要按压反馈
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    // Tab 栏已有滑动指示块，再叠按压会显得抖（文档明确排除 Tabs）
    if (el.classList.contains('tb')) return;
    el.__pressBound = true;

    const spring = makeSpring(0, PRESS_DOWN.k, PRESS_DOWN.d);
    let running = false;
    // 阴影量：按元素自身 box-shadow 的纵向偏移推算，最大限制在 5px
    const shadowY = (() => {
      const sh = getComputedStyle(el).boxShadow || '';
      const m = sh.match(/rgba?\([^)]*\)\s+(-?[\d.]+)px\s+(-?[\d.]+)px/);
      return m ? clamp(parseFloat(m[2]) || 3, 2, 5) : 3;
    })();

    const updater = { active:false, fn(dt){
      stepSpring(spring, dt);
      const y = spring.x;
      el.style.transform = y === 0 ? '' : `translateY(${y.toFixed(2)}px)`;
      // 阴影随着按钮下沉被吃掉，两者由同一个弹簧值驱动
      el.style.boxShadow = `0 ${(shadowY - y).toFixed(2)}px 0 rgba(22,23,27,.16)`;
      if (Math.abs(spring.v) < 0.5 && Math.abs(spring.t - spring.x) < 0.05){
        spring.x = spring.t; spring.v = 0;
        el.style.transform = spring.t === 0 ? '' : `translateY(${spring.t}px)`;
        el.style.boxShadow = '';
        updater.active = false;
      }
    }};
    fxUpdaters.push(updater);

    const down = () => {
      if (FX.motionOff){ el.style.transform = `translateY(${PRESS_DEPTH}px)`; return; }
      spring.t = PRESS_DEPTH; spring.k = PRESS_DOWN.k; spring.d = PRESS_DOWN.d;
      updater.active = true;
    };
    const up = () => {
      if (FX.motionOff){ el.style.transform = ''; return; }
      spring.t = 0; spring.k = PRESS_UP.k; spring.d = PRESS_UP.d;
      updater.active = true;
    };

    el.addEventListener('pointerdown', e => { if (e.button === undefined || e.button === 0) down(); });
    ['pointerup','pointercancel','pointerleave','blur'].forEach(ev => el.addEventListener(ev, up));
    // 键盘触发也要有反馈
    el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') down(); });
    el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });
  });
}

/* ---------- Trigger Morph：面板从被点按钮的形状长出来 ----------
   文档要求：起点必须等于按钮真实矩形（实时量），圆角与尺寸一起插值，
   内容延迟到约 60% 才淡入，关闭必须原路收回。 */
let lastPointerDownTarget = null;
/* 记住「这次点是哪个元素触发的」，供形变展开当起点。
   选择器要覆盖所有会弹面板的入口：按钮、chips、分类卡、物品卡、软件行、目标卡。 */
const MORPH_ANCHOR_SEL = [
  'button',
  '.chip',
  '.cat',
  '.icard',
  '.arow',
  '.goal',
  '.st-row',
  '.mini',
  '[data-morph-anchor]'
].join(',');
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest(MORPH_ANCHOR_SEL);
  lastPointerDownTarget = t || null;
}, true);

function morphFromButton(panel, btnEl, done, opts){
  const o = opts || {};
  const dur = o.duration || 620;
  const endRadius = o.radius || '19px';
  const btn = btnEl || lastPointerDownTarget;
  panel.style.transformOrigin = '50% 100%';

  if (!btn || FX.motionOff){
    // 拿不到按钮（或用户关了动效）就普通弹出，功能不受影响
    panel.animate([{opacity:0},{opacity:1}], {duration:180, easing:'ease-out'});
    if (done) done();
    return;
  }

  const b = btn.getBoundingClientRect();
  const p = panel.getBoundingClientRect();
  // 起点：和按钮同尺寸、同圆角；终点：面板当前几何
  const sx = Math.max(0.04, b.width / p.width);
  const sy = Math.max(0.04, b.height / p.height);
  const dx = (b.left + b.width / 2) - (p.left + p.width / 2);
  const dy = (b.top + b.height / 2) - (p.top + p.height / 2);

  const inner = panel.querySelector('.modal-inner') || panel.firstElementChild;
  const anim = panel.animate([
    { transform:`translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, borderRadius:'999px', opacity:1 },
    { transform:'translate(0,0) scale(1,1)', borderRadius:endRadius, opacity:1 }
  ], { duration: FX.motionOff ? 1 : dur, easing:'cubic-bezier(.22,.9,.24,1)', fill:'both' });

  if (inner){
    inner.animate([{opacity:0, offset:0},{opacity:0, offset:.62},{opacity:1, offset:1}],
      { duration: FX.motionOff ? 1 : dur, easing:'linear', fill:'both' });
  }
  anim.onfinish = () => { if (done) done(); };
  return anim;
}

  const cards = orderedCats.map(c => {
    const qty = catQty(c.id);

      ? SEASONS.map(s => `${s.name} ${sumQty(ITEMS.filter(i => i.c === 'cloth' && i.season === s.id))}`).join(' · ')
      : '';
    if (!hasGoal){

    const tip = over ? `目标 ${c.goal} · 超出 ${d}` : `目标 ${c.goal} · 还差 ${-d}`;
    return `<div class="cat" data-cat="${c.id}">
      <div class="ct"><span class="dot" style="background:${c.tone}"></span><span>${c.name}</span><span class="arw">›</span></div>
      <div class="cn"><span class="n">${qty}</span><small>件</small></div>
      <div class="mbar"><span class="tr"></span><span class="fl" style="width:${Math.min(100,Math.round(ratio*100))}%;background:${color}"></span></div>
      <div class="cg${over ? ' over' : ''}">${tip}</div>
      ${seasonTxt ? `<div class="cg" style="color:#a3a4ab">${seasonTxt}</div>` : ''}
    </div>`;
  }).join('');

  // 「新建分类」不再放在桌面（用户要求）：改到「设置 → 分类管理」里
  $('#catGrid').innerHTML = cards;
  saveSoon();
}

/* 长按分类卡 → 拖拽排序（和物品卡片同一套手势） */
(function initCatDrag(){
  const grid = $('#catGrid');
  let holdTimer = null, card = null, id = null, started = false;
  let ghost = null, offsetX = 0, offsetY = 0, lastSwap = null;

  const clearHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  // 长按还没触发就被打断（弹面板/切页）→ 清干净，别让 ghost 凭空冒出来
  if (typeof pendingHoldCancels !== 'undefined') pendingHoldCancels.push(function(){
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card){ card.classList.remove('dragging-src'); card = null; }
    id = null; started = false; lastSwap = null;
  });

  const begin = (x, y) => {
    // 兜底：卡片已被重绘/移除，或计时器早该被取消 → 绝不凭空造一个 ghost
    if (!card || !card.isConnected) return;
    started = true;
    const r = card.getBoundingClientRect();
    offsetX = x - r.left; offsetY = y - r.top;
    ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    card.classList.add('dragging-src');
    if (navigator.vibrate) navigator.vibrate(12);
  };

  const move = (x, y) => {
    if (!ghost) return;
    ghost.style.left = (x - offsetX) + 'px';
    ghost.style.top = (y - offsetY) + 'px';
    ghost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    ghost.style.display = '';
    const over = el && el.closest('#catGrid .cat[data-cat]');
    if (over && over !== card && over !== lastSwap){
      lastSwap = over;
      const kids = [...grid.children];
      if (kids.indexOf(card) < kids.indexOf(over)) grid.insertBefore(card, over.nextSibling);
      else grid.insertBefore(card, over);
    }
  };

  const end = () => {
    clearHold();
    if (ghost){ ghost.remove(); ghost = null; }
    if (card) card.classList.remove('dragging-src');
    if (started){
      const ids = [...grid.querySelectorAll('.cat[data-cat]')].map(el => el.dataset.cat);
      ids.forEach((cid, n) => { const c = CATS.find(x => x.id === cid); if (c) c.order = n; });
      CATS.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
      renderHome(); renderCatChips();
      toast('分类顺序已保存');
    }
    card = null; id = null; started = false; lastSwap = null;
  };

  const onStart = (x, y, target) => {
    card = target.closest('#catGrid .cat[data-cat]');
    if (!card) return;
    if (target.closest('.arw')){ card = null; return; }
    id = card.dataset.cat;
    clearHold();
    holdTimer = setTimeout(() => begin(x, y), 420);
  };

  grid.addEventListener('touchstart', e => {
    const t = e.touches[0]; onStart(t.clientX, t.clientY, e.target);
  }, { passive: true });
  grid.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (started){ if (e.cancelable) e.preventDefault(); move(t.clientX, t.clientY); }
    else clearHold();
  }, { passive: false });
  grid.addEventListener('touchend', end);
  grid.addEventListener('touchcancel', end);
  grid.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => { if (started) move(e.clientX, e.clientY); });
  // ★ 松手无条件收尾：即使没进入拖拽，也要清掉长按计时器，
  //   否则"点一下卡片"之后计时器仍会触发，凭空冒出一个跟手浮层
  window.addEventListener('mouseup', end);
})();

/* ================= 物品列表 ================= */
/* 筛选行显隐：只有「在用中 / 收纳中」需要按喜欢/位置/季节/分类再筛；
   消耗中（会用完）和待处理（准备处理）不显示这些行。 */
function filtersAllowed(){
  return (state.st === 'all' || state.st === 'inuse' || state.st === 'stored');
}

function syncFilterGroup(){
  const show = filtersAllowed();
  const g = $('#filterGroup');
  if (g) g.style.display = show ? '' : 'none';
  if (!show){
    // 隐藏时同步清掉这些筛选，避免「看不见却仍在生效」
    state.cat = 'all'; state.season = 'all'; state.like = 'all'; state.loc = 'all';
    $$('#likeChips .chip').forEach(c => c.classList.remove('on'));
  }
  renderCatChips();   // 分类行的显隐由这里统一决定
}

function renderCatChips(){
  // 分类行跟季节行一样是「按需出现」：平时不显示。
  // 只有正在按分类筛（从总览点了某个分类进来）时才出现，方便切换或取消。
  // 新建/改名/删除都在「设置 → 分类管理」里。
  const list = CATS.map(c => ({ ...c, qty: catQty(c.id) }));
  $('#catChips').innerHTML = list.map(c =>
    `<button class="chip${state.cat === c.id ? ' on' : ''}" data-cat="${c.id}">${c.name}<span class="n">${c.qty}</span></button>`
  ).join('');
  const row = $('#catRow');
  if (row){
    const active = state.cat !== 'all';
    row.style.display = (filtersAllowed() && active) ? 'flex' : 'none';
  }
}

function renderSeasonChips(){
  const row = $('#seasonRow');
  if (!filtersAllowed() || state.cat !== 'cloth'){ row.style.display = 'none'; return; }
  row.style.display = 'flex';
  const base = ITEMS.filter(i => i.c === 'cloth');
  const list = SEASONS.map(s => ({ ...s, qty: sumQty(base.filter(i => i.season === s.id)) }));
  $('#seasonChips').innerHTML = list.map(s =>
    `<button class="chip${state.season === s.id ? ' on' : ''}" data-season="${s.id}">${s.name}<span class="n">${s.qty}</span></button>`
  ).join('');
}

/* 位置筛选：列出当前分类下出现过的位置（有位置的才列） */
function renderLocChips(){
  const row = $('#locRow');
  if (!filtersAllowed()){ row.style.display = 'none'; state.loc = 'all'; return; }
  const base = ITEMS.filter(i => state.cat === 'all' || i.c === state.cat);
  const counts = new Map();
  base.forEach(i => {
    const k = (i.loc || '').trim();
    if (!k) return;
    counts.set(k, (counts.get(k) || 0) + 1);
  });
  // 位置种类太少就不占一行（少于 2 个没筛选意义）
  if (counts.size < 2){ row.style.display = 'none'; state.loc = 'all'; return; }
  row.style.display = 'flex';
  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  $('#locChips').innerHTML = sorted.map(([name, n]) =>
    `<button class="chip${state.loc === name ? ' on' : ''}" data-loc="${name}">${name}<span class="n">${n}</span></button>`
  ).join('');
}

function renderItems(){
  syncFilterGroup();
  const q = state.q.trim().toLowerCase();
  const rows = ITEMS.filter(i =>
    (state.cat === 'all' || i.c === state.cat) &&
    (state.cat !== 'cloth' || state.season === 'all' || i.season === state.season) &&
    (state.like === 'all' || i.like === state.like) &&
    (state.st === 'all' || i.st === state.st) &&
    (state.loc === 'all' || (i.loc || '').trim() === state.loc) &&
    (!q || i.n.toLowerCase().includes(q) || (i.loc || '').toLowerCase().includes(q))
  );
  // 按用户排的顺序显示（拖拽排序）
  rows.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
  const qty = sumQty(rows);

  const catName = state.cat === 'all' ? '全部物品' : catOf(state.cat).name;
  const likeName = { all:'', like:' · 喜欢', neutral:' · 一般', dislike:' · 不喜欢' }[state.like];
  const stName = state.st === 'all' ? '' : ` · ${ST_TEXT[state.st]}`;
  const seName = (state.cat === 'cloth' && state.season !== 'all')
    ? ` · ${(SEASONS.find(s => s.id === state.season) || {}).name}` : '';
  const locName = state.loc === 'all' ? '' : ` · ${state.loc}`;
  $('#resTitle').textContent = catName + seName + locName + likeName + stName;
  $('#resCnt').textContent = `${rows.length} 条 · ${qty} 件`;
  $('#listTitle').textContent = state.cat === 'all' ? '物品' : catOf(state.cat).name;
  $('#listCnt').textContent = `${rows.length} 条 · ${qty} 件`;

  const cards = rows.map(i => {
    const k = ITEMS.indexOf(i);
    const tint = TINTS[k % TINTS.length];
    const seasonTxt = i.season ? (SEASONS.find(s => s.id === i.season) || {}).name : '';
    const locTxt = [i.loc, seasonTxt].filter(Boolean).join(' · ');

    const phInner = i.photo

           <svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.3" stroke-linecap="round"><path d="M12 7v10M7 12h10"/></svg>
           加照片
         </span>
         <svg><use href="#${i.ic || 'ic-box'}"/></svg>`;

    const qtyBadge = i.q > 1 ? `<span class="qty">×${i.q}</span>` : '';
    const useCount = i.uses || 0;
    const useBadge = useCount > 0 ? `<span class="use">今天用过 ${useCount}</span>` : '';

    // 日期角标放图片左上角（没有日期就不显示）
    const dateBadge = i.buy ? `<span class="buy">${i.buy.slice(5).replace('-', '/')}</span>` : '';

    return `<div class="icard${i.st === 'todo' ? ' todo' : ''}" data-item="${i.id}" draggable="false">
      <div class="ph" style="background:${i.photo ? '#fff' : tint}" data-photo="${i.id}">
        ${phInner}
        ${qtyBadge}
        ${dateBadge}
        <span class="lk" data-lk="${i.id}" title="改喜欢程度" style="--lkc:${LIKE_FILL[i.like]}">
          <svg viewBox="0 0 24 24"><use href="#mk-${i.like === 'like' ? 'like' : i.like === 'dislike' ? 'dislike' : 'neutral'}"/></svg>
        </span>
        <span class="st" data-status="${i.id}" style="background:${ST_COLOR[i.st]}">${ST_TEXT[i.st]}</span>
        ${useBadge}
      </div>
      <div class="meta">
        <div class="row-name">
          <span class="nm-txt">${i.n}</span>
          <span class="loc-txt">${i.loc || ''}</span>
          <button class="use-btn" data-usebtn="${i.id}" title="记一次使用">
            <svg viewBox="0 0 24 24" fill="none" stroke="#16171b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  // 不再放「添加物品」虚线卡——用右下角的加号按钮
  $('#igrid').innerHTML = cards;

  if (!rows.length){
    $('#igrid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <b>没有符合条件的物品</b><span>换个筛选，或者点右下角的加号添加</span></div>`;
  }
  saveSoon();
}

/* ================= 导航 ================= */
let switching = false;
/* 页面过渡 · 横向推移：按 Tab 顺序决定从哪边滑进来 */
const TAB_ORDER = ['items', 'home', 'apps'];

function showTab(tab, opts){
  const prevTab = state.tab;
  state.tab = tab;
  // 切页会打断正在等待的长按：先掐掉，别让 ghost 浮层跟到新页面上
  cancelAllHolds();
  // 设置是覆盖层（overlay），不参与 Tab 切换
  const map = { items:'scr-items', apps:'scr-apps', home:'scr-home' };
  const screenId = map[tab] || 'scr-home';
  const next = document.getElementById(screenId);
  const cur = $$('.screen').find(s => s.classList.contains('on') && !s.classList.contains('overlay') && s.id !== screenId);

  $$('.tb').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').style.display = tab === 'items' ? 'grid' : 'none';
  $('#fabApp').style.display = tab === 'apps' ? 'grid' : 'none';
  syncTabInd();

  if (!next || next === cur) return;

  if (cur) cur.classList.remove('on');
  next.classList.add('on');

  // 普通 Tab 切换：横向推移（往右滑入 / 往左滑入）
  const a = TAB_ORDER.indexOf(prevTab), b = TAB_ORDER.indexOf(tab);
  let dir = 'slide-r';
  if (a >= 0 && b >= 0) dir = (b > a) ? 'slide-r' : 'slide-l';

  next.classList.remove('slide-r','slide-l');
  void next.offsetWidth;
  next.classList.add(dir);
  setTimeout(() => next.classList.remove('slide-r','slide-l'), 340);
}

/* 滑动指示块：贴到当前选中的 Tab 上（详情页/设置页不占 Tab，就保持原位置） */
function syncTabInd(){
  const ind = $('#tabInd');
  if (!ind) return;
  const active = $$('.tb').find(b => b.classList.contains('on')) || $$('.tb')[0];
  if (!active) return;
  const bar = $('#tabbar').getBoundingClientRect();
  const r = active.getBoundingClientRect();
  ind.style.width = r.width + 'px';
  ind.style.transform = `translateX(${r.left - bar.left - 5}px)`;
}
function goItems(cat){
  if (cat){ state.cat = cat; if (cat !== 'cloth') state.season = 'all'; }
  renderCatChips(); renderSeasonChips(); renderLocChips(); renderItems();
  showTab('items');
  $('#scr-items').scrollTop = 0;
}



/* ================= 弹层 ================= */
const mask = $('#mask'), modal = $('#modal');
let modalAnim = null;

function openModal(html, anchorEl){
  // 弹面板说明用户已经松手了：先把还挂着的长按计时器掐掉，
  // 否则 420ms 后 begin() 会照着已松手的位置克隆一张卡飘在屏幕上（去不掉）
  cancelAllHolds();
  modal.innerHTML = html;
  // 关掉 CSS 里的默认弹出动画，改由 Trigger Morph 接管
  modal.style.animation = 'none';
  mask.classList.add('on');
  // 面板的起点要贴合被点的按钮：优先用调用方指定的锚点，否则用 pointerdown 记下的那个
  const btn = anchorEl || lastPointerDownTarget;
  if (modalAnim){ try { modalAnim.cancel(); } catch(e){} }
  modalAnim = morphFromButton(modal, btn);
}
function closeModal(){
  mask.classList.remove('on');
  if (modalAnim){ try { modalAnim.cancel(); } catch(e){} modalAnim = null; }
  // 收起时把内联样式清掉，下次打开才不会带着旧几何
  modal.style.transform = '';
  modal.style.borderRadius = '';
  modal.style.opacity = '';
}
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });

/* ================= 照片：插画化处理（方案一，纯前端） =================
   流程：降采样 → 提饱和 + 色彩量化（平涂色块）→ 在小图上找边缘 → 放大叠加描边 → 提亮
   关键点：必须「先提饱和再量化」，否则低饱和的颜色（如深绿）会被量化压成灰色。
   全部在本地 canvas 完成，照片不出设备。 */
function illustrate(srcCanvas, level){
  const w = srcCanvas.width, h = srcCanvas.height;
  const strong = level >= 2;

  // 1) 降采样到小块（块越小 → 色块越明显）
  const dScale = strong ? 0.14 : 0.28;
  const dw = Math.max(12, Math.round(w * dScale)), dh = Math.max(12, Math.round(h * dScale));
  const down = document.createElement('canvas');
  down.width = dw; down.height = dh;
  const dctx = down.getContext('2d', { willReadFrequently: true });
  dctx.imageSmoothingEnabled = true;
  dctx.imageSmoothingQuality = 'high';
  dctx.drawImage(srcCanvas, 0, 0, dw, dh);

  // 2) 在小图上提饱和 + 量化
  const idata = dctx.getImageData(0, 0, dw, dh);
  const d = idata.data;
  const sat = strong ? 1.55 : 1.25;
  const steps = strong ? 5 : 7;
  const q = 255 / (steps - 1);
  for (let i = 0; i < d.length; i += 4){
    let r = d[i], g = d[i+1], b = d[i+2];
    const gray = 0.299*r + 0.587*g + 0.114*b;
    r = gray + (r - gray) * sat;
    g = gray + (g - gray) * sat;
    b = gray + (b - gray) * sat;
    r = r < 0 ? 0 : r > 255 ? 255 : r;
    g = g < 0 ? 0 : g > 255 ? 255 : g;
    b = b < 0 ? 0 : b > 255 ? 255 : b;
    d[i]   = Math.round(Math.round(r / q) * q);
    d[i+1] = Math.round(Math.round(g / q) * q);
    d[i+2] = Math.round(Math.round(b / q) * q);
  }
  dctx.putImageData(idata, 0, 0);

  // 3) 在小图上算边缘（此时边界是硬边，梯度干净 → 线条连续）
  const lum = new Float32Array(dw * dh);
  for (let i = 0, p = 0; i < d.length; i += 4, p++){
    lum[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }
  const mask = document.createElement('canvas');
  mask.width = dw; mask.height = dh;
  const mctx = mask.getContext('2d', { willReadFrequently: true });
  const mdata = mctx.createImageData(dw, dh);
  const m = mdata.data;
  const thr = strong ? 20 : 28;
  const raw = new Uint8Array(dw * dh);
  for (let y = 1; y < dh - 1; y++){
    for (let x = 1; x < dw - 1; x++){
      const p = y * dw + x;
      const gx = lum[p+1] - lum[p-1];
      const gy = lum[p+dw] - lum[p-dw];
      if (Math.sqrt(gx*gx + gy*gy) > thr) raw[p] = 1;
    }
  }
  // 去噪：孤立点（周围没有邻居）不算边缘，避免背景出现麻点
  for (let y = 1; y < dh - 1; y++){
    for (let x = 1; x < dw - 1; x++){
      const p = y * dw + x;
      if (!raw[p]) continue;
      const n = raw[p-1] + raw[p+1] + raw[p-dw] + raw[p+dw]
              + raw[p-dw-1] + raw[p-dw+1] + raw[p+dw-1] + raw[p+dw+1];
      if (n < 2) continue;                       // 邻居太少 → 丢弃
      const i = p * 4;
      m[i] = m[i+1] = m[i+2] = 0;
      m[i+3] = 255;
    }
  }
  mctx.putImageData(mdata, 0, 0);

  // 4) 色块放大回原尺寸
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(down, 0, 0, w, h);

  // 5) 叠描边（轻微模糊 → 像手绘线条而不是像素边）
  ctx.globalAlpha = strong ? 0.5 : 0.34;
  ctx.filter = 'blur(0.8px)';
  ctx.drawImage(mask, 0, 0, w, h);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;

  // 6) 轻微提亮
  const out = ctx.getImageData(0, 0, w, h);
  const o = out.data;
  const lift = strong ? 12 : 8;
  for (let i = 0; i < o.length; i += 4){
    o[i]   = Math.min(255, o[i]   + lift);
    o[i+1] = Math.min(255, o[i+1] + lift);
    o[i+2] = Math.min(255, o[i+2] + lift);
  }
  ctx.putImageData(out, 0, 0);

  return cv;
}

let photoTargetId = null;
let photoTargetMode = 'card';
let appPhotoTargetId = null;
on('#filePick', 'change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';

  // 软件图标
  if (appPhotoTargetId){
    const aid = appPhotoTargetId; appPhotoTargetId = null;
    if (!file) return;
    const fr0 = new FileReader();
    fr0.onload = ev => {
      const im = new Image();
      im.onload = () => {
        const S = 200;
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        const ctx = cv.getContext('2d');
        const side = Math.min(im.naturalWidth, im.naturalHeight);
        ctx.drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, S, S);
        const a = APPS.find(x => x.id === aid);
        if (a){
          a.photo = cv.toDataURL('image/jpeg', .82);
          renderApps();
          toast('图标已保存');
        }
      };
      im.onerror = () => toast('这张图读不出来，换一张试试');
      im.src = ev.target.result;
    };
    fr0.readAsDataURL(file);
    return;
  }

  if (!file || !photoTargetId) return;
  const id = photoTargetId, mode = photoTargetMode;
  photoTargetId = null; photoTargetMode = 'card';
  const fr = new FileReader();
  fr.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);

      const out = photoStyle > 0 ? illustrate(cv, photoStyle) : cv;
      const it = ITEMS.find(x => x.id === id);
      if (it){
        it.photo = out.toDataURL('image/jpeg', .78);
        renderItems();
        toast(photoStyle > 0 ? '照片已插画化并保存' : '照片已保存');
      }
    };
    img.onerror = () => toast('这张图读不出来，换一张试试');
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file);
});

const APP_TONES = ['#ded0f0','#bcd9ee','#f5d7a8','#f8d8c0','#f2cfcf','#cfe4f4','#d9d9e8'];
function appTone(a){
  const s = a.n || '';
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return APP_TONES[h % APP_TONES.length];
}

function applyAccent(id){
  const p = ACCENT_PRESETS.find(x => x.id === id) || ACCENT_PRESETS[0];
  accentId = p.id;
  const root = document.documentElement.style;
  root.setProperty('--accent', p.accent);
  root.setProperty('--accent-deep', p.deep);
  root.setProperty('--hl', p.hl);
  root.setProperty('--hl-soft', p.hl2);
  // 主卡是 SVG <use>，fill 属性不吃 CSS 变量，得单独设
  const hero = document.querySelector('.hero svg use');

}

function renderSwatches(){
  const box = $('#stSwatches');
  if (!box) return;
  box.innerHTML = ACCENT_PRESETS.map(p =>
    `<button class="st-sw${accentId === p.id ? ' on' : ''}" data-accent="${p.id}"
       style="background:${p.accent}" title="${p.name}"></button>`).join('');
}

/* ================= 设置页：手势转场（推拉门） =================
   上级页面留在原地（轻微缩小），设置页从右侧推上来覆盖它。
   按住左边缘往右拖 = 亲手推门，位移直接等于进度；松手按距离判定。 */
const OVERLAY_ID = 'scr-settings';
let overlayAnimating = false;

function goSettings(){
  renderSettings();
  const scr = $('#' + OVERLAY_ID);
  scr.scrollTop = 0;
  openOverlay(scr);
}

function openOverlay(scr){
  const phone = $('.phone');
  cancelAllHolds();
  overlayAnimating = true;
  // 基础状态先落到位（万一动画不执行，元素也是正确位置，不会卡在屏外）
  scr.style.transform = '';
  scr.classList.add('on');
  phone.classList.add('covered');
  const w = phone.getBoundingClientRect().width;

  if (FX.motionOff){ overlayAnimating = false; return; }
  // fill:'none'：动画只负责"入场过程"，结束后自动回到基础状态（正确位置）
  const anim = scr.animate([
    { transform:`translateX(${w}px)` },
    { transform:'translateX(0)' }
  ], { duration:340, easing:'cubic-bezier(.22,1,.36,1)' });
  const done = () => { overlayAnimating = false; };
  anim.onfinish = done;
  anim.oncancel = done;
  setTimeout(done, 420);   // 兜底：动画不推进时也能解锁
}

/* progress: 0 = 完全挡在前面，1 = 完全推到屏外（露出上级页面） */
function setOverlayProgress(scr, progress){
  const phone = $('.phone');
  const w = phone.getBoundingClientRect().width;
  const p = Math.max(0, Math.min(1, progress));
  scr.style.transform = `translateX(${(p * w).toFixed(1)}px)`;
  // 上级页面随进度轻微放大回来，形成层次
  $$('.phone > .screen:not(.overlay)').forEach(el => {
    el.style.transform = `scale(${(0.97 + p * 0.03).toFixed(4)})`;
  });
}

/* 关闭：可以指定起点进度（手势中断时从当前位置继续收尾） */
function closeSettings(fromProgress){
  const scr = $('#' + OVERLAY_ID);
  const phone = $('.phone');
  if (!scr.classList.contains('on')) return;

  const finish = () => {
    scr.classList.remove('on');
    scr.style.transform = '';
    phone.classList.remove('covered');
    $$('.phone > .screen:not(.overlay)').forEach(el => {
      el.style.transform = '';
      el.style.filter = '';
    });
    overlayAnimating = false;
  };

  if (FX.motionOff){ finish(); return; }

  overlayAnimating = true;
  const w = phone.getBoundingClientRect().width;
  const start = (typeof fromProgress === 'number') ? fromProgress : 0;
  // fill:'none' —— 动画结束即回到基础状态，由 finish() 收掉 .on
  const anim = scr.animate([
    { transform:`translateX(${(start * w).toFixed(1)}px)` },
    { transform:`translateX(${w}px)` }
  ], { duration: 300, easing:'cubic-bezier(.32,.72,0,1)' });
  anim.onfinish = finish;
  anim.oncancel = finish;
  setTimeout(finish, 380);   // 兜底
}

on('#qSettings', 'click', goSettings);

/* ---------- 手势：在设置页上按住右滑 = 推门 ---------- */
(function initOverlayGesture(){
  const phone = $('.phone');
  let dragging = false, startX = 0, startY = 0, locked = null, w = 0, progress = 0;

  const scr = () => $('#' + OVERLAY_ID);

  const onDown = e => {
    const s = scr();
    if (!s || !s.classList.contains('on') || overlayAnimating) return;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    locked = null; progress = 0; dragging = true;
    w = phone.getBoundingClientRect().width;
  };

  const onMove = e => {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;

    if (locked === null){
      // 方向锁：横向明显大于纵向才算推门，否则交回页面滚动
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) locked = 'x';
      else if (Math.abs(dy) > 10) { dragging = false; return; }
      else return;
      if (locked === 'x') phone.classList.add('dragging-overlay');
    }
    if (e.cancelable) e.preventDefault();

    // 只允许往右推（往左是橡皮筋，位移 ×0.32）
    const raw = dx;
    progress = raw >= 0 ? (raw / w) : (raw / w) * 0.32;
    progress = Math.max(-0.06, Math.min(1, progress));
    setOverlayProgress(scr(), progress);
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    phone.classList.remove('dragging-overlay');
    if (locked !== 'x') return;
    const s = scr();
    // 唯一完成判据：拖过页宽 55%（快速轻扫不算，避免误关）
    if (progress > 0.55){ closeSettings(progress); locked = null; return; }

    // 没拖够 → 从当前位置弹回，不跳回起点
    const cur = Math.max(0, progress) * w;
    if (FX.motionOff){ setOverlayProgress(s, 0); locked = null; return; }

    overlayAnimating = true;
    const anim = s.animate([
      { transform:`translateX(${cur.toFixed(1)}px)` },
      { transform:'translateX(0)' }
    ], { duration: 280, easing:'cubic-bezier(.32,.72,0,1)', fill:'both' });
    const back = () => {
      try { anim.cancel(); } catch(e){}
      s.style.transform = '';
      setOverlayProgress(s, 0);
      overlayAnimating = false;
    };
    anim.onfinish = back;
    anim.oncancel = back;
    setTimeout(back, 340);   // 兜底
    locked = null;
  };

  phone.addEventListener('touchstart', onDown, { passive: true });
  phone.addEventListener('touchmove', onMove, { passive: false });
  phone.addEventListener('touchend', onUp);
  phone.addEventListener('touchcancel', onUp);
  phone.addEventListener('mousedown', e => onDown(e));
  window.addEventListener('mousemove', e => { if (dragging) onMove(e); });
  window.addEventListener('mouseup', () => { if (dragging) onUp(); });
})();

on('#stBody', 'click', e => {
  // 分类改名

  const sw = e.target.closest('[data-accent]');
  if (sw){ applyAccent(sw.dataset.accent); renderSwatches(); toast('主色已切换'); return; }

  // 数据
  if (e.target.closest('#stExport')){ exportBackup(); return; }
  if (e.target.closest('#stImport')){ importBackup(); return; }
  if (e.target.closest('#stClear')){ clearAllModal(); return; }
});

function renameCatModal(id){
  const c = CATS.find(x => x.id === id);
  if (!c) return;
  openModal(`
    <h3>重命名分类</h3>
    <p class="mhint">分类下的条目不会变，只是换个名字</p>
    <div class="fld">
      <label>分类名称</label>
      <input type="text" id="rcName" value="${c.name}" maxlength="8">
    </div>
    <div class="mrow">
      <button class="btn" id="rcCancel">取消</button>
      <button class="btn pri" id="rcOk">保存</button>
    </div>
  `);
  const inp = $('#rcName');
  setTimeout(() => { inp.focus(); inp.select(); }, 60);
  $('#rcCancel').addEventListener('click', closeModal);
  $('#rcOk').addEventListener('click', () => {
    const v = inp.value.trim();
    if (!v) return;
    c.name = v;
    closeModal(); renderSettings(); renderHome(); renderCatChips(); renderItems();

/* --- 分类删除（条目归入未分类） --- */
function delCatModal(id){
  const c = CATS.find(x => x.id === id);
  if (!c) return;
  const n = stCatCount(c);
  openModal(`
    <h3>删除「${c.name}」？</h3>
    <p class="mhint">${n > 0
      ? `这个分类下有 ${n} 条物品，删除后会归入「未分类」，不会丢。`
      : '这个分类下还没有物品，可以放心删。'}</p>
    <div class="mrow">
      <button class="btn" id="dcCancel">取消</button>
      <button class="btn dan" id="dcOk">删除</button>
    </div>
  `);
  $('#dcCancel').addEventListener('click', closeModal);
  $('#dcOk').addEventListener('click', () => {
    const orphans = ITEMS.filter(i => i.c === c.id);
    orphans.forEach(i => { i.c = 'none'; });
    // 只有真有物品要安置时才补「未分类」，空删除不留垃圾分类
    if (orphans.length && !CATS.some(x => x.id === 'none')){
      CATS.push({ id:'none', name:'未分类', tone:'#e6e6ea', goal:0 });
    }
    CATS.splice(CATS.findIndex(x => x.id === c.id), 1);
    // 删掉的正好是当前筛选的分类 → 回到不筛选
    if (state.cat === c.id) state.cat = 'all';
    closeModal();
    renderSettings(); renderHome(); renderCatChips(); renderItems();
    toast(`已删除分类「${c.name}」`);
  });
}
